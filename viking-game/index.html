<title>北境雄心</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Runic&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout：頂部狀態列＋桌面左側角色欄、右側行動面板；手機單欄，角色收進分頁。刻意單一深色主題（峽灣夜色）。 */
:root{
  --bg:#0f1417;        /* 峽灣夜色 */
  --panel:#172025;     /* 濕木板 */
  --panel2:#1e2a30;
  --line:#2c3a42;
  --bone:#e9e0cf;      /* 骨白 */
  --muted:#97a3a5;
  --ember:#d47a3b;     /* 鍛爐餘燼 */
  --frost:#8fbfcf;     /* 祈福與冰霜 */
  --blood:#b5432f;
  --gold:#cfab5c;
  --moss:#7f9d5e;
  --land:#1b2622;
  --sea:#0c1215;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-rune:"Noto Sans Runic","Segoe UI Historic",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.65;
  background-image:radial-gradient(ellipse at 20% -10%,#1d2a30 0,transparent 55%),radial-gradient(ellipse at 110% 110%,#231a14 0,transparent 50%);
  background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.rune{font-family:var(--f-rune);letter-spacing:.15em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:900}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--ember);margin:0 0 4px;text-transform:uppercase}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}

/* 標題畫面 */
.title-hero{padding-block:28px 8px;display:grid;gap:10px}
.title-hero .rune{color:var(--ember);font-size:15px}
.title-hero h1{font-size:clamp(44px,11vw,84px);line-height:1;letter-spacing:.06em}
.title-hero p{max-width:34em;color:var(--muted);margin:0}
.form{display:grid;gap:18px;margin-top:22px;max-width:720px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;letter-spacing:.08em}
.field input{width:100%;max-width:320px;background:var(--panel);border:1px solid var(--line);color:var(--bone);padding:10px 12px;font:inherit;font-size:17px;border-radius:4px}
.bgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bg-card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:4px}
.bg-card b{font-family:var(--f-display);font-size:17px}
.bg-card small{color:var(--muted);font-size:13px;line-height:1.5}
.bg-card .tag{color:var(--ember);font-size:12px}
.bg-card[aria-pressed="true"]{border-color:var(--ember);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--ember)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.primary{background:var(--ember);color:#1a0f08;border:0;padding:11px 22px;border-radius:4px;font-weight:700;font-size:16px}
.primary:disabled{opacity:.4}
.ghost{background:transparent;border:1px solid var(--line);padding:10px 18px;border-radius:4px;color:var(--bone)}

/* 遊戲主畫面 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(15,20,23,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .wrap{padding-block:10px;display:grid;gap:8px}
.top-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.top-line .nm{font-family:var(--f-display);font-weight:900;font-size:19px}
.top-line .sub{color:var(--muted);font-size:13px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.bar .track{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--blood);transition:width .4s}
.bar.xp .fill{background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;gap:5px;align-items:baseline;white-space:nowrap}
.chip span{color:var(--muted)}
.chip b{font-weight:700}
.chip.warn b{color:var(--blood)}
.bless{display:inline-flex;gap:3px;font-family:var(--f-rune)}
.bless i{font-style:normal;color:var(--line)}
.bless i.on{color:var(--frost);text-shadow:0 0 6px rgba(143,191,207,.6)}

.cols{display:grid;gap:18px;margin-top:16px}
@media (min-width:860px){.cols{grid-template-columns:280px 1fr}.tab-char{display:none!important}}
@media (max-width:859px){.side{display:none}}
.side{align-self:start;position:sticky;top:150px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.main{min-width:0;display:grid;gap:14px;align-content:start}
.goal{border-left:3px solid var(--ember);padding:8px 12px;background:var(--panel);font-size:14px}
.goal b{color:var(--ember);font-weight:700}
.goal .prog{color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;font-family:var(--f-display);font-weight:600;font-size:15px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--ember)}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ember);margin-left:4px;vertical-align:middle}

.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.act{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:3px;align-content:start;transition:border-color .15s,transform .15s}
.act:not(:disabled):hover{border-color:var(--ember);transform:translateY(-1px)}
.act b{font-family:var(--f-display);font-size:16px}
.act small{color:var(--muted);font-size:13px;line-height:1.5}
.act .gain{color:var(--gold);font-size:12px}
.act:disabled{opacity:.45}
.act.key{border-color:var(--ember);background:linear-gradient(160deg,#2a1f17,var(--panel) 60%)}

.chron h3{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:6px}
.chron ol{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px}
.chron li{display:grid;grid-template-columns:auto 1fr;gap:10px;color:var(--muted)}
.chron li:first-child{color:var(--bone)}
.chron li span{font-variant-numeric:tabular-nums;color:var(--ember);opacity:.8;white-space:nowrap}

/* 角色 */
.char{display:grid;gap:12px}
.portrait{width:100%;max-width:200px;margin:0 auto;display:block}
.char h2{font-size:22px;text-align:center}
.char .who{text-align:center;color:var(--muted);font-size:13px;margin-top:-8px}
.stats{display:grid;gap:6px}
.stat{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center}
.stat .r{font-family:var(--f-rune);color:var(--ember);font-size:18px;text-align:center}
.stat .v{font-weight:700;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.stat .v.low{color:var(--blood)}
.stat small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.plus{width:28px;height:28px;border-radius:4px;border:1px solid var(--ember);background:transparent;color:var(--ember);font-weight:700}
.list{display:grid;gap:6px;font-size:13px}
.list div{display:grid;gap:1px}
.list b{font-weight:700}
.list small{color:var(--muted)}
.sec-h{font-size:12px;letter-spacing:.14em;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.bless-big{display:flex;gap:8px;font-family:var(--f-rune);font-size:24px}
.bless-big i{font-style:normal;color:var(--line)}
.bless-big i.on{color:var(--frost);text-shadow:0 0 10px rgba(143,191,207,.55)}

/* 地圖 */
.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node text{font-family:var(--f-body);font-size:9px;fill:var(--bone);paint-order:stroke;stroke:var(--sea);stroke-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.region{display:grid;gap:8px}
.region h3{font-size:20px}
.region .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.region .meta b{color:var(--bone)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid currentColor}

/* 部落 */
.blds{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.bld{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.bld.done{border-color:var(--gold)}
.bld b{font-family:var(--f-display);font-size:17px}
.bld small{color:var(--muted);font-size:13px}
.bld .cost{font-size:13px;font-variant-numeric:tabular-nums}
.bld button{justify-self:start;padding:6px 14px;font-size:14px}
.done-tag{color:var(--gold);font-size:13px}

/* 視窗 */
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,10,.78);display:grid;place-items:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mbody{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
.mbody h2{font-size:24px}
.story{margin:0;white-space:pre-line}
.story em{font-style:normal;color:var(--ember)}
.quote{font-family:var(--f-display);font-size:19px;line-height:1.6;border-left:3px solid var(--frost);padding:4px 0 4px 14px;margin:0}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px 14px;display:grid;gap:2px}
.choice:not(:disabled):hover{border-color:var(--ember)}
.choice small{color:var(--muted);font-size:12.5px}
.choice:disabled{opacity:.45}
.res{background:var(--panel2);border-radius:5px;padding:12px 14px;white-space:pre-line}
.res .good{color:var(--gold)}.res .bad{color:var(--blood)}.res .blessed{color:var(--frost)}

.fighters{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fighter{display:grid;gap:4px;font-size:13px}
.fighter b{font-family:var(--f-display);font-size:15px}
.fighter .track{height:9px;background:var(--bg);border-radius:4px;overflow:hidden}
.fighter .fill{height:100%;background:var(--blood);transition:width .35s}
.fighter.foe .fill{background:var(--ember)}
.fighter .num{color:var(--muted);font-variant-numeric:tabular-nums}
.hint{background:var(--bg);border:1px dashed var(--line);border-radius:5px;padding:10px 12px;margin:0;font-size:14px}
.hint small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.move{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px 12px;text-align:left;display:grid;gap:1px}
.move b{font-family:var(--f-display);font-size:17px}
.move small{color:var(--muted);font-size:12px}
.move:not(:disabled):hover{border-color:var(--ember)}
.move:disabled{opacity:.4}
.dlog{list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted);display:grid;gap:3px}
.dlog li:first-child{color:var(--bone)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs div{background:var(--bg);border-radius:5px;padding:10px 12px;display:grid}
.vs span{font-size:12px;color:var(--muted)}
.vs b{font-size:26px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.vs small{color:var(--muted);font-size:12px}
.lead{display:flex;gap:8px;align-items:center;font-size:14px}
.lead input{width:18px;height:18px;accent-color:var(--ember)}
.ritual{text-align:center}
.ritual .big-rune{font-family:var(--f-rune);font-size:54px;color:var(--frost);text-shadow:0 0 24px rgba(143,191,207,.6);line-height:1}
.ritual.death .big-rune{color:var(--blood);text-shadow:0 0 24px rgba(181,67,47,.5)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;font-size:13px}
.summary div{background:var(--bg);border-radius:5px;padding:8px 10px;display:grid}
.summary span{color:var(--muted);font-size:12px}
.summary b{font-size:15px}
.talents{display:grid;gap:8px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--ember);padding:8px 16px;border-radius:20px;z-index:30;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:480px){.mbody{padding:16px}.moves{grid-template-columns:1fr 1fr}.bars{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <section id="title-screen" hidden>
    <div class="wrap">
      <div class="title-hero">
        <span class="rune">ᚾᛟᚱᚦᚱ · ᚺᛖᛁᛗᚱ</span>
        <h1>北境雄心</h1>
        <p>峽灣容不下你的野心。帶上母親給的符文護身符，渡海向西，從一個無名戰士，打出屬於自己的王國。</p>
      </div>
      <div class="form">
        <div class="row" id="continue-row" hidden>
          <button class="primary" id="btn-continue">繼續上次的傳奇</button>
          <span style="color:var(--muted);font-size:13px" id="continue-info"></span>
        </div>
        <div class="field">
          <label for="in-name">你的名字</label>
          <input id="in-name" maxlength="8" value="雷夫" autocomplete="off">
        </div>
        <div class="field">
          <label>你的出身</label>
          <div class="bgs" id="bgs"></div>
        </div>
        <div class="row"><button class="primary" id="btn-start">揚帆出發</button></div>
      </div>
    </div>
  </section>

  <section id="game-screen" hidden>
    <header class="top">
      <div class="wrap">
        <div class="top-line"><span class="nm" id="h-name"></span><span class="sub" id="h-sub"></span></div>
        <div class="bars">
          <div class="bar hp"><div class="row" style="justify-content:space-between"><span>生命</span><span id="h-hp"></span></div><div class="track"><div class="fill" id="h-hpbar"></div></div></div>
          <div class="bar xp"><div class="row" style="justify-content:space-between"><span id="h-lvl"></span><span id="h-xp"></span></div><div class="track"><div class="fill" id="h-xpbar"></div></div></div>
        </div>
        <div class="chips" id="chips"></div>
      </div>
    </header>
    <div class="wrap">
      <div class="cols">
        <aside class="side card" id="side"></aside>
        <main class="main">
          <div class="goal" id="goal"></div>
          <nav class="tabs" id="tabs" role="tablist"></nav>
          <div id="pane"></div>
          <section class="chron"><h3>編年史</h3><ol id="log"></ol></section>
        </main>
      </div>
    </div>
  </section>
</div>
<div id="modal" hidden><div class="mbody" id="mbody" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
const SAVE='north-ambition-save-v1';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=p=>Math.round(p*100)+'%';

const STAT={str:'力量',con:'體魄',wit:'智謀',pre:'威望'};
const STAT_RUNE={str:'ᚦ',con:'ᚢ',wit:'ᚨ',pre:'ᛏ'};
const STAT_DESC={str:'單挑傷害、部隊戰力',con:'生命上限、減少受到的傷害',wit:'看穿對手、夜襲、談判',pre:'招募人數、結盟、說服'};
const SEASON=['春','夏','秋','冬'];
const BGS=[
  {id:'smith',name:'鐵匠之子',st:'str',desc:'從小掄錘，臂力過人。'},
  {id:'hunter',name:'雪林獵人',st:'wit',desc:'懂得讀出獵物的下一步。'},
  {id:'sailor',name:'船工',st:'con',desc:'挨過無數風浪，骨頭像橡木。'},
  {id:'skald',name:'詩人之子',st:'pre',desc:'說起話來讓人想追隨。'},
];
const TALENTS={
  berserk:{name:'狂戰士',desc:'生命低於 40% 時，單挑傷害 ×1.5'},
  seawolf:{name:'海狼',desc:'突襲戰利品 +40%'},
  tongue:{name:'說客',desc:'結盟、說服的成功率 +20%'},
  ironwall:{name:'鐵壁',desc:'格擋反擊傷害加倍，受到的傷害 -15%'},
  odin:{name:'奧丁之眼',desc:'單挑時永遠看穿對手的意圖'},
  warcry:{name:'戰吼者',desc:'怒吼加成更強，部隊戰力 +10%'},

  raider:{name:'掠奪者',desc:'每次突襲勝利，名聲額外 +5'},
};
const FOES={
  wolf:{name:'飢餓的灰狼',hp:23,atk:7.5,w:[.25,.6,.15]},
  bandit:{name:'林間強盜',hp:30,atk:9,w:[.35,.35,.3]},
  guard:{name:'漁村守衛',hp:37,atk:10.5,w:[.3,.25,.45]},
  brawler:{name:'酒館壯漢',hp:35,atk:9,w:[.5,.25,.25]},
  sven1:{name:'斯韋恩',hp:41,atk:10.5,w:[.45,.35,.2]},
  gyr:{name:'壯漢蓋爾',hp:53,atk:13.5,w:[.45,.3,.25]},
  astrid:{name:'盾女阿斯特麗德',hp:58,atk:13.5,w:[.2,.3,.5]},
  edric:{name:'灰石堡領主艾德里克',hp:77,atk:16,w:[.3,.25,.45]},
  brynhild:{name:'鷹巢峰的布倫希爾德',hp:73,atk:17.5,w:[.3,.45,.25]},
  sven:{name:'紅帆斯韋恩',hp:88,atk:19,w:[.5,.3,.2]},
  wilfred:{name:'溫特堡御衛長威爾弗',hp:99,atk:20,w:[.3,.3,.4]},
};
const REGIONS=[
  {id:'village',name:'鹽灘漁村',kind:'minor',x:58,y:118,def:8,loot:[22,10],inc:[3,3],desc:'漁民、鹹魚和幾把生鏽的矛。防備鬆散，油水不多。'},
  {id:'abbey',name:'聖柯倫修道院',kind:'minor',x:140,y:72,def:12,loot:[45,4],inc:[6,1],desc:'修士們守著金燭台和銀聖杯，幾乎沒有守衛。'},
  {id:'forest',name:'黑森林',kind:'minor',x:126,y:168,def:15,loot:[30,6],inc:[3,3],desc:'強盜的老巢，據說藏著他們搶來的財寶。'},

const SEATS=['grey','eagle','red','winter'];
const R=id=>REGIONS.find(r=>r.id===id);
const BLD=[
  {id:'longhouse',name:'長屋',cost:[35,8],desc:'族人的家。戰士上限 +10，忠誠 +10。'},
  {id:'granary',name:'糧倉',cost:[30,0],desc:'每季多產 4 糧食。'},
  {id:'smithy',name:'鐵匠鋪',cost:[45,0],desc:'部隊戰力 ×1.25，你的單挑傷害 +2。'},
  {id:'barracks',name:'兵營',cost:[40,5],desc:'招募費用 -30%，戰士上限 +6。'},
  {id:'dock',name:'碼頭',cost:[45,0],desc:'突襲戰利品 +40%，船隻能抵達河口集市與霧沼。'},
  {id:'altar',name:'祭壇',cost:[30,6],desc:'能舉行冬至祭典。族人為你祭祀療傷時，代價較低。'},
  {id:'hall',name:'議事廳',cost:[55,0],desc:'結盟成功率 +15%，每季名聲 +1。'},
];

let S=null;
let toastT=0;

/* ---------- 基本數值 ---------- */
const has=t=>S.talents.includes(t);
const eff=k=>Math.max(1,S.st[k]-(S.wounded>0?1:0));
const maxHp=()=>20+S.st.con*6;
const xpNeed=()=>20+S.lvl*15;
const charges=()=>(S.amulet?1:0)+S.blessings;
const year=()=>Math.floor(S.turn/4)+1;
const age=()=>19+Math.floor(S.turn/4);
const stamp=()=>`第${year()}年${SEASON[S.turn%4]}`;
const owned=k=>REGIONS.filter(r=>S.reg[r.id].st==='yours'&&(!k||r.kind===k)).length;
const allies=()=>REGIONS.filter(r=>S.reg[r.id].st==='ally').length;
const seatsHeld=()=>SEATS.filter(id=>['yours','ally'].includes(S.reg[id].st)).length;
const bldCount=()=>Object.keys(S.bld).length;
function menCap(){
  if(S.phase===1) return 3;
  return 6+(S.bld.longhouse?10:0)+(S.bld.barracks?6:0)+owned('minor')*3+owned('seat')*5;
}
const recruitCost=()=>Math.round(8*(S.bld.barracks?.7:1)*(has('leader')?.7:1));
function armyPower(){
  let p=S.men*(S.bld.smithy?1.25:1)+S.champions.reduce((a,c)=>a+c.pow,0)+eff('str')*1.5+eff('pre')*.8+allies()*8;
  if(has('warcry')) p*=1.1;
  return Math.round(p);
}
const pDmg=()=>4+eff('str')*2+(S.bld.smithy?2:0);
function income(){
  let s=0,f=0;
  REGIONS.forEach(r=>{const g=S.reg[r.id];if(g.st==='yours'){s+=r.inc[0];f+=r.inc[1];}else if(g.st==='ally'){s+=6;}});
  if(S.bld.granary) f+=4;
  return [s,f];
}
function upkeep(){return S.phase===1?1+Math.ceil(S.men/2):Math.ceil((S.men+S.champions.length)/4)+1;}
function loseLoyalty(n){S.loyalty=clamp(S.loyalty-(has('leader')?Math.ceil(n/2):n),0,100);}
function addLoyalty(n){S.loyalty=clamp(S.loyalty+n,0,100);}
function addFame(n){S.fame=Math.max(0,S.fame+n);}
function log(t){S.log.unshift([stamp(),t]);S.log.length=Math.min(S.log.length,40);}
function gainXp(n){
  S.xp+=n;
  while(S.xp>=xpNeed()){
    S.xp-=xpNeed();S.lvl++;S.pts+=2;S.hp=maxHp();
    if([3,5,7,9].includes(S.lvl)) S.talentPicks++;
    log(`升到第 ${S.lvl} 級。`);
  }
}
function toast(t){
  const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);
  clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2600);
  document.querySelectorAll('.toast').forEach(x=>{if(x!==el)x.remove();});
}

/* ---------- 視窗佇列 ---------- */
const Q=[];let modalOpen=false;let ins=0;
function pushModal(fn){ if(modalOpen){Q.splice(ins++,0,fn);} else {Q.push(fn);nextModal();} }
function pushLater(fn){ Q.push(fn); if(!modalOpen) nextModal(); }
function nextModal(){
  ins=0;
  const fn=Q.shift();
  const m=$('#modal');
  if(!fn){modalOpen=false;m.hidden=true;render();checkPost();return;}
  modalOpen=true;m.hidden=false;m.scrollTop=0;
  fn($('#mbody'));
  render();
}
const closeModal=()=>nextModal();
function resultView(el,title,html,eyebrow){
  el.innerHTML=`${eyebrow?`<p class="eyebrow">${eyebrow}</p>`:''}<h2>${title}</h2><div class="res">${html}</div><button class="primary" id="m-ok">繼續</button>`;
  $('#m-ok').onclick=closeModal;$('#m-ok').focus();
}
function checkPost(){
  if(!S||S.dead||S.won) return;
  if(S.pts>0||S.talentPicks>0){pushModal(levelUpModal);return;}
  if(S.phase===3&&seatsHeld()>=4){pushModal(coronation);return;}
}

/* ---------- 時間推進 ---------- */
function passTime(){
  S.turn++;
  const [si,fi]=income();
  const eat=upkeep();
  S.silver+=si;S.food+=fi-eat;
  if(S.bld.hall) addFame(1);
  if(S.food<0){
    S.food=0;
    if(S.men>0){const l=Math.max(1,Math.ceil(S.men*.15));S.men-=l;log(`糧食耗盡，${l} 名戰士離開了你。`);}
    else log('糧食耗盡，你餓著肚子上路。');
    loseLoyalty(10);S.hp=Math.max(1,S.hp-5);
  }
  if(S.wounded>0){S.wounded--;if(!S.wounded) log('傷勢痊癒，你重新握緊了斧頭。');}
  S.hp=Math.min(maxHp(),S.hp+2+Math.floor(S.st.con/2));
  REGIONS.forEach(r=>{if(S.reg[r.id].cd>0)S.reg[r.id].cd--;});
  if(S.phase>=2&&S.loyalty<20&&S.men>2){const l=Math.ceil(S.men*.1);S.men-=l;log(`族人對你失去信心，${l} 名戰士在夜裡溜走了。`);}
  // 劇情與隨機事件
  if(S.phase===1&&S.turn>=2&&!S.flags.sven_intro){S.flags.sven_intro=1;pushLater(eventModal(EV_SVEN));return;}
  if(S.phase===3&&S.reg.red.st==='free'&&S.turn-S.lastRival>=6){S.lastRival=S.turn;rivalAttack();return;}
  if(Math.random()<(S.phase===1?.35:.4)){
    const pool=EVENTS.filter(e=>(!e.once||!S.flags['ev_'+e.id])&&e.phase.includes(S.phase)&&(!e.cond||e.cond()));
    if(pool.length){const e=pick(pool);if(e.once)S.flags['ev_'+e.id]=1;pushLater(eventModal(e));}
  }
}

/* ---------- 單挑 ---------- */
const MV={H:'重擊',Q:'快攻',B:'格擋',R:'怒吼'};
const HINT={
  H:['對方雙手握緊武器，重心下沉，像是要蓄力重劈。','他深吸一口氣，把斧頭高高舉過肩膀。'],
  Q:['對方腳步輕快，眼神游移，準備搶攻。','他壓低身子，刀尖對準你的空檔。'],
  B:['對方舉起盾牌，緊盯著你的動作。','他退了半步，盾牌護住胸口，在等你先出手。'],
};
function duel(key,o){
  pushModal(el=>{
    const base=FOES[key];
    const sc=o.scale?1+.12*(S.lvl-1):1;
    const d={name:base.name,max:Math.round(base.hp*sc),atk:base.atk*(o.scale?1+.08*(S.lvl-1):1),w:base.w,buff:1,cd:0,log:[],over:false};
    d.hp=d.max;
    const acc=has('odin')?1:Math.min(.92,.4+eff('wit')*.07);
    const choose=()=>{const r=Math.random();d.intent=r<d.w[0]?'H':r<d.w[0]+d.w[1]?'Q':'B';
      d.shown=Math.random()<acc?d.intent:pick(['H','Q','B'].filter(x=>x!==d.intent));d.hint=pick(HINT[d.shown]);};
    choose();
    const draw=()=>{
      const end=d.over;
      el.innerHTML=`<p class="eyebrow">${o.lethal?'生死單挑':'比武 · 點到為止'}</p><h2>${esc(S.name)} 對 ${d.name}</h2>
      ${o.intro&&!d.log.length?`<p class="story">${o.intro}</p>`:''}
      <div class="fighters">
        <div class="fighter"><b>${esc(S.name)}</b><div class="track"><div class="fill" style="width:${S.hp/maxHp()*100}%"></div></div><span class="num">${Math.max(0,S.hp)} / ${maxHp()}${d.buff>1?' · 怒吼蓄勢':''}</span></div>
        <div class="fighter foe"><b>${d.name}</b><div class="track"><div class="fill" style="width:${Math.max(0,d.hp)/d.max*100}%"></div></div><span class="num">${Math.max(0,d.hp)} / ${d.max}</span></div>
      </div>
      ${end?`<div class="res">${d.result}</div><button class="primary" id="m-ok">繼續</button>`:`
      <p class="hint">${d.hint}<small>看穿對手的機率 ${pct(acc)}（智謀越高越準）</small></p>
      <div class="moves">
        <button class="move" data-m="H"><b>重擊</b><small>能破格擋，會被快攻打斷</small></button>
        <button class="move" data-m="Q"><b>快攻</b><small>能打斷重擊，會被格擋反擊</small></button>
        <button class="move" data-m="B"><b>格擋</b><small>能反擊快攻，擋不住重擊</small></button>
        <button class="move" data-m="R" ${d.cd>0?'disabled':''}><b>怒吼</b><small>${d.cd>0?`喘息中，還要 ${d.cd} 回合`:'下一擊威力大增，這回合不出手'}</small></button>
      </div>`}
      <ol class="dlog">${d.log.slice(0,4).map(l=>`<li>${l}</li>`).join('')}</ol>`;
      if(end){$('#m-ok').onclick=()=>{if(S.hp<=0)triggerFall(o.cause||`死在${d.name}手下`);closeModal();};$('#m-ok').focus();}
      else el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>round(b.dataset.m));
    };
    const round=pm=>{
      const em=d.intent;
      let P=pDmg()*rnd(.85,1.15)*d.buff;
      if(has('berserk')&&S.hp<maxHp()*.4) P*=1.5;
      const E=d.atk*rnd(.85,1.15);
      let toF=0,toP=0,t='';
      if(pm==='R'){
        d.buff=has('warcry')?2.2:1.8;d.cd=3;
        toP=em==='H'?E*1.3:em==='Q'?E:0;
        t=`你仰天怒吼，血往頭上衝。${em==='B'?'對方只是舉盾觀望。':`對方趁機${MV[em]}，`}`;
      }else{
        switch(pm+em){
          case 'HB':toF=P*1.4;t='你一斧劈開了對方的盾牌！';break;
          case 'HQ':toP=E;t='你蓄力太慢，被對方搶先砍中。';break;
          case 'HH':toF=P*1.2;toP=E*1.2;t='兩把武器狠狠對撞，雙方都見了血。';break;
          case 'QH':toF=P;t='你在對方舉起武器前搶先出手！';break;
          case 'QQ':toF=P*.7;toP=E*.7;t='你們互相搶攻，各自劃出一道傷口。';break;
          case 'QB':toP=E*.8;t='你的快攻撞上盾牌，被反手一擊。';break;
          case 'BQ':toF=P*(has('ironwall')?1.8:.9);t='你擋下攻擊，順勢反擊！';break;
          case 'BH':toP=E*1.2;t='對方的重擊砸穿了你的格擋。';break;
          case 'BB':S.hp=Math.min(maxHp(),S.hp+2);d.hp=Math.min(d.max,d.hp+2);t='雙方都在防守，繞著圈喘口氣。';break;
        }
        if(pm!=='B') d.buff=1;
        if(d.cd>0) d.cd--;
      }
      if(toP>0){toP=Math.max(1,Math.round((toP-eff('con')*.6)*(has('ironwall')?.85:1)));}
      toF=Math.round(toF);
      d.hp-=toF;S.hp-=toP;
      d.log.unshift(`${t}${toF?` <span style="color:var(--ember)">對方 -${toF}</span>`:''}${toP?` <span style="color:var(--blood)">你 -${toP}</span>`:''}`);
      const fled=o.retreatAt&&d.hp>0&&d.hp<=d.max*o.retreatAt;
      if(d.hp<=0||fled||S.hp<=0){
        d.over=true;
        let win=d.hp<=0||fled;
        if(S.hp<=0&&d.hp<=0&&!fled){win=true;S.hp=1;}
        if(!o.lethal&&S.hp<=0){S.hp=1;}
        if(o.lethal&&S.hp<=0){S.hp=0;win=false;}
        if(win){S.stats.duels++;gainXp(o.xp||10);}
        const head=win?(fled?`<span class="good">${d.name}撐不住，轉身逃了。</span>`:`<span class="good">${d.name}倒下了。</span>`)
          :(S.hp<=0?`<span class="bad">你眼前一黑，倒在血泊裡……</span>`:`<span class="bad">你輸了這場比武。</span>`);
        d.result=head+'\n'+(o.onEnd?o.onEnd(win)||'':'');
      }else choose();
      draw();
    };
    draw();
  });
}

/* ---------- 部隊戰 ---------- */
function battle(o){
  pushModal(el=>{
    let lead=S.hp>maxHp()*.35;
    const draw=()=>{
      const p=armyPower()*(lead?1.2:1);
      const nightP=clamp(.3+eff('wit')*.06,0,.9);
      el.innerHTML=`<p class="eyebrow">${o.defend?'守衛部落':'部隊戰'}</p><h2>${o.title}</h2>
      ${o.intro?`<p class="story">${o.intro}</p>`:''}
      <div class="vs"><div><span>我方戰力</span><b>${Math.round(p)}</b><small>${S.men} 名戰士${S.champions.length?` · ${S.champions.length} 名勇士`:''}${allies()?` · ${allies()} 個盟友`:''}</small></div>
      <div><span>敵方戰力</span><b>約 ${Math.round(o.def)}</b><small>${o.foeNote||'數字差距越大，勝算越高'}</small></div></div>
      <label class="lead"><input type="checkbox" id="b-lead" ${lead?'checked':''}> 親自上陣：戰力 ×1.2，但你會受傷（生命 ${S.hp}/${maxHp()}）</label>
      <div class="choices">
        ${o.defend?`<button class="choice" data-t="hold"><b>據守木牆</b><small>戰力 ×1.3，穩紮穩打</small></button>`:''}
        <button class="choice" data-t="charge"><b>正面衝鋒</b><small>力量越高越猛（+${eff('str')*3}%），傷亡較重</small></button>
        <button class="choice" data-t="night"><b>夜襲</b><small>成功率 ${pct(nightP)}（看智謀）：成功戰力 ×1.5，失敗 ×0.75</small></button>
        <button class="choice" data-t="flank" ${S.men<8?'disabled':''}><b>包抄</b><small>${S.men<8?'需要至少 8 名戰士':`戰力 ×${(1.05+eff('wit')*.02).toFixed(2)}，傷亡較輕`}</small></button>
        ${o.cancel?`<button class="ghost" id="b-cancel">先撤回，再做準備</button>`:''}
      </div>`;
      $('#b-lead').onchange=e=>{lead=e.target.checked;draw();};
      if(o.cancel) $('#b-cancel').onclick=closeModal;
      el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>resolve(b.dataset.t));
    };
    const resolve=t=>{
      if(!o.defend) passTime();
      let p=armyPower()*(lead?1.2:1),cas=1;const lines=[];
      if(t==='hold'){p*=1.3;cas=.8;lines.push('你們在木牆後排成盾牆，一步也不退。');}
      if(t==='charge'){p*=1+eff('str')*.03;cas=1.4;lines.push(lead?'你第一個衝出去，戰士們吼叫著跟上。':'戰士們吼叫著衝向敵陣。');}
      if(t==='night'){const ok=Math.random()<clamp(.3+eff('wit')*.06,0,.9);p*=ok?1.5:.75;cas=.8;lines.push(ok?'夜色掩護了你們，敵人在睡夢中驚醒。':'一隻狗吠了起來，夜襲被發現了。');}
      if(t==='flank'){p*=1.05+eff('wit')*.02;cas=.9;lines.push('你把人分成兩路，從側面包了過去。');}
      const winP=clamp(.5+(p/o.def-1)*.9,.05,.95);
      const win=Math.random()<winP;
      let lost=Math.round(S.men*rnd(win?.04:.18,win?.12:.32)*cas*(S.champions.some(c=>c.id==='astrid')?.7:1));
      lost=Math.min(lost,S.men);S.men-=lost;S.stats.fallen+=lost;
      if(lost) lines.push(`${lost} 名戰士沒能回來。`);
      if(!win&&S.champions.length&&Math.random()<.18){const c=pick(S.champions);S.champions=S.champions.filter(x=>x!==c);lines.push(`<span class="bad">勇士${c.name}戰死了。</span>`);log(`勇士${c.name}戰死沙場。`);}
      if(lead){
        const dmg=Math.max(1,Math.round(o.def*rnd(.12,.3)*(win?.6:1.1)-eff('con')*.5));
        S.hp=win?Math.max(1,S.hp-dmg):S.hp-dmg;
        lines.push(`你在亂戰中受了傷（生命 -${dmg}）。`);
      }
      gainXp(win?Math.round(12+o.def/3):6);
      if(win) S.stats.battles++;
      const after=o.onEnd(win)||'';
      el.innerHTML=`<p class="eyebrow">戰報</p><h2>${win?'勝利':'敗退'}</h2>
      <div class="res">${lines.join('\n')}\n${win?'<span class="good">':'<span class="bad">'}${after}</span></div>
      <button class="primary" id="m-ok">繼續</button>`;
      $('#m-ok').onclick=()=>{if(S.hp<=0)triggerFall(o.cause||'倒在亂軍之中');closeModal();};$('#m-ok').focus();
      render();
    };
    draw();
  });
}

/* ---------- 祈福與死亡 ---------- */
function addBlessing(){
  if(charges()>=3){addLoyalty(5);return `<span class="blessed">祈福已滿（3/3），族人的敬愛化為忠誠 +5。</span>`;}
  S.blessings++;S.stats.blessGained++;
  log(`族人為你刻下祈福符文（${charges()}/3）。`);
  return `<span class="blessed">ᚱ 族人在祭壇石上為你刻下一道祈福符文。祈福 ${charges()}/3</span>`;
}
function triggerFall(cause){
  S.lastCause=cause;
  pushModal(charges()>0?ritualModal:deathModal);
}
function ritualModal(el){
  let story,cost=[];
  const useAmulet=S.amulet&&(S.phase===1||S.blessings===0);
  if(useAmulet){
    S.amulet=false;
    const lost=Math.floor(S.silver*.3);S.silver-=lost;

/* ---------- 升級 ---------- */
function levelUpModal(el){
  if(S.talentPicks>0&&!S.offer){const pool=Object.keys(TALENTS).filter(t=>!has(t));S.offer=pool.sort(()=>Math.random()-.5).slice(0,3);}
  const draw=()=>{
    const done=S.pts===0&&S.talentPicks===0;
    el.innerHTML=`<p class="eyebrow">第 ${S.lvl} 級</p><h2>你變得更強了</h2>
    ${S.pts>0?`<p class="story">還有 <em>${S.pts}</em> 點可以分配。</p>`:''}
    <div class="stats">${Object.keys(STAT).map(k=>`<div class="stat"><span class="r">${STAT_RUNE[k]}</span><div>${STAT[k]}<small>${STAT_DESC[k]}</small></div><span class="v">${S.st[k]}</span>
      ${S.pts>0?`<button class="plus" data-s="${k}" aria-label="提升${STAT[k]}">+</button>`:'<span></span>'}</div>`).join('')}</div>
    ${S.talentPicks>0?`<p class="eyebrow" style="margin-top:6px">選一個天賦</p><div class="talents">${S.offer.map(t=>`<button class="choice" data-t="${t}"><b>${TALENTS[t].name}</b><small>${TALENTS[t].desc}</small></button>`).join('')}</div>`:''}
    <button class="primary" id="m-ok" ${done?'':'disabled'}>${done?'繼續':'分配完才能繼續'}</button>`;
    el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s;S.st[k]++;S.pts--;if(k==='con')S.hp+=6;draw();render();});
    el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.talents.push(b.dataset.t);S.talentPicks--;S.offer=null;log(`獲得天賦「${TALENTS[b.dataset.t].name}」。`);
      if(S.talentPicks>0){const pool=Object.keys(TALENTS).filter(t=>!has(t));S.offer=pool.sort(()=>Math.random()-.5).slice(0,3);}draw();render();});
    if(done) $('#m-ok').onclick=closeModal;
  };
  draw();
}

/* ---------- 事件 ---------- */
function eventModal(ev){
  return el=>{
    const opts=ev.ch.filter(c=>!c.show||c.show());
    el.innerHTML=`<p class="eyebrow">${ev.kind||'事件'}</p><h2>${ev.title}</h2><p class="story">${typeof ev.text==='function'?ev.text():ev.text}</p>
    <div class="choices">${opts.map((c,i)=>{const ok=!c.ok||c.ok();return `<button class="choice" data-i="${i}" ${ok?'':'disabled'}><b>${c.t}</b>${c.note?`<small>${c.note}</small>`:''}</button>`;}).join('')}</div>`;
    el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
      const r=opts[+b.dataset.i].fx();
      if(r===null){closeModal();return;}
      resultView(el,ev.title,r,ev.kind||'事件');render();
    });
  };
}

      A.push({id:'declare',key:true,name:'向西境宣告你的名字',desc:'讓諸侯知道，有個新的勢力崛起了。',gain:'進入擴張階段',dis:ok?null:`建築 ${bldCount()}/3 · 戰士 ${S.men}/8`,run:declare});}

    const cap=menCap(),cost=recruitCost();
    A.push({id:'recruit',name:'招募戰士',desc:`每人 ${cost} 銀幣。戰士 ${S.men}/${cap}`,gain:`每次最多 ${2+eff('pre')} 人（看威望）`,dis:S.men>=cap?'戰士已達上限，蓋長屋、兵營或佔領土地':S.silver<cost?`需要 ${cost} 銀幣`:null,run:recruitModal});

    const f=ri(3,5)+Math.floor(eff('wit')/2)+(p>1?Math.floor(S.men/3):0);S.food+=f;gainXp(3);toast(`糧食 +${f}`);passTime();}});
  A.push({id:'rest',name:'休養',desc:'好好睡一覺，恢復全部生命。',gain:`生命 ${S.hp}/${maxHp()}`,dis:S.hp>=maxHp()?'你的狀態很好':null,run:()=>{passTime();S.hp=maxHp();toast('生命全滿');render();}});
  return A;

function foundTribe(){
  pushModal(el=>{
    el.innerHTML=`<p class="eyebrow">第二章</p><h2>插旗之地</h2>
    <p class="story">你在海灣邊找到一塊向陽的坡地：背靠森林，面朝大海，有一條不會結凍的小溪。\n\n你把斧頭劈進橡樹樁，大聲宣告：從今天起，這裡是你的土地。</p>
    <div class="field"><label for="in-tribe">給你的部落取個名字</label><input id="in-tribe" maxlength="8" value="渡鴉谷"></div>
    <button class="primary" id="m-ok">立起旗幟</button>`;
    $('#m-ok').onclick=()=>{
      S.tribe=($('#in-tribe').value.trim()||'渡鴉谷').slice(0,8);

      resultView(el,'部落建立了',`<span class="good">${esc(S.tribe)}</span>的旗幟在海風裡飄了起來。\n\n消息傳開後，開始有人來投靠你。接下來：\n・在「部落」頁蓋建築\n・招募戰士，出兵突襲\n・族人的<span class="blessed">忠誠</span>很重要：他們越信服你，越可能在你倒下時為你祈福`,'第二章');
      render();
    };

function declare(){
  passTime();S.phase=3;S.p3turn=S.turn;S.lastRival=S.turn-3;
  log('向西境諸侯宣告了自己的名字。');
  pushModal(el=>resultView(el,'西境諸侯',`你派出使者，帶著${esc(S.tribe)}的旗幟走遍西境。\n\n灰石堡的艾德里克把使者趕了出去。鷹巢峰的布倫希爾德笑了，說想看看你有多能打。溫特堡的老國王什麼也沒說。\n\n還有一個人聽見你的名字就砸了酒杯：<em>斯韋恩</em>。他在海岸建了紅帆營，發誓要燒掉你的部落。\n\n<span class="good">目標：征服或結盟四大勢力，成為西境之王。</span>`,'第三章'));
}
function recruitModal(){
  pushModal(el=>{
    const cost=recruitCost(),max=Math.min(2+eff('pre'),menCap()-S.men,Math.floor(S.silver/cost));
    let n=Math.max(1,max);
    const draw=()=>{
      el.innerHTML=`<p class="eyebrow">招募</p><h2>招募戰士</h2><p class="story">消息傳到附近的村子，有些年輕人帶著斧頭來了。你的威望決定一次能說服多少人。</p>
      <div class="row"><button class="ghost" id="r-m">−</button><b style="font-size:28px;min-width:2ch;text-align:center">${n}</b><button class="ghost" id="r-p">+</button>
      <span style="color:var(--muted)">共 ${n*cost} 銀幣（上限 ${max} 人）</span></div>
      <div class="row"><button class="primary" id="m-ok">招募 ${n} 人</button><button class="ghost" id="m-x">取消</button></div>`;
      $('#r-m').onclick=()=>{n=Math.max(1,n-1);draw();};$('#r-p').onclick=()=>{n=Math.min(max,n+1);draw();};
      $('#m-x').onclick=closeModal;
      $('#m-ok').onclick=()=>{S.silver-=n*cost;S.men+=n;passTime();log(`招募了 ${n} 名戰士。`);toast(`戰士 +${n}`);closeModal();};
    };
    draw();

}
function build(id){
  const b=BLD.find(x=>x.id===id);
  S.silver-=b.cost[0];S.food-=b.cost[1];S.bld[id]=1;passTime();
  if(id==='longhouse') addLoyalty(10);
  log(`蓋好了${b.name}。`);toast(`${b.name}完工`);render();
}

/* ---------- 地區行動 ---------- */
function regionActs(r){
  const g=S.reg[r.id],A=[];
  if(S.phase===1){
    if(r.id==='village') A.push({t:'獨自突襲',note:'在「行動」頁執行',dis:'請到行動頁'});
    return {info:'你孤身一人，還動不了這裡。先累積銀幣和名聲，建立自己的部落。',A};
  }
  if(r.needs&&!S.bld[r.needs]) return {info:'要先在部落蓋好碼頭，船才到得了這裡。',A};
  if(g.st==='yours') return {info:`這裡已經是你的土地。每季產出銀幣 ${r.inc[0]}、糧食 ${r.inc[1]}。`,A};
  if(g.st==='ally') return {info:`${r.lord}是你的盟友。每季送來 6 銀幣，出兵時提供戰力 +8。`,A};
  if(r.kind==='minor'){
    A.push({t:'突襲',note:`敵方約 ${Math.round(g.def*.8)}。搶了就走，戰利品約 ${Math.round(r.loot[0]*lootMul())} 銀幣`,dis:g.cd?`他們還在戒備（${g.cd} 季）`:null,run:()=>raid(r)});
    if(S.phase===3) A.push({t:'征服',note:`敵方約 ${g.def}。佔領後每季產出，戰士上限 +3`,run:()=>conquer(r)});
    else A.push({t:'征服',dis:'宣告名字（第三章）後才能佔領土地'});
    return {info:'',A};
  }
  if(S.phase===2) return {info:`${r.lord}還不把你放在眼裡。先壯大部落，再向西境宣告你的名字。`,A};
  if(r.id==='winter'){
    const others=SEATS.filter(id=>id!=='winter'&&['yours','ally'].includes(S.reg[id].st)).length;
    if(others<2) return {info:`先拿下另外兩方勢力（${others}/2），老國王才會正眼看你。`,A};
    A.push({t:'攻打王都',note:`敵方約 ${g.def}，之後要與御衛長決鬥`,run:()=>conquer(r)});
    A.push({t:'逼老國王讓位',note:others>=3?`看威望，成功率約 ${pct(clamp(.3+eff('pre')*.06+(has('tongue')?.2:0),.05,.95))}`:'需要先拿下其他三方',dis:others>=3?null:'需要先拿下其他三方',run:()=>abdicate(r)});
    return {info:'',A};
  }
  A.push({t:'征服',note:`敵方約 ${g.def}，打贏後${r.lord}會要求單挑`,run:()=>conquer(r)});
  if(r.id==='grey') A.push({t:'送禮結盟（30 銀幣）',note:`看威望與智謀，成功率約 ${pct(allyChance())}`,dis:S.silver<30?'需要 30 銀幣':g.cd?`他還在氣頭上（${g.cd} 季）`:null,run:()=>allyGrey(r)});
  if(r.id==='eagle') A.push({t:'比武求盟',note:'跟布倫希爾德比武，點到為止',dis:g.cd?`她要你過陣子再來（${g.cd} 季）`:null,run:()=>allyEagle(r)});
  if(r.id==='red') A.push({t:'斯韋恩不接受結盟',dis:'只能用斧頭解決'});
  return {info:'',A};
}
const lootMul=()=>(S.bld.dock?1.4:1)*(has('seawolf')?1.4:1);
const allyChance=()=>clamp(.15+eff('pre')*.05+eff('wit')*.02+(S.bld.hall?.15:0)+(has('tongue')?.2:0),.05,.95);
function raid(r){
  const g=S.reg[r.id];
  battle({title:`突襲${r.name}`,def:g.def*.8,cancel:true,intro:r.desc,cause:`死在突襲${r.name}的亂戰中`,onEnd:w=>{
    g.cd=4;
    if(!w){loseLoyalty(3);log(`突襲${r.name}失敗。`);return '你們空手而回。忠誠 -3';}
    const s=Math.round(r.loot[0]*rnd(.8,1.2)*lootMul()),f=Math.round(r.loot[1]*rnd(.8,1.2));
    S.silver+=s;S.food+=f;g.def+=2;S.stats.raids++;const fm=4+(has('raider')?5:0);addFame(fm);
    log(`突襲${r.name}，搶到 ${s} 銀幣。`);
    if(!S.flags.ev_share&&Math.random()<.6){S.flags.ev_share=1;pushModal(shareLootEvent(s));}
    return `搶到銀幣 ${s}、糧食 ${f}，名聲 +${fm}。\n${r.name}加強了防備。`;
  }});
}
function conquer(r){
  const g=S.reg[r.id];
  battle({title:`征服${r.name}`,def:g.def,cancel:true,intro:r.desc,cause:`死在攻打${r.name}的城牆下`,foeNote:r.lord?`${r.lord}的軍隊`:'',onEnd:w=>{
    if(!w){log(`進攻${r.name}失敗。`);return '你們被打退了。';}

function takeSeat(r,how){

function lordChoice(r){

function render(){
  if(!S||$('#game-screen').hidden) return;
  if(S.hp>maxHp()) S.hp=maxHp();
  $('#h-name').textContent=S.name+(S.tribe?` · ${S.tribe}`:'');
  $('#h-sub').textContent=`${stamp()} · ${age()} 歲`;
  $('#h-hp').textContent=`${Math.max(0,S.hp)} / ${maxHp()}`;
  $('#h-hpbar').style.width=clamp(S.hp/maxHp()*100,0,100)+'%';
  $('#h-lvl').textContent=`第 ${S.lvl} 級`;
  $('#h-xp').textContent=`${S.xp} / ${xpNeed()}`;
  $('#h-xpbar').style.width=(S.xp/xpNeed()*100)+'%';
  const chips=[['銀幣',S.silver],['糧食',S.food,S.food<upkeep()*2],['名聲',S.fame],[S.phase===1?'同伴':'戰士',S.men]];
  if(S.phase>=2) chips.push(['忠誠',S.loyalty,S.loyalty<30]);
  $('#chips').innerHTML=chips.map(([k,v,w])=>`<span class="chip ${w?'warn':''}"><span>${k}</span><b>${v}</b></span>`).join('')+
    `<span class="chip"><span>祈福</span><span class="bless">${[0,1,2].map(i=>`<i class="${i<charges()?'on':''}">ᚱ</i>`).join('')}</span></span>`;
  $('#side').innerHTML=charHTML();
  $('#goal').innerHTML=goalHTML();
  const tabs=[['act','行動'],['map','地圖'],['tribe','部落'],['char','角色']];
  $('#tabs').innerHTML=tabs.map(([k,n])=>`<button role="tab" class="tab-${k}" aria-selected="${S.tab===k}" data-tab="${k}">${n}${k==='char'&&S.pts>0?'<span class="dot"></span>':''}</button>`).join('');
  let pane='';
  if(S.tab==='act') pane=`<div class="acts">${actions().map(a=>`<button class="act ${a.key&&!a.dis?'key':''}" data-a="${a.id}" ${a.dis?'disabled':''}><b>${a.name}</b><small>${a.desc}</small><span class="gain">${a.dis||a.gain}</span></button>`).join('')}</div>`;
  else if(S.tab==='map') pane=mapHTML();
  else if(S.tab==='tribe') pane=tribeHTML();
  else pane=`<div class="card">${charHTML()}</div>`;
  $('#pane').innerHTML=pane;
  $('#log').innerHTML=S.log.slice(0,8).map(([t,x])=>`<li><span>${t}</span>${x}</li>`).join('');
  save();
}
function save(){ if(!S||S.dead||S.won) return; try{localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){} }
function load(){ try{const t=localStorage.getItem(SAVE);return t?JSON.parse(t):null;}catch(e){return null;} }

/* ---------- 事件綁定 ---------- */
document.addEventListener('click',e=>{
  if(!S||modalOpen) return;
  const t=e.target.closest('[data-tab],[data-a],[data-r],[data-ra],[data-b],[data-s]');
  if(!t) return;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();return;}
  if(t.dataset.a){const a=actions().find(x=>x.id===t.dataset.a);if(a&&!a.dis){a.run();render();}return;}
  if(t.dataset.r){S.sel=t.dataset.r;render();return;}
  if(t.dataset.ra){const sel=R(S.sel);const a=regionActs(sel).A[+t.dataset.ra];if(a&&a.run&&!a.dis){a.run();render();}return;}
  if(t.dataset.b){const b=BLD.find(x=>x.id===t.dataset.b);if(b&&!S.bld[b.id]&&S.silver>=b.cost[0]&&S.food>=b.cost[1])build(b.id);return;}
  if(t.dataset.s&&S.pts>0){const k=t.dataset.s;S.st[k]++;S.pts--;if(k==='con')S.hp+=6;render();return;}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.node')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});

  $('#bgs').querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{chosenBg=b.dataset.bg;showTitle();});
  const sv=load();

  if(sv) $('#continue-info').textContent=`${sv.name} · 第 ${sv.lvl} 級 · ${['','孤身闖蕩','部落首領','西境的挑戰者'][sv.phase]}`;
}
function startGame(){
  $('#title-screen').hidden=true;$('#game-screen').hidden=false;window.scrollTo(0,0);render();checkPost();
}
$('#btn-continue').onclick=()=>{S=load();if(S)startGame();};
$('#btn-start').onclick=()=>{
  const name=($('#in-name').value.trim()||'雷夫').slice(0,8);
  const bg=BGS.find(b=>b.id===chosenBg);
  const st={str:3,con:3,wit:3,pre:3};st[bg.st]+=2;
  S={v:1,name,bg:bg.id,turn:0,phase:1,lvl:1,xp:0,pts:0,talentPicks:0,talents:[],offer:null,st,hp:0,wounded:0,
    silver:12,food:6,fame:0,loyalty:60,men:0,champions:[],amulet:true,blessings:0,bld:{},tribe:'',reg:{},sel:'village',tab:'act',
    rival:{fate:'仍在西境某處磨著斧頭'},flags:{},log:[],stats:{duels:0,raids:0,battles:0,revived:0,fallen:0,blessGained:0},
    mercy:0,cruel:0,p3turn:0,lastRival:0,dead:false,won:false,lastCause:''};
  S.hp=maxHp();
  REGIONS.forEach(r=>S.reg[r.id]={st:'free',cd:0,def:r.def});
  log('離開峽灣，搭上往西的商船。');
  startGame();
  pushModal(el=>resultView(el,'渡海向西',`峽灣的冬天又長又冷。你是<em>${esc(name)}</em>，${bg.name}，十九歲，除了一把斧頭什麼都沒有。\n\n出發前，雅爾的兒子斯韋恩當著所有人的面笑你：「像你這樣的人，一輩子只配划槳。」\n\n母親把一枚刻著符文的護身符掛在你脖子上：「活著回來，或者別回來。」\n\n你搭上一艘往西的商船。海的另一邊，是一片沒有主人的土地。`,'第一章'));
};
function boot(data){
  if(data&&data.S){S=data.S;startGame();return;}
  showTitle();
}
window.claude?.hot?.snapshot?.(()=>({S:S&&!S.dead&&!S.won?S:null}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
