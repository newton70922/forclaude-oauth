function spouseDayTick(){
  const k=S.spouse,L=SPOUSE_DAY[k];if(!L) return false;
  if(S.flags.marT==null)S.flags.marT=S.turn;const n=S.flags.spDay||0;if(n>=L.length||S.turn-(S.flags.marT??S.turn)<3+n*5) return false;
  S.flags.spDay=n+1;const [title,text,a,b]=L[n];
  pushLater(eventModal({kind:'家',art:k,title,text,ch:[a,b].map(([t,r])=>({t,fx:()=>{addLoyalty(3);if(champ(k))bond(k,5);return `${r}\n<span class="good">忠誠 +3</span>`;}}))}));
  return true;
}

  if(!S.flags.envoy&&!S.flags.ragna&&!(S.turn<(S.flags.mournT||0))) addAlert(1+Math.floor(t/12));

  if(crossed()&&S.turn-(S.flags.crossT||0)>=6&&!S.flags.pagan){S.flags.pagan=1;pushLater(eventModal(EV_PAGAN));return true;}

  if(!S.flags.rumor&&daneAlert()>=40){S.flags.rumor=1;pushLater(el=>resultView(el,'南方的傳言',`從丹麥來的商人在市集上壓低聲音說話。\n\n「藍牙聽說了，」他們說，「聽說北方有一群野蠻人，搶了${S.flags.osRaids?'修道院':'港口'}，還佔了別人的城。他在耶靈的王廳裡問了三次你的名字。」\n\n<span class="bad">丹麥人開始注意你了。你在海外每打下一座城、每搶一次，他們就更警戒一分。</span>\n（王國頁可以看到丹麥的警戒度；現在也可以開始「備戰」）`,'丹麥'));return true;}
  if(!S.flags.omenShown&&daneAlert()>=70){
    S.flags.omen=1;S.flags.omenShown=1;S.flags.omenT=S.turn;
    pushLater(el=>resultView(el,'預兆',omenText(),'ᛞ 預兆'));return true;
  }
  if(daneRecall()) return true;
  if(S.flags.kingFate==='spared'&&!S.flags.kingDead&&(t>=7||S.flags.ragna)){kingDeath();return true;}

  if(S.flags.envoy==='war'&&S.turn>=S.flags.warT&&!S.flags.warDone){finalWar();return true;}
  return false;

function ragRush(final,fline,fn){

  const r3=final==='surtr'?['fenrirG','巨狼芬里爾','巨狼芬里爾掙斷了繩子，朝你撲了過來。']:['surtr','火巨人蘇爾特','火巨人蘇爾特從南方的天空走了下來，每一步，都把冰原燒成了水。'];
  const K=S.flags.kingRag;// 'met'：覺醒的老王；'unmet'：騎馬的老王
  const pre=n=>K==='met'?.15:K==='unmet'&&n<4?.1:0;
  const kLine=(n,name)=>K==='met'?`\n<span class="good">哈夫丹的雙斧先劈了上去！${name}少了 15% 的血。</span>`
    :K==='unmet'?(n<4?`\n<span class="good">哈夫丹的劍先砍了上去！${name}少了 10% 的血。</span>`:`\n哈夫丹第一個衝了上去，卻被${name}一眼看穿，一擊打飛了出去。他撐著劍站起來，渾身是血：「……接下來，交給你了。」`):'';
  const heal=t=>{const h=Math.round(maxHp()*(.2+(S.spouse?.1:0)));S.hp=Math.min(maxHp(),Math.max(S.hp,1)+h);return `\n\n${t}\n<span class="good">生命 +${h}</span>`;};
  const fall=next=>{if(charges()>0){if(S.blessings>0)S.blessings--;else S.amulet=false;S.hp=Math.round(maxHp()*.4);pushLater(next);return '你倒下了。一隻冰冷的手抓住你的手腕，把你從灰燼裡拉了起來。是女武神。\n「還沒結束。」她說。\n<span class="bad">用掉了一次祈福</span>';}return '';};
  const R=(n,k,name,line,cause,next,o2)=>()=>duel(k,{lethal:true,rag:1,mul:1.2,xp:40+n*10,preHit:pre(n),sig:SIG[k],intro:`<b>第${'一二三四'[n-1]}輪</b>　${line}${kLine(n,name)}`,cause,...(o2||{}),onEnd:next});
  const round4=R(4,final,fn,fline,`死在${fn}的口中`,w=>w?(pushLater(el=>ch4End(el,'ragnarok')),`${fn}倒下了。整個世界安靜了下來。`):(charges()>0?(pushLater(el=>ch4End(el,'ragnarok')),'你倒下了。但在你倒下之前，你的斧頭已經砍進了牠的喉嚨。'):''),{final:1,kingGuard:K==='met'});
  const round3=R(3,r3[0],r3[1],r3[2],`死在${r3[1]}的手下`,w=>w?(pushLater(round4),`${r3[1]}倒下了。${heal(ragAidLine(2))}`):fall(round4));
  const round2=R(2,r2[0],r2[1],r2[2],`死在${r2[1]}的口中`,w=>w?(pushLater(round3),`${r2[1]}倒下了。${heal(ragAidLine(2))}`):fall(round3));
  R(1,'hrym','赫列姆','霜巨人的首領赫列姆從納吉爾法船上跳了下來，冰原裂開了一條縫。他舉起一根比桅杆還粗的冰柱：「凡人，你是第一個。」','被霜巨人赫列姆砸進了冰裡',w=>w?(pushLater(round2),`赫列姆倒下了，冰原震了一下。${heal(ragAidLine(1))}`):fall(round2))();
}

const danMul=()=>{
  let m=1;
  if(S.spouse==='sweyn'||S.spouse==='gunnhild') m*=.7;
  const pp=S.prep||{};if(pp.fleet)m*=.92;if(pp.bribe)m*=.9;if(pp.grain)m*=.95;if(pp.fort)m*=.87;
  m*=S.flags.spouseWar||1;
  m*=1-Math.min(.12,S.fame/2500);
  m*=1+.04*osYours().length; // 你越大，藍牙帶來的人越多
  if(S.flags.sweynTalk) m*=.9;
  if(S.heir&&S.heir.trait==='peace') m*=.95;
  if(S.flags.ragnarVan) m*=.92;
  if(S.flags.ragnarDane) m*=1.1;
  if(S.flags.allyHelp) m*=.95;
  if(crossed()){if(S.os.wessex.st==='ally')m*=.85;if(S.os.paris.st==='ally')m*=.85;}
  else{const aid={odin:.1,thor:.15,tyr:.08,freyja:.08,loki:.12};for(const g in aid){if(gt(g,3))m*=1-aid[g];else if(gt(g,2))m*=1-aid[g]/2;}}
  return m;
};

function shieldWallFn(o){
  return el=>{
    ambSet('battle');markGame('shieldwall');
    const TL=o.rag?RAG_SW:Object.fromEntries(Object.entries(SW_ACTS).map(([k,x])=>[k,x.tells]));
    const N=6-(o.bonus||0);const seq=Array.from({length:N},()=>{const k=pick(Object.keys(SW_ACTS));return [k,pick(TL[k])];});
    const react=S.mini==='react';const T=(S.relaxed?3.4:2.4)*1000;let i=0,score=0,raf=0,t0=0,over=false;const res=[];
    if(o.bonus){score+=o.bonus;res.push(...Array(o.bonus).fill(true));}
    const answer=k=>{if(over)return;cancelAnimationFrame(raf);const ok=k===seq[i][0];if(ok)score++;sfx(ok?'clash':'bad');res.push(ok);i++;if(i>=N)finish();else draw(ok?'<span class="good">擋住了！</span>':`<span class="bad">慢了一步！（應該${SW_ACTS[seq[i-1][0]].name}）</span>`);};
    const finish=()=>{over=true;mgKey=null;if(score>=6)unlock('shieldwall');
      el.innerHTML=`<p class="eyebrow">${o.rag?'防線':'盾牆'}</p><h2>${o.title}</h2><div class="res">${res.map(x=>x?'🛡':'✕').join(' ')}\n${score>=5?'<span class="good">盾牆像山一樣立著。</span>':score>=3?'盾牆晃了幾下，但撐住了。':'<span class="bad">盾牆被撞開了好幾個缺口。</span>'}\n守住 ${score}/6：敵方戰力 ×${(1.15-score*.06).toFixed(2)}</div><button class="primary" id="m-ok">迎戰</button>`;
      $('#m-ok').onclick=()=>{o.onEnd(score);closeModal();};$('#m-ok').focus();};
    const draw=msg=>{
      el.innerHTML=`<p class="eyebrow">${o.rag?'防線':'盾牆'} · ${i+1+(o.bonus||0)}/6</p><h2>${o.title}</h2>
      ${i===0?`<p class="story">${o.rag?'巨人不會排盾牆，他們只會用蠻力砸。看清楚他們要做什麼，下對命令。':'敵人會用弓箭、長矛和推擠來打你的盾牆。看清楚他們要做什麼，下對命令。'}${react?'動作要快。':'慢慢想沒關係。'}${o.bonus?`<br><span class="good">${o.bonusTxt}（已經先守住 ${o.bonus} 次）</span>`:''}</p>`:''}
      <p class="hint">${seq[i][1]}</p>${react?'<div class="swtime"><i id="sw-t"></i></div>':''}
      <div class="moves sw">${Object.entries(SW_ACTS).map(([k,x])=>`<button class="move" data-sw="${k}"><b>${x.arrow} ${x.name}</b></button>`).join('')}</div>
      <p class="story" style="font-size:13px;color:var(--muted)">${msg||''}　守住 ${score}/${i+(o.bonus||0)}</p>`;
      el.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>answer(b.dataset.sw));
      if(react){t0=performance.now();const tk=t=>{if(over)return;const f=1-(t-t0)/T;const bar=$('#sw-t');if(bar)bar.style.width=Math.max(0,f*100)+'%';if(f<=0){answer(null);return;}raf=requestAnimationFrame(tk);};raf=requestAnimationFrame(tk);}
    };
    mgKey=e=>{const k=Object.keys(SW_ACTS).find(k=>SW_ACTS[k].key===e.key);if(k){e.preventDefault();answer(k);}};
    draw();
  };
}

  if(kind==='lokiside') return ['end4_loki','騙子的盟友','新的世界有了一個新的國王。眾神再也沒有回來。'];
  if(kind==='abdicate') return ['end4_abdicate','交出王冠的王','你在還站得穩的時候，把王冠交給了下一代。'];

  if(osYours().length>=3) return ['end4_sea','北海之王','從都柏林到約克，北海成了你家門口的海灣。'];

function ch4End(el,kind){
  Q.length=0;S.flags.endKind=kind;

  if(['lost','vassal','ragfall','lokiside'].includes(kind)) S.dead=true; else S.won=true;
  if(kind==='ragnarok') S.flags.ragWon=1;
  unlock(eid);if(kind==='win'||kind==='ragnarok')unlock('end4_win');log(`第四章結局：${title}。`);
  const scene={win:S.flags.struck?`耶靈的王廳燒起來了。「藍牙」哈拉爾跪在他父親立的大符文石前，把戒指交到你手裡。\n\n${age()} 歲的你站在丹麥的土地上，盔甲上全是別人的血。從來沒有一個北方的王，打到過這裡。\n\n${line}`:`帕爾納托基的劍插在沙灘上。「藍牙」哈拉爾的船，一艘一艘消失在南方的海平線上。\n\n${age()} 歲的你站在海灘上，盔甲上全是別人的血。這是你這輩子打過最大的一仗。\n\n${line}`,
    vassal:`你在丹麥使者面前跪了下來。\n\n王冠還在你頭上。只是從此以後，每年冬天，都有一艘載滿白銀的船往南開。\n\n${line}`,
    lost:`王廳燒起來的時候，你最後看了一眼王座。\n\n二十年前，你是一個只有一把斧頭的年輕人。現在，你又只剩下一把斧頭了。\n\n${line}`,
    ragnarok:`${S.flags.warDone?'你打退了丹麥人，又撐過了世界的最後一天。':''}戰鬥結束時，天空是灰色的，地上全是冰和灰。你拄著斧頭站著，${patron()?`${GODS[patron()].name}就站在你身邊。`:'身邊站著倖存的眾神。'}\n\n然後，你看見了：在灰燼的下面，有一根綠色的嫩芽。\n\n預言說，諸神黃昏之後，新的世界會從海裡升起，倖存的人會在草地上找到眾神的金色棋子。你彎下腰，撿起了一顆。\n\n${line}`,
    ragfall:ragfallScene(line),
    lokiside:`你握住了洛基的手。他笑了，笑得像個孩子。\n\n那一天，彩虹橋斷了，瓦爾哈拉燒了。新的世界升起來的時候，王座上坐著的，是你。\n\n只是每到晚上，你都會聽見渡鴉在窗外，叫著你的名字。\n\n${line}`,
    abdicate:`你在法石前摘下王冠，放在${S.heir?esc(S.heir.name):'繼承人'}的頭上。雅爾們一個一個跪了下來。\n\n${S.heir&&S.heir.trait?{war:'新王拔出劍，向全挪威宣誓：丹麥人來的那一天，他會站在最前面。',song:'新王在加冕宴上唱了一首歌，唱的是你的一生。很多人哭了。',peace:'新王用撒克遜話、丹麥話和挪威話各說了一次誓言。幾年後，丹麥人沒有打過來，而是派人來談和。',sea:'新王第二天就上了船。他說，北海的另一邊還有很多地方，你還沒去過。',champ:`你最信任的勇士戴上了王冠。${['astrid','gudrun','una'].includes(S.heir.champ)?'她':'他'}說，會像當年跟著你一樣，守著這個王國。`,divine:'新王的眼睛閃著金光。從那天起，挪威的麥子每一年都長得特別好。'}[S.heir.trait]||'':''}\n\n你回到了當年那片海灘，在一間小屋裡住了下來。\n\n${line}`}[kind];
  endScreen(el,`${kind==='ragfall'&&ART_HAVE.has(ragfallArt())?sceneImg(ragfallArt()):portrait({stage:3,size:'small'})}
  <p class="eyebrow">第四章終章 · ${title}</p><h2>${esc(S.name)}</h2>
  <p class="story">${scene}</p>${!['lost','lokiside'].includes(kind)?freyjaReveal():''}
  <p class="quote">${{win:'「母親，這一次，你一定看見了。」',vassal:'「……母親，對不起。」',lost:'「活著回來，或者別回來。……我回來了，母親。」',ragnarok:'「母親，世界重新開始了。」',ragfall:'「母親……我來了。」',lokiside:'「母親，你會原諒我嗎？」',abdicate:'「母親，我回家了。」'}[kind]}</p>
  ${sagaHTML()}`);
}
function kingdomHTML(){
  if(S.phase<4) return '';
  const t=P4();
  const dane=S.flags.ragna&&!S.flags.ragDone?`<span class="bad">芬布爾之冬：${Math.max(0,S.flags.fimbulT+FIMBUL-S.turn)} 季後諸神黃昏</span>`:S.flags.envoy==='war'&&!S.flags.warDone?`<span class="bad">丹麥大軍 ${Math.max(0,S.flags.warT-S.turn)} 季後來襲</span>`:S.flags.warDone?'丹麥人被打退了':S.flags.omen?'南方的天空很不平靜':'北方的天空還很平靜';
  const jl=Object.entries(S.jarls||{}).map(([l,c])=>`${CHAMPS[c].name}（${(R(l)||O(l)).name}）`);
  const al=Math.min(100,daneAlert());
  return `<div class="card" style="display:grid;gap:8px;margin-bottom:10px"><h3 style="font-size:18px">王國</h3>
  ${!S.flags.envoy&&!S.flags.warDone?`<div><small style="color:var(--muted)">丹麥的警戒度 ${al}/100${al>=70?'・藍牙在造船':al>=40?'・藍牙在打聽你':'・丹麥人還沒注意到你'}</small><div class="track" style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:4px"><div style="height:100%;width:${al}%;background:${al>=70?'var(--blood)':'var(--ember)'}"></div></div></div>`:''}
  ${S.prep&&Object.keys(S.prep).length?`<div class="meta"><span>備戰 <b>${Object.keys(S.prep).map(k=>PREP[k].name).join('、')}</b></span></div>`:''}
  <div class="meta"><span>伴侶 <b>${S.spouse?SPOUSES[S.spouse].name+(S.flags.freyWed?'（弗蕾亞在神界看著）':''):S.flags.freyWed?'弗蕾亞（神界）':'無'}</b></span><span>繼承人 <b>${S.heir?`${esc(S.heir.name)}${S.heir.trait?`（${HEIR_TRAIT[S.heir.trait].name}）`:''}`:'無'}</b></span><span>信仰 <b>${{cross:'受洗',prime:'十字記號',old:'舊神'}[S.faith]||'舊神'}</b></span></div>
  <div class="meta"><span>國法 <b>${S.laws.length?S.laws.map(k=>LAWS[k].name).join('、'):'無'}</b></span><span>雅爾 <b>${jl.length?jl.join('、'):'無'}</b></span></div>
  <div class="meta"><span>海外領地 <b>${osYours().length?osYours().map(o=>o.name).join('、'):'無'}</b></span><span>${dane}</span></div></div>`;
}

function questTick(){
  if(S.phase<2) return false;
  S.quest=S.quest||{};S.qdone=S.qdone||{};
  // 第二段
  const ready=Object.keys(S.quest).find(id=>S.quest[id].st==='go'&&S.turn>=S.quest[id].t&&hasC(id));
  if(ready){S.quest[ready].t=S.turn+2;pushLater(questB(ready));return true;}
  // 第一段：一年最多一次
  if(S.turn-(S.flags.questT??-99)<4) return false;
  const id=S.champions.map(c=>c.id).find(id=>QUESTS[id]&&(!S.quest[id]||(S.quest[id].st==='later'&&S.turn-S.quest[id].t>=8))&&champ(id).bond>=60&&!isJarlId(id));
  if(id&&Math.random()<.6){S.flags.questT=S.turn;pushLater(questA(id));return true;}
  return false;
}
const isJarlId=id=>!!(S.jarls&&Object.values(S.jarls).includes(id));
function questA(id){
  const q=QUESTS[id],n=CHAMPS[id].name;
  const sc=q.sa&&ART_HAVE.has(q.sa);
  return eventModal({kind:`${n}的心事`,art:sc?undefined:id,scene:sc?q.sa:undefined,title:q.a,text:q.at.replace('{QUEST}',ORI().quest),ch:[
    {t:'「好，我們一起去。」',fx:()=>{S.quest[id]={st:'go',t:S.turn+2};bond(id,5);return `${n}點點頭。\n<span class="good">兩季後出發（${n}好感 +5）</span>`;}},
    {t:'「現在不行。」',fx:()=>{S.quest[id]={st:'later',t:S.turn};bond(id,-5);return `${n}沒再說什麼。\n${n}好感 -5（一年後${cP(id)}也許會再提）`;}}]});
}
function questB(id){
  const q=QUESTS[id],n=CHAMPS[id].name;
  const done=()=>{S.quest[id].st='done';if(id==='knut')addInfamy(-10);S.qdone[id]=1;bond(id,20);addFame(6);unlock('quest_any');if(Object.keys(S.qdone).length>=5)unlock('quest5');log(`完成了${n}的心願。`);
    pushModal(el=>resultView(el,`${n}覺醒`,`${q.win}\n<span class="good">${q.reward}\n${n}好感 +20，名聲 +6</span>`,`${n}的心事`,q.sw&&ART_HAVE.has(q.sw)?q.sw:id));return '';};
  return eventModal({kind:`${n}的心事`,art:id,title:q.b,text:q.bt,ch:[
    {t:'動手',note:typeof q.goNote==='function'?q.goNote():q.goNote,fx:()=>{q.go(()=>{done();return `<span class="good">${n}的心願完成了。</span>`;});return null;}},
    {t:'改天再來',fx:()=>{return `${n}嘆了口氣：「好吧。」\n（兩季後還可以再試）`;}}]});
}

function rollWeather(){
  const s=S.turn%4;
  if(S.flags.ragna&&!S.flags.ragDone){S.weather='harsh';return;}
  const o=WX_ODDS[s];const tot=Object.values(o).reduce((a,b)=>a+b,0);let r=Math.random()*tot;
  for(const [k,v] of Object.entries(o)){r-=v;if(r<=0){S.weather=k;break;}}
  if(S.weather!=='fair') log(`${SEASON[s]}天，${WEATHER[S.weather].name}。`);
}

// 追山羊：反應型點跳來跳去的羊；解謎型把羊逼到角落（牠每兩步要停下來啃一次靴子）
function goatChase(){
  markGame('goat');
  pushModal(el=>{
    const react=S.mini==='react';let done=false;
    const finish=w=>{done=true;mgKey=null;if(w)gainXp(6);else favor('loki',2);el.innerHTML=`<p class="eyebrow">冬 · 山羊又來了</p><h2>${w?'抓到了！':'牠跑了'}</h2><div class="res">${w?'你撲上去，一把抱住了山羊。牠嘴裡還叼著你的另一隻靴子，一臉無辜地看著你。\n<span class="good">經驗 +6</span>':'山羊一頭鑽進了豬圈，從另一頭溜走了。你光著一隻腳站在雪地裡。族人說，這是洛基的山羊。'}</div><button class="primary" id="m-ok">繼續</button>`;$('#m-ok').onclick=closeModal;$('#m-ok').focus();render();};
    if(react){
      let pos=ri(0,8),got=0,timer=0;const need=3,end=Date.now()+(S.relaxed?14000:10000);
      const hop=()=>{if(done)return;if(Date.now()>end){finish(false);return;}let n;do{n=ri(0,8);}while(n===pos);pos=n;draw();timer=setTimeout(hop,S.relaxed?900:650);};
      const draw=()=>{el.innerHTML=`<p class="eyebrow">冬 · 山羊又來了</p><h2>抓住 ${got} / ${need} 次</h2><p class="hint">山羊在長屋裡跳來跳去。趁牠停下來的時候撲上去！要抓住牠三次，牠才會放棄。</p>
        <div class="snowgrid">${Array.from({length:9},(_,i)=>`<button data-gt="${i}">${i===pos?'🐐':''}</button>`).join('')}</div>`;
        el.querySelectorAll('[data-gt]').forEach(b=>b.onclick=()=>{if(done||+b.dataset.gt!==pos)return;got++;sfx('hit');clearTimeout(timer);if(got>=need){finish(true);return;}hop();});};
      draw();timer=setTimeout(hop,S.relaxed?900:650);
    }else{
      const W=5;const rocks=new Set();while(rocks.size<3){const r=ri(0,W*W-1);if(r!==0&&r!==W*W-1)rocks.add(r);}
      let me=0,goat=W*W-1,steps=0,limit=18;
      const xy=i=>[i%W,Math.floor(i/W)],dist=(a,b)=>{const [ax,ay]=xy(a),[bx,by]=xy(b);return Math.abs(ax-bx)+Math.abs(ay-by);};
      const nbs=i=>{const [x,y]=xy(i);return [[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[x+dx,y+dy]).filter(([a,b])=>a>=0&&b>=0&&a<W&&b<W).map(([a,b])=>b*W+a).filter(j=>!rocks.has(j));};
      const draw=msg=>{el.innerHTML=`<p class="eyebrow">冬 · 山羊又來了</p><h2>步數 ${steps} / ${limit}</h2><p class="hint">把山羊逼到角落抓住牠。你每走一步，牠就逃一步；不過牠每逃兩步，就會停下來啃一次你的靴子。<small>▲ 是乾草堆，誰都過不去。${msg||''}</small></p>
        <div class="snowgrid five">${Array.from({length:W*W},(_,i)=>`<button data-gm="${i}" ${nbs(me).includes(i)?'class="can"':''}>${i===me?'🧔':i===goat?'🐐':rocks.has(i)?'▲':''}</button>`).join('')}</div>`;
        el.querySelectorAll('[data-gm]').forEach(b=>b.onclick=()=>{const i=+b.dataset.gm;if(done||!nbs(me).includes(i))return;me=i;steps++;
          if(me===goat){finish(true);return;}
          if(steps%3!==0){const opts=nbs(goat).filter(j=>j!==me);if(opts.length){opts.sort((a,b)=>dist(b,me)-dist(a,me));if(dist(opts[0],me)>=dist(goat,me))goat=opts[0];}}
          if(steps>=limit){finish(false);return;}draw(steps%3===0?'　山羊停下來啃靴子了！':'');});};
      draw();
    }
  });
}

let AC=null;
const soundOn=()=>{try{return localStorage.getItem('na-sound')!=='0';}catch(e){return true;}};
function sfx(k){
  if(!soundOn()) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    if(AMB.want){const w=AMB.want;AMB.want=null;ambSet(w);}
    const t=AC.currentTime,g=AC.createGain();g.connect(AC.destination);
    const tone=(type,f1,f2,dur,vol)=>{const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);const gg=AC.createGain();gg.gain.setValueAtTime(vol,t);gg.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gg);gg.connect(g);o.start(t);o.stop(t+dur);};
    const noise=(dur,vol,hp)=>{const b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const gg=AC.createGain();gg.gain.value=vol;s.connect(f);f.connect(gg);gg.connect(g);s.start(t);};
    g.gain.value=.35;
    if(k==='hit'){noise(.12,.6,600);tone('sine',140,60,.15,.5);}
    else if(k==='clash'){tone('square',880,620,.25,.12);tone('square',1320,900,.2,.08);noise(.08,.3,2000);}
    else if(k==='drum'){tone('sine',110,50,.25,.8);}
    else if(k==='horn'){const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(110,t);o.frequency.linearRampToValueAtTime(147,t+.25);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;const gg=AC.createGain();gg.gain.setValueAtTime(.001,t);gg.gain.linearRampToValueAtTime(.35,t+.15);gg.gain.linearRampToValueAtTime(.001,t+1.1);o.connect(f);f.connect(gg);gg.connect(g);o.start(t);o.stop(t+1.2);}
    else if(k==='ok'){tone('triangle',660,null,.25,.3);setTimeout(()=>sfx('ok2'),90);}
    else if(k==='ok2'){tone('triangle',990,null,.3,.25);}
    else if(k==='bad'){tone('sawtooth',160,90,.4,.2);}
    else if(k==='coin'){tone('triangle',1400,null,.08,.2);setTimeout(()=>tone('triangle',1900,null,.12,.2),60);}
  }catch(e){}
}

/* ---------- 環境音（程式合成，不用音檔）：海浪、風聲、戰鼓 ---------- */
const ambOn=()=>{try{return localStorage.getItem('na-amb')!=='0';}catch(e){return true;}};
const AMB={mode:null,nodes:null,drumT:0,want:null,beat:0};
function ambInit(){
  if(AMB.nodes||!AC) return;
  const len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}
  AMB.master=AC.createGain();AMB.master.gain.value=.5;AMB.master.connect(AC.destination);
  // 噪音 → 濾波 → 起伏（慢速 LFO）→ 音量（看現在是什麼情境）
  const mk=(type,freq,q,rate,depth)=>{const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
    const g1=AC.createGain();g1.gain.value=.6;const g2=AC.createGain();g2.gain.value=0;src.connect(f);f.connect(g1);g1.connect(g2);g2.connect(AMB.master);src.start();
    const o=AC.createOscillator();o.frequency.value=rate;const og=AC.createGain();og.gain.value=depth;o.connect(og);og.connect(g1.gain);o.start();return {f,g2};};
  AMB.nodes={sea:mk('lowpass',420,.5,.11,.4),wind:mk('bandpass',700,1.2,.07,.35)};
  const wo=AC.createOscillator();wo.frequency.value=.05;const wg=AC.createGain();wg.gain.value=240;wo.connect(wg);wg.connect(AMB.nodes.wind.f.frequency);wo.start();
}
function ambThump(v){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(78,t);o.frequency.exponentialRampToValueAtTime(42,t+.22);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(AMB.master);o.start(t);o.stop(t+.35);}
function ambSet(mode){
  if(!ambOn()||!soundOn()) mode='off';
  if(!AC){AMB.want=mode;return;}// 瀏覽器要等玩家點過一次才准出聲
  try{
    ambInit();if(AMB.mode===mode) return;AMB.mode=mode;
    const L={off:[0,0],sea:[.1,.012],autumn:[.065,.04],winter:[.02,.09],battle:[.03,.05],boss:[0,.075]}[mode]||[0,0],t=AC.currentTime;
    AMB.nodes.sea.g2.gain.setTargetAtTime(L[0],t,1.2);AMB.nodes.wind.g2.gain.setTargetAtTime(L[1],t,1.2);
    clearInterval(AMB.drumT);AMB.beat=0;
    if(mode==='battle'||mode==='boss'){const ms=mode==='boss'?640:920;
      AMB.drumT=setInterval(()=>{if(document.hidden||!AC)return;AMB.beat++;ambThump(mode==='boss'?.5:.3);if(mode==='boss'&&AMB.beat%4===3)setTimeout(()=>ambThump(.32),ms/2);},ms);}
  }catch(e){}
}

function render(){
  if(!S||$('#game-screen').hidden) return;

  $('#h-name').textContent=S.name+(S.tribe?` · ${S.tribe}`:'');

  $('#h-hp').textContent=`${Math.max(0,S.hp)} / ${maxHp()}`;
  $('#h-hpbar').style.width=clamp(S.hp/maxHp()*100,0,100)+'%';
  $('#h-lvl').textContent=`第 ${S.lvl} 級`;
  $('#h-xp').textContent=`${S.xp} / ${xpNeed()}`;
  $('#h-xpbar').style.width=(S.xp/xpNeed()*100)+'%';
  const chips=[['銀幣',S.silver,S.phase>1&&S.silver<wages()*2],['糧食',S.food,S.food<upkeep()*2],['名聲',`${S.fame}${S.phase>=2?`・${FAME_TIER[fameTier()].name}`:''}`]];
  if(S.infamy>0) chips.push(['惡名',`${S.infamy}・${INF_TIER[infTier()].name}`,S.infamy>=40]);
  chips.push([S.phase===1?'同伴':'戰士',S.phase===1?S.men:`${S.men}${S.vets||S.elite?`（老兵 ${S.vets}・精兵 ${S.elite}）`:''}`,S.phase>1&&S.men>command()]);
  if(S.phase>=2) chips.push(['忠誠',S.loyalty,S.loyalty<30]);
  $('#chips').innerHTML=chips.map(([k,v,w])=>`<span class="chip ${w?'warn':''}"><span>${k}</span><b>${v}</b></span>`).join('')+
    `<span class="chip"><span>祈福</span><span class="bless">${Array.from({length:maxBless()},(_,i)=>`<i class="${i<charges()?'on':''}">ᚱ</i>`).join('')}</span></span>`;
  $('#side').innerHTML=charHTML();
  $('#goal').innerHTML=goalHTML();
  sumRender();
  const tabs=S.phase>=4?[['act','行動'],['map','挪威'],['sea','海外'],['tribe','王國'],['char','角色']]:[['act','行動'],['map','地圖'],['tribe','部落'],['char','角色']];
  $('#tabs').innerHTML=tabs.map(([k,n])=>`<button role="tab" class="tab-${k}" aria-selected="${S.tab===k}" data-tab="${k}">${n}${k==='char'&&(S.pts>0||S.talentPicks>0)?'<span class="dot"></span>':''}</button>`).join('');
  let pane='';
  if(S.tab==='act') pane=`<div class="acts">${actions().map(a=>`<button class="act ${a.key&&!a.dis?'key':''}" data-a="${a.id}" ${a.dis?'disabled':''}><b>${a.name}</b><small>${a.desc}</small><span class="gain">${a.dis||a.gain}</span></button>`).join('')}</div>`;
  else if(S.tab==='map') pane=mapHTML();
  else if(S.tab==='sea'&&S.phase>=4) pane=seaHTML();
  else if(S.tab==='tribe') pane=kingdomHTML()+tribeHTML();
  else pane=`<div class="card">${charHTML()}</div>`;
  $('#pane').innerHTML=pane;
  $('#log').innerHTML=S.log.slice(0,8).map(([t,x])=>`<li><span>${t}</span>${x}</li>`).join('');
  save();
}

document.addEventListener('click',e=>{
  if(!S||modalOpen||$('#game-screen').hidden) return;
  const t=e.target.closest('[data-ct],[data-tab],[data-a],[data-r],[data-ra],[data-o],[data-oa],[data-b],[data-s],[data-pol],[data-tl],[data-set]');
  if(!t) return;
  const d=t.dataset;
  if(d.ct){S.ctab=d.ct;render();return;}
  if(d.tab){S.tab=d.tab;render();if(d.tab==='tribe')tipCheck();return;}
  if(d.a){const a=actions().find(x=>x.id===d.a);if(a&&!a.dis){a.run();render();}return;}
  if(d.r){S.sel=d.r;render();return;}
  if(d.o){S.osel=d.o;render();return;}
  if(d.oa){const a=osActs(O(S.osel)||OS[0]).A[+d.oa];if(a&&a.run&&!a.dis){a.run();render();}return;}
  if(d.ra){const a=regionActs(R(S.sel)).A[+d.ra];if(a&&a.run&&!a.dis){a.run();render();}return;}
  if(d.b){const b=B(d.b),l=bl(d.b),[cs,cf]=bldCost(b,l);if(S.tlv>=b.tl&&l<bldMax()&&S.silver>=cs&&S.food>=cf)build(d.b);return;}
  if(d.pol){S.policy=d.pol;render();return;}
  if(d.tl){const u=tribeUp();if(u&&S.silver>=u.cost[0]&&S.food>=u.cost[1]&&bldCount()>=u.need)upgradeTribe();return;}
  if(d.set){if(d.set==='tips'){S.noTips=d.v==='0';}else if(d.set==='sound'){try{localStorage.setItem('na-sound',d.v);}catch(e){}if(d.v==='1')sfx('ok');AMB.mode=null;ambAuto();}else if(d.set==='amb'){try{localStorage.setItem('na-amb',d.v);}catch(e){}AMB.mode=null;ambAuto();}else if(d.set==='mini')S.mini=d.v;else S.relaxed=d.v==='1';render();return;}
  if(d.s&&S.pts>0){const k=d.s;S.st[k]++;S.pts--;if(k==='con')S.hp+=6;render();return;}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.node')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});

/* ================= 英靈殿（排行榜） ================= */
// 自己的紀錄存在這台裝置，也會寫到雲端（寫得進去的人才有）；朋友的紀錄用「薩迦碼」請主人登錄
const HALL_KEY='na-hall-v1';
const hallLocal=()=>{try{const a=JSON.parse(localStorage.getItem(HALL_KEY));return Array.isArray(a)?a:[];}catch(e){return [];}};
const hallSaveLocal=a=>{try{localStorage.setItem(HALL_KEY,JSON.stringify(a.slice(0,40)));}catch(e){}};
let hallCloud=[],hallMsg='',hallMine=false;
function hallScore(){
  const k=S.flags.endKind,dead=S.dead&&!(S.phase>=4&&k);
  const base=dead?(S.phase>=4?100:0):S.phase<4?100:({ragnarok:400,win:200,abdicate:150,ragfall:250,lokiside:250,lost:100,vassal:100})[k]??100;
  const lands=REGIONS.filter(r=>S.reg[r.id].st==='yours').length*5+(S.os?osYours().length*10:0);
  const deeds=Object.keys(S.runAch||{}).length*10;
  const mul=({easy:.8,normal:1,hero:1.5})[S.diff]*(S.stats.revived?1:1.2)*(S.flags.skipCh?.7:1);
  return Math.round((base+Math.floor(S.fame/10)+lands+deeds)*mul);
}
function hallRecord(){
  if(!S||S.sandbox) return null;
  S.runId=S.runId||(Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const dead=S.dead&&!(S.phase>=4&&S.flags.endKind);let ep='';try{ep=EPITHETS.find(e=>e[0]())[1];}catch(e){}
  const t=dead?(S.lastCause||'倒在半路上'):S.phase<4?ending()[1]:ch4Ending(S.flags.endKind||'win')[1];
  const run={id:S.runId,n:S.name,ep,t,s:hallScore(),d:S.diff,y:age(),a:Date.now(),c:S.flags.skipCh||0};
  const L=hallLocal().filter(r=>r.id!==run.id);L.push(run);L.sort((a,b)=>b.s-a.s);hallSaveLocal(L);
  hallPush();
  return run;
}
// 把這台裝置上自己的紀錄寫到雲端（每人一份文件）。寫不進去就安靜放棄，改用薩迦碼
async function hallPush(){
  if(!remote.rdb||!remote.uid||remote.hallNo) return;
  try{await remote.rdb.doc('hall/'+remote.uid).set({runs:hallLocal().slice(0,20),at:Date.now()});remote.hallOk=true;}
  catch(e){remote.hallNo=true;}
}
async function hallSync(){
  if(!remote.rdb) return;
  try{
    const [a,b]=await Promise.all([remote.rdb.collection('hall').get(),remote.rdb.collection('hallx').get()]);
    const out=[];
    a.docs.forEach(d=>{const x=d.data();(x&&Array.isArray(x.runs)?x.runs:[]).forEach(r=>out.push({...r,u:d.id}));});
    b.docs.forEach(d=>{const r=d.data();if(r)out.push({...r,g:1});});
    hallCloud=out.map(hallClean).filter(Boolean);
    // 換裝置時，把雲端上自己的紀錄拿回來
    const mine=hallCloud.filter(r=>r.u===remote.uid),L=hallLocal();let ch=false;
    mine.forEach(r=>{if(!L.some(x=>x.id===r.id)){const {u,...rest}=r;L.push(rest);ch=true;}});
    if(ch){L.sort((x,y)=>y.s-x.s);hallSaveLocal(L);}else if(L.length&&L.length!==mine.length)hallPush();
  }catch(e){}
  if(!$('#title-screen').hidden) hallRender();
}
// 別人寫的資料不能直接相信：檢查型別、長度和範圍
function hallClean(r){
  if(!r||typeof r!=='object'||typeof r.id!=='string'||typeof r.n!=='string') return null;
  const str=(v,n)=>String(v==null?'':v).slice(0,n),num=(v,a,b)=>Math.max(a,Math.min(b,Math.round(+v||0)));
  return {id:str(r.id,24),n:str(r.n,8),ep:str(r.ep,12),t:str(r.t,20),s:num(r.s,0,5000),d:['easy','normal','hero'].includes(r.d)?r.d:'normal',y:num(r.y,0,120),a:num(r.a,0,4e12),c:num(r.c,0,4),u:r.u?str(r.u,64):undefined,g:r.g?1:undefined};
}
// 薩迦碼：NA1.<內容>.<檢查碼>。檢查碼只防打錯字，不防竄改
const hallSum=t=>{let h=7;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h.toString(36).slice(-4);};
function hallCode(run){const {u,g,...r}=run;const body=btoa(unescape(encodeURIComponent(JSON.stringify(r))));return `NA1.${body}.${hallSum(body)}`;}
function hallParse(code){
  try{const m=String(code).trim().match(/NA1\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)/);if(!m||hallSum(m[1])!==m[2])return null;
    return hallClean(JSON.parse(decodeURIComponent(escape(atob(m[1])))));}catch(e){return null;}
}
function hallNote(run){
  if(!run) return '';
  return `<div class="hallnote">這一局的分數：<b>${run.s}</b>　已記入英靈殿。
    <br><small style="color:var(--muted)">想登上大家的排行榜，把下面的薩迦碼傳給分享這個遊戲給你的人。${remote.owner?'（你是主人，你的紀錄會自動上榜。）':''}</small>
    <textarea id="hall-code" readonly>${hallCode(run)}</textarea><button class="ghost" id="hall-copy">複製薩迦碼</button></div>`;
}
function hallNoteBind(run){
  const b=$('#hall-copy');if(!b||!run) return;
  b.onclick=()=>{const t=$('#hall-code');t.focus();t.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}
    if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>{b.textContent='已複製';},()=>{b.textContent=ok?'已複製':'請長按上面的文字複製';});else b.textContent=ok?'已複製':'請長按上面的文字複製';};
}
function hallAll(){
  const map={};
  hallCloud.forEach(r=>{map[r.id]=r;});
  hallLocal().map(hallClean).filter(Boolean).forEach(r=>{map[r.id]={...(map[r.id]||{}),...r,me:1};});
  if(remote.uid) Object.values(map).forEach(r=>{if(r.u===remote.uid)r.me=1;});
  return Object.values(map).sort((a,b)=>b.s-a.s||b.a-a.a);
}
function hallRender(){
  const box=$('#hall-body');if(!box) return;
  const all=hallAll(),list=(hallMine?all.filter(r=>r.me):all).slice(0,50);
  $('#hall-sum').textContent=`英靈殿（排行榜）${all.length?` · ${all.length} 筆`:''}`;
  const dn={easy:'輕鬆',normal:'標準',hero:'英雄'};
  box.innerHTML=`<div class="hall">
    <div class="seg" style="margin-bottom:8px"><span>顯示</span><button data-hm="0" aria-pressed="${!hallMine}">全部</button><button data-hm="1" aria-pressed="${hallMine}">只看我的</button></div>
    ${list.length?list.map((r,i)=>`<div class="hrow ${r.me?'me':''}"><i>${i+1}</i><b>${r.ep?`「${esc(r.ep)}」`:''}${esc(r.n)}</b><span class="sc">${r.s}</span>
      <small>${esc(r.t)} · ${dn[r.d]} · ${r.y} 歲${r.c?` · 從第 ${r.c} 章開始`:''}${r.a?` · ${new Date(r.a).toLocaleDateString('zh-TW')}`:''}${r.me?' · 你':''}</small></div>`).join('')
      :'<p class="hmsg">還沒有紀錄。打完一局（稱王、第四章結局，或是倒下）就會記在這裡。</p>'}
    <p class="hmsg">${remote.rdb?(remote.owner||remote.hallOk?'你的紀錄會自動上榜。':'你的紀錄存在這台裝置。想上大家的排行榜，把結局畫面的薩迦碼傳給分享這個遊戲的人。'):'登入 Claude 帳號後，才看得到大家的排行榜；現在只顯示這台裝置的紀錄。'}</p>
    ${remote.owner?`<div><b>登錄朋友的薩迦</b><textarea id="hall-in" placeholder="把朋友傳來的薩迦碼貼在這裡（NA1. 開頭）"></textarea><button class="ghost" id="hall-add">登錄</button> <span class="hmsg" id="hall-msg">${hallMsg}</span></div>`:''}
  </div>`;
  box.querySelectorAll('[data-hm]').forEach(b=>b.onclick=()=>{hallMine=b.dataset.hm==='1';hallRender();});
  const add=$('#hall-add');
  if(add) add.onclick=async()=>{
    const r=hallParse($('#hall-in').value);
    if(!r){hallMsg='這串薩迦碼看起來不對，請確認有完整複製。';hallRender();return;}
    const {u,g,...body}=r;
    try{await remote.rdb.doc('hallx/'+r.id.replace(/[^A-Za-z0-9_-]/g,'')).set(body);hallMsg=`已登錄：${r.n}（${r.s} 分）`;await hallSync();}
    catch(e){hallMsg='登錄失敗，請稍後再試。';}
    hallRender();
  };
}

/* ---------- 每季結算摘要（主畫面上的小卡，不用按繼續） ---------- */
let sumOpen=false;
const SUM_KEYS=[['silver','銀幣'],['food','糧食'],['fame','名聲'],['loyalty','忠誠'],['infamy','惡名'],['men','戰士'],['dane','丹麥警戒']];
const sumSnap=()=>({silver:S.silver,food:S.food,fame:S.fame,loyalty:S.loyalty,infamy:S.infamy,men:S.men,dane:Math.round(S.dane||0)});
function sumRender(){
  const box=$('#sumcard');if(!box||!S)return;
  // 等這一季的事件都處理完（沒有彈窗）才結算，這樣事件造成的變化也算在裡面
  if(S.sumPend&&!modalOpen){
    const now=sumSnap(),p=S.snap,P=S.sumPend;S.snap=now;S.sumPend=null;sumOpen=false;
    if(p){const d={};for(const k in now)d[k]=now[k]-p[k];S.sum={n:P.n,d,si:P.si,fi:P.fi,up:P.up,wg:P.wg};}
  }
  if(!S.snap) S.snap=sumSnap();
  const m=S.sum;if(!m||S.dead||S.won){box.innerHTML='';return;}
  const sign=v=>v>0?`+${v}`:`−${-v}`;
  const parts=SUM_KEYS.filter(([k])=>m.d[k]).map(([k,n])=>{const v=m.d[k];const bad=['infamy','dane'].includes(k)?v>0:v<0;return `<span class="${bad?'dn':'up'}">${k==='men'&&S.phase===1?'同伴':n} ${sign(v)}</span>`;});
  // 現在就看得到的危險
  const W=[];const [si,fi]=income();const net=fi-upkeep();
  if(net<0&&S.food/(-net)<3) W.push(`糧食只夠再撐 ${Math.max(0,Math.floor(S.food/(-net)))} 季`);
  if(S.phase>1&&wages()>0&&S.silver+si<wages()) W.push('下一季發不出軍餉');
  if(S.phase>1&&S.men>command()) W.push('戰士超過你帶得動的人數，忠誠會一直掉');
  if(S.phase>1&&S.loyalty<30) W.push('忠誠太低，戰士會在夜裡開溜');
  const oS=m.d.silver-(m.si-m.wg),oF=m.d.food-(m.fi-m.up);
  const body=`銀幣：收入 +${m.si}${m.wg?`、軍餉 −${m.wg}`:''}${oS?`、行動與事件 ${sign(oS)}`:''}<br>糧食：收成 +${m.fi}、吃掉 −${m.up}${oF?`、行動與事件 ${sign(oF)}`:''}`;
  box.innerHTML=`<div class="sumcard" id="sum-box"><div class="sumrow"><b>${m.n>1?`過去 ${m.n} 季結算`:'上一季結算'}</b>${parts.join('')||'<span>沒有變化</span>'}<span class="more">${sumOpen?'收起':'明細'}</span></div>
    ${W.map(w=>`<span class="warn">⚠ ${w}</span>`).join('')}${sumOpen?`<div class="sumbody">${body}</div>`:''}</div>`;
  $('#sum-box').onclick=()=>{sumOpen=!sumOpen;sumRender();};
}

    ${n>=4?`<div class="field"><span class="lbl">老王哈夫丹的下場</span><div class="opts">${[['spared','饒了他','他回農莊終老'],['dead','處決了他','你自己戴上了王冠'],['','他自己讓位','沒有和他單挑']].map(([k,t,d])=>`<button class="opt" data-ck="${k}" aria-pressed="${opt.king===k}"><b>${t}</b><small>${d}</small></button>`).join('')}</div></div>
    <div class="field"><span class="lbl">你最常拜的神</span><div class="opts">${[['','沒有特別拜哪一位','']].concat(Object.keys(GODS).map(g=>[g,GODS[g].name,'神恩從 70 開始'])).map(([k,t,d])=>`<button class="opt" data-cg="${k}" aria-pressed="${opt.god===k}"><b>${t}</b><small>${d}</small></button>`).join('')}</div></div>`:''}
    <button class="primary" id="cs-go" ${opt.champs.length<P.champs?'disabled':''}>開始</button>`;
    $('#cs-tribe').oninput=e=>{opt.tribe=e.target.value;};
    el.querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>{const c=b.dataset.cc;opt.champs=opt.champs.includes(c)?opt.champs.filter(x=>x!==c):[...opt.champs,c];draw();});
    el.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{opt.king=b.dataset.ck;draw();});
    el.querySelectorAll('[data-cg]').forEach(b=>b.onclick=()=>{opt.god=b.dataset.cg;draw();});
    $('#cs-go').onclick=()=>{if(opt.champs.length<P.champs)return;opt.tribe=(opt.tribe.trim()||'渡鴉谷').slice(0,8);applyChapter(n,opt);closeModal();render();};
  };
  draw();
}
function chMuster(first){
  const A=S.flags.chArmy;if(!A)return;
  const cap=Math.min(housing(),command()),men=Math.min(A.men,cap),f=A.men?men/A.men:0;
  S.men=men;S.vets=Math.floor(A.vets*f);S.elite=Math.floor(A.elite*f);
  S.snap=sumSnap();S.sum=null;S.sumPend=null;
  if(!first){delete S.flags.chArmy;S.hp=maxHp();toast(men<A.men?`戰士集結完畢：${men} 人（威望或住房不夠，帶不動更多）`:`戰士集結完畢：${men} 人`);render();}
}
function applyChapter(n,opt){
  const P=CH_PRESET[n];
  S.flags.skipCh=n;S.turn=P.turn;S.favor=S.favor||{odin:0,thor:0,tyr:0,freyja:0,loki:0};
  for(let l=1;l<P.lvl;l++){S.lvl++;S.pts+=D().pts;if(S.lvl%2===0)S.talentPicks++;}
  S.silver+=P.silver;S.food+=P.food;S.fame+=P.fame;S.tribe=opt.tribe;S.phase=2;S.loyalty=P.loyalty||60;S.tlv=P.tlv;S.bld={...P.bld};
  S.men+=P.men;S.vets=P.vets;S.elite=P.elite;S.lastBattle=S.turn;S.lastRaid=S.turn-4;S.flags.ingrid=1;S.flags.mate=1;
  opt.champs.forEach(c=>addChamp(c,70));
  if(n>=3){S.phase=3;S.p3turn=S.turn+1;}
  if(n>=4){['grey','red','winter','village'].forEach(r=>S.reg[r].st='yours');S.reg.eagle.st='ally';S.rival.attacks=3;S.rival.fate='被你打敗，離開了挪威';
    if(opt.king)S.flags.kingFate=opt.king;if(opt.god)S.favor[opt.god]=70;}
  // 戰士要等能力點數分配完才集結（帶得動多少人，要看威望）
  S.flags.chArmy={men:S.men,vets:S.vets,elite:S.elite};chMuster(true);
  S.blessings=Math.min(maxBless(),P.bless);S.hp=maxHp();
  log(`這一局從${CH_NAMES[n].replace('　','「')}」開始。`);
  if(n>=4){startCh4();return;}
  note(CH_NAMES[n],n===2?`你已經闖蕩了好幾年，存下了第一筆錢，也有幾個人願意跟著你。\n\n你在海灣邊找到一塊向陽的坡地，把斧頭劈進橡樹樁：從今天起，這裡是<span class="good">${esc(S.tribe)}</span>。\n\n接下來：蓋建築、招募戰士、出兵突襲，把部落養大。`
    :`<span class="good">${esc(S.tribe)}</span>已經是海岸上數一數二的部落。\n\n你派出使者，帶著你的旗幟走遍挪威的峽灣。拉德的雅爾、鷹巢峰的女首領、紅帆營的赫羅爾夫，還有維斯特福爾的老王，都聽見了你的名字。\n\n接下來：拿下四方勢力，戴上王冠。`,'章節開局',n===2?'sc_ch2':'sc_ch3');
}

/* ================= 開始畫面 ================= */
const NEW={bg:'smith',diff:'normal',legacy:'none',mini:'react',relaxed:false,chapter:1,look:{sex:'m',skinId:'base',stage:0}};
function showTitle(){
  $('#game-screen').hidden=true;$('#title-screen').hidden=false;ambAuto();
  const m=meta();const okNeed=n=>!n||m.ach[n];
  const L=NEW.look;
  const seg=(lbl,key,opts)=>`<div class="seg"><span>${lbl}</span>${opts.map(([v,n,dis])=>`<button data-look="${key}" data-v="${v}" aria-pressed="${String(L[key])===String(v)}" ${dis?'disabled':''}>${n}</button>`).join('')}</div>`;
  $('#looks').innerHTML=`<div class="heroes">${Object.entries(HEROES).map(([k,h])=>`<button class="hero" data-look="sex" data-v="${k}" aria-pressed="${L.sex===k}">${portrait({look:{...L,sex:k},stage:L.stage})}<b>${h.name}</b></button>`).join('')}</div>
    ${seg('畫框','skinId',Object.entries(SKINS).map(([k,sk])=>[k,`${sk.name}<small style="display:block;font-size:11px;opacity:.75">${sk.desc}</small>`,!okNeed(sk.need)]))}
    ${Object.values(SKINS).some(sk=>!okNeed(sk.need))?`<small class="lockhint">${Object.values(SKINS).filter(sk=>!okNeed(sk.need)).map(sk=>`${sk.name}：${ACH[sk.need].secret?ACH[sk.need].hint:`達成「${ACH[sk.need].name}」（${ACH[sk.need].hint}）`}`).join('<br>')}</small>`:''}`;
  $('#looks').querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>{const k=b.dataset.look;let v=b.dataset.v;if(k==='stage')v=+v;L[k]=v;showTitle();});
  $('#minis').innerHTML=`<button class="opt" data-mini="react" aria-pressed="${NEW.mini==='react'}"><b>反應型</b><small>四種小遊戲輪流出現：看準時機反擊、閃避三連擊、限時符文連擊、蓄力一擊。考驗反應和手速。</small></button>
    <button class="opt" data-mini="puzzle" aria-pressed="${NEW.mini==='puzzle'}"><b>解謎型</b><small>四種小遊戲輪流出現：旋轉符文石、擺盾牌擋攻擊線、猜符文鎖、符文配對。沒有時間壓力，比的是步數。</small></button>`;
  $('#minis').querySelectorAll('[data-mini]').forEach(b=>b.onclick=()=>{NEW.mini=b.dataset.mini;showTitle();});
  $('#relax-row').hidden=NEW.mini!=='react';
  $('#in-relax').checked=NEW.relaxed;$('#in-relax').onchange=e=>{NEW.relaxed=e.target.checked;};
  $('#bgs').innerHTML=BGS.map(b=>`<button class="opt" data-bg="${b.id}" aria-pressed="${b.id===NEW.bg}"><b>${b.name}</b><small>${b.desc}</small><span class="tag">${STAT[b.st]} +2</span></button>`).join('');
  $('#bgs').querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{NEW.bg=b.dataset.bg;showTitle();});
  $('#diffs').innerHTML=Object.entries(DIFF).map(([k,d])=>`<button class="opt" data-diff="${k}" aria-pressed="${k===NEW.diff}"><b>${d.name}</b><small>${d.desc}</small></button>`).join('');
  $('#diffs').querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{NEW.diff=b.dataset.diff;showTitle();});
  const legs=Object.entries(LEGACY).filter(([k,l])=>okNeed(l.need));
  $('#legacy-field').hidden=legs.length<2;
  const chOpen=[1,2,3,4].filter(chUnlocked);if(!chOpen.includes(NEW.chapter))NEW.chapter=1;
  $('#ch-field').hidden=chOpen.length<2;
  $('#chs').innerHTML=[1,2,3,4].map(n=>`<button class="opt" data-ch="${n}" aria-pressed="${n===NEW.chapter}" ${chUnlocked(n)?'':'disabled'}><b>${CH_NAMES[n]}</b><small>${n===1?'從頭開始':chUnlocked(n)?CH_DESC[n]:'還沒打到這一章'}</small></button>`).join('');
  $('#chs').querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{NEW.chapter=+b.dataset.ch;showTitle();});
  const h1=document.querySelector('.title-hero h1');if(h1&&!h1.dataset.tap){h1.dataset.tap='1';let taps=0,tm=0;h1.onclick=()=>{taps++;clearTimeout(tm);tm=setTimeout(()=>taps=0,1500);if(taps>=5){taps=0;const mm=meta();mm.ach._all=Date.now();saveMeta(mm);toast('已解鎖全部章節');showTitle();}};}
  $('#legacies').innerHTML=legs.map(([k,l])=>`<button class="opt" data-leg="${k}" aria-pressed="${k===NEW.legacy}"><b>${l.name}</b><small>${l.desc}</small></button>`).join('');
  $('#legacies').querySelectorAll('[data-leg]').forEach(b=>b.onclick=()=>{NEW.legacy=b.dataset.leg;showTitle();});
  hallRender();
  $('#btn-train').onclick=trainStart;$('#btn-gal').onclick=()=>pushModal(galView);
  $('#codex-sum').textContent=`北境百科 ${Object.keys(m.codex||{}).filter(k=>CODEX_ALL[k]).length}/${Object.keys(CODEX_ALL).length}`;
  $('#codex-list').innerHTML=codexHTML();
  const got=Object.keys(ACH).filter(k=>m.ach[k]).length;
  $('#ach-sum').textContent=`成就 ${got}/${Object.keys(ACH).length}`;
  $('#ach-list').innerHTML=Object.entries(ACH).map(([k,a])=>m.ach[k]?`<div class="on"><b>${a.name}</b><small>${a.desc}${a.reward?`　獎勵：${a.reward}`:''}</small></div>`:`<div><b>${a.secret?'？？？':a.name}</b><small>${a.hint}${a.reward?`　獎勵：${a.secret?'？？？':a.reward}`:''}</small></div>`).join('');
  $('#ach-tools').innerHTML=`<span>${remote.db?'成就和存檔會同步到你的 Claude 帳號，換裝置也在。':'成就只存在這個瀏覽器。清除瀏覽資料或換裝置就會不見，可以先複製備份碼留著。'}</span>
    <div class="row"><button class="ghost" id="bk-copy">複製成就備份碼</button><button class="ghost" id="bk-show">貼上備份碼還原</button></div>
    <div id="bk-area" hidden><label for="bk-text" style="display:block;margin-bottom:4px">備份碼</label><textarea id="bk-text" spellcheck="false"></textarea>
    <div class="row" style="margin-top:6px"><button class="ghost" id="bk-apply">還原</button><span id="bk-msg"></span></div></div>`;
  $('#bk-copy').onclick=()=>{const c=backupCode();$('#bk-area').hidden=false;$('#bk-text').value=c;$('#bk-text').select();
    const done=()=>{$('#bk-msg').textContent='已複製。把這串文字存在備忘錄裡就好。';};
    try{navigator.clipboard.writeText(c).then(done,()=>{$('#bk-msg').textContent='已選取，請手動複製。';});}catch(e){$('#bk-msg').textContent='已選取，請手動複製。';}};
  $('#bk-show').onclick=()=>{$('#bk-area').hidden=false;$('#bk-text').value='';$('#bk-text').focus();$('#bk-msg').textContent='';};
  $('#bk-apply').onclick=()=>{if(restoreCode($('#bk-text').value)){showTitle();$('#ach-box').open=true;$('#bk-area').hidden=false;$('#bk-msg').textContent='已還原。';}else $('#bk-msg').textContent='備份碼看起來不對，請確認有完整複製。';};
  const sv=load();
  $('#continue-row').hidden=!sv;
  if(sv) $('#continue-info').textContent=`${sv.name} · 第 ${sv.lvl} 級 · ${['','孤身闖蕩','部落首領','挪威的挑戰者','挪威之王'][sv.phase]} · ${DIFF[sv.diff].name}`;
}
function startGame(){
  if(S){S.favor=S.favor||{odin:0,thor:0,tyr:0,freyja:0,loki:0};S.master=S.master||{};}
  $('#title-screen').hidden=true;$('#game-screen').hidden=false;window.scrollTo(0,0);render();checkPost();
}
$('#btn-continue').onclick=()=>{S=load();if(S)startGame();};
$('#btn-start').onclick=()=>{
  const name=($('#in-name').value.trim()||'雷夫').slice(0,8);
  const bg=BGS.find(b=>b.id===NEW.bg);
  const st={str:3,con:3,wit:3,pre:3};st[bg.st]+=2;
  const look={sex:NEW.look.sex,skinId:NEW.look.skinId};
  S={v:SAVE_V,diff:NEW.diff,name,look,legacy:NEW.legacy,mini:NEW.mini,relaxed:NEW.relaxed,bg:bg.id,turn:0,phase:1,lvl:1,xp:0,pts:0,talentPicks:0,talents:[],st,hp:0,scars:0,wounded:0,
    silver:12,food:6,fame:0,infamy:0,loyalty:60,men:0,vets:0,elite:0,champions:[],amulet:true,blessings:0,tribe:'',tlv:1,bld:{},policy:'big',reg:{},sel:'village',tab:'act',
    rival:{fate:'仍在挪威某處磨著斧頭',attacks:0},flags:{},known:{},log:[],trainLog:[],
    stats:{duels:0,raids:0,battles:0,revived:0,fallen:0,blessGained:0,bears:0,fair:0,greedy:0,atone:0,infMax:0},
    mercy:0,cruel:0,p3turn:0,lastBattle:0,lastRaid:-99,dead:false,won:false,lastCause:''};
  if(S.legacy==='axe') S.st.str++;
  if(S.legacy==='chart') S.silver+=20;
  if(S.legacy==='song') S.fame+=10;
  if(S.legacy==='blood') for(const k in S.st) S.st[k]++;
  if(S.legacy==='ring') S.men+=2;
  S.hp=maxHp();
  REGIONS.forEach(r=>S.reg[r.id]={st:'free',cd:0,def:r.def});
  log('離開故鄉的峽灣，搭上南下的商船。');
  if(NEW.chapter>1){const n=NEW.chapter;S.noTips=true;$('#title-screen').hidden=true;$('#game-screen').hidden=false;window.scrollTo(0,0);render();pushModal(el=>chSetup(el,n));return;}
  startGame();
  note('離開峽灣',`峽灣的冬天又長又冷。你是<em>${esc(name)}</em>，${bg.name}，十九歲，除了一把斧頭什麼都沒有。\n\n${ORIGIN[bg.id].open}\n\n你攥緊拳頭，脫口而出：「總有一天，我會當上國王。」\n\n赫羅爾夫和他的人笑得前仰後合。\n\n母親把一枚刻著符文的護身符掛在你脖子上：「活著回來，或者別回來。」\n\n你搭上一艘南下的商船。這片海岸四分五裂：各地的雅爾互相攻伐，老王的權威早已名存實亡。\n\n那句話是氣頭上說的。可是船離開峽灣的那個晚上，你發現自己是認真的。`,`第一章 · ${D().name}難度`,'sc_ch1');
};
function boot(data){
  if(data&&data.S&&data.S.v===SAVE_V){S=data.S;startGame();return;}
  showTitle();
}
window.claude?.hot?.snapshot?.(()=>({S:S&&!S.dead&&!S.won&&!S.sandbox?S:null}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
initRemote();
</script>
