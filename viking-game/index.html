<title>北境雄心</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Runic&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout：頂部狀態列＋桌面左側角色欄、右側行動面板；手機單欄，角色收進分頁。刻意單一深色主題（峽灣夜色）。 */
:root{
  --bg:#0f1417;        /* 峽灣夜色 */
  --panel:#172025;     /* 濕木板 */
  --panel2:#1e2a30;
  --line:#2c3a42;
  --bone:#e9e0cf;      /* 骨白 */
  --muted:#97a3a5;
  --ember:#d47a3b;     /* 鍛爐餘燼 */
  --frost:#8fbfcf;     /* 祈福與冰霜 */
  --blood:#b5432f;
  --gold:#cfab5c;
  --land:#1b2622;
  --sea:#0c1215;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-rune:"Noto Sans Runic","Segoe UI Historic",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.65;
  background-image:radial-gradient(ellipse at 20% -10%,#1d2a30 0,transparent 55%),radial-gradient(ellipse at 110% 110%,#231a14 0,transparent 50%);
  background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.rune{font-family:var(--f-rune);letter-spacing:.15em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:900}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--ember);margin:0 0 4px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}

/* 標題畫面 */
.title-hero{padding-block:28px 8px;display:grid;gap:10px}
.title-hero .rune{color:var(--ember);font-size:15px}
.title-hero h1{font-size:clamp(44px,11vw,84px);line-height:1;letter-spacing:.06em}
.title-hero p{max-width:34em;color:var(--muted);margin:0}
.form{display:grid;gap:22px;margin-top:22px}
.field>label,.field>.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;letter-spacing:.08em}
.field input{width:100%;max-width:320px;background:var(--panel);border:1px solid var(--line);color:var(--bone);padding:10px 12px;font:inherit;font-size:17px;border-radius:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:4px;align-content:start}
.opt b{font-family:var(--f-display);font-size:17px}
.opt small{color:var(--muted);font-size:13px;line-height:1.5}
.opt .tag{color:var(--ember);font-size:12px}
.opt[aria-pressed="true"]{border-color:var(--ember);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--ember)}
.opt:disabled{opacity:.4}
.looks{display:grid;gap:12px}
.heroes{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:12px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;gap:6px;text-align:left}
.hero .portrait{max-width:none}
.hero b{font-family:var(--f-display);font-size:16px;padding-inline:2px}
.hero[aria-pressed="true"]{border-color:var(--ember);box-shadow:inset 0 0 0 1px var(--ember)}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg>span{font-size:13px;color:var(--muted);min-width:3.5em}
.seg button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:3px 12px;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}
.seg button:disabled{opacity:.35}
.swatch{width:26px;height:26px;padding:0!important;border-radius:50%!important}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ember)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.primary{background:var(--ember);color:#1a0f08;border:0;padding:11px 22px;border-radius:4px;font-weight:700;font-size:16px}
.primary:disabled{opacity:.4}
.ghost{background:transparent;border:1px solid var(--line);padding:10px 18px;border-radius:4px;color:var(--bone)}
details.ach{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
details.ach summary{cursor:pointer;font-family:var(--f-display);font-weight:600}
.ach-tools{display:grid;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.ach-tools textarea{width:100%;min-height:64px;background:var(--bg);color:var(--bone);border:1px solid var(--line);border-radius:4px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all}
.ach-tools .row button{padding:6px 12px;font-size:13px}
.ach-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px;font-size:13px}
.hall{margin-top:10px;font-size:13px}
.hall .hrow{display:grid;grid-template-columns:26px 1fr auto;gap:2px 8px;align-items:baseline;background:var(--bg);border-radius:5px;padding:8px 10px;margin-bottom:6px}
.hall .hrow.me{outline:1px solid var(--gold)}
.hall .hrow i{font-style:normal;color:var(--muted);font-family:var(--f-display)}
.hall .hrow b{font-family:var(--f-display);font-size:15px}
.hall .hrow .sc{font-family:var(--f-display);font-size:17px;color:var(--gold)}
.hall .hrow small{grid-column:2 / 4;color:var(--muted)}
.hall textarea{width:100%;min-height:60px;margin:6px 0;background:var(--bg);color:var(--bone);border:1px solid var(--line);border-radius:5px;padding:6px;font:12px monospace;box-sizing:border-box}
.hall .hmsg{color:var(--muted);margin:6px 0}
.gtabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.gtabs button{padding:6px 10px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--bone);font:inherit;font-size:13px;cursor:pointer}
.gtabs button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.ggrid{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.ggrid.wide{grid-template-columns:repeat(2,1fr)}
.gcell{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);padding:0;cursor:pointer;aspect-ratio:3/4}
.ggrid.wide .gcell{aspect-ratio:16/9}
.gcell img{width:100%;height:100%;object-fit:cover;display:block}
.gcell.lock{cursor:default}.gcell.lock img{filter:brightness(0);opacity:.45}
.gcell span{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:11px;background:rgba(0,0,0,.6);color:var(--bone);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbig img{width:100%;border-radius:8px;display:block}
.tlist{display:grid;gap:8px}
.titem{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.titem b{flex:1;font-family:var(--f-display);font-size:15px}
.titem small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.titem.lock{opacity:.5}
.titem button{padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--bone);font:inherit;font-size:13px;cursor:pointer}
.titem button:disabled{opacity:.4;cursor:default}
.famcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;font-size:14px}
.famcard b{display:block;font-family:var(--f-display);font-size:18px}
.famcard small{color:var(--muted)}
.famcard p{margin:8px 0 0;line-height:1.7}
.famcard i{font-style:normal;color:var(--gold);font-size:12px;display:block}
.hallnote{margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}
.hallnote b{color:var(--gold);font-family:var(--f-display);font-size:20px}
.hallnote textarea{width:100%;min-height:54px;margin-top:6px;background:var(--panel);color:var(--bone);border:1px solid var(--line);border-radius:5px;padding:6px;font:12px monospace;box-sizing:border-box}
.ach-list div{background:var(--bg);border-radius:5px;padding:8px 10px;display:grid}
.ach-list div.on b{color:var(--gold)}
.ach-list small{color:var(--muted)}

/* 遊戲主畫面 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(15,20,23,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .wrap{padding-block:10px;display:grid;gap:8px}
.top-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.top-line .nm{font-family:var(--f-display);font-weight:900;font-size:19px}
.top-line .sub{color:var(--muted);font-size:13px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.bar .track{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--blood);transition:width .4s}
.bar.xp .fill{background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;gap:5px;align-items:baseline;white-space:nowrap}
.chip span{color:var(--muted)}
.chip b{font-weight:700}
.chip.warn b{color:var(--blood)}
.bless{display:inline-flex;gap:3px;font-family:var(--f-rune)}
.bless i{font-style:normal;color:var(--line)}
.bless i.on{color:var(--frost);text-shadow:0 0 6px rgba(143,191,207,.6)}

.cols{display:grid;gap:18px;margin-top:16px}
@media (min-width:860px){.cols{grid-template-columns:290px 1fr}.tab-char{display:none!important}}
@media (max-width:859px){.side{display:none}}
.side{align-self:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.main{min-width:0;display:grid;gap:14px;align-content:start}
.goal{border-left:3px solid var(--ember);padding:8px 12px;background:var(--panel);font-size:14px}
.sumcard{margin-top:8px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;cursor:pointer}
.sumcard .sumrow{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.sumcard .sumrow b{font-family:var(--f-display);font-size:13px;color:var(--muted);font-weight:600}
.sumcard .up{color:#9fd18c}.sumcard .dn{color:var(--blood)}
.sumcard .sumbody{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--muted);line-height:1.8}
.sumcard .warn{color:var(--blood);display:block}
.sumcard .more{margin-left:auto;color:var(--muted);font-size:12px}
.goal b{color:var(--ember);font-weight:700}
.goal .prog{color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;font-family:var(--f-display);font-weight:600;font-size:15px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--ember)}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ember);margin-left:4px;vertical-align:middle}

.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.act{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:3px;align-content:start;transition:border-color .15s,transform .15s}
.act:not(:disabled):hover{border-color:var(--ember);transform:translateY(-1px)}
.act b{font-family:var(--f-display);font-size:16px}
.act small{color:var(--muted);font-size:13px;line-height:1.5}
.act .gain{color:var(--gold);font-size:12px}
.act:disabled{opacity:.45}
.act.key{border-color:var(--ember);background:linear-gradient(160deg,#2a1f17,var(--panel) 60%)}

.chron h3{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:6px}
.chron ol{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px}
.chron li{display:grid;grid-template-columns:auto 1fr;gap:10px;color:var(--muted)}
.chron li:first-child{color:var(--bone)}
.chron li span{font-variant-numeric:tabular-nums;color:var(--ember);opacity:.8;white-space:nowrap}

/* 角色 */
.char{display:grid;gap:12px}
.portrait{position:relative;width:100%;max-width:240px;aspect-ratio:3/4;margin:0 auto;border-radius:6px;overflow:hidden;border:2px solid var(--line);background:#0b0f11}
.portrait img{display:block;width:100%;height:100%;object-fit:cover}
.portrait::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 -40px 40px -20px rgba(15,20,23,.7)}
.portrait.wounded::after{box-shadow:inset 0 0 60px 10px rgba(150,30,20,.55),inset 0 -40px 40px -20px rgba(15,20,23,.7)}
.portrait .ptag{position:absolute;left:8px;bottom:6px;z-index:1;font-size:12px;color:var(--bone);text-shadow:0 1px 3px #000}
.portrait.f-frost{border-color:var(--frost);box-shadow:0 0 16px rgba(143,191,207,.35)}
.portrait.f-hero{border-color:var(--gold);box-shadow:0 0 16px rgba(207,171,92,.35)}
.portrait.f-raven{border:3px double #e9e0cf;outline:2px solid #000}
.portrait.f-paint{border-color:var(--blood);box-shadow:0 0 16px rgba(181,67,47,.4)}
.portrait.framed{border:0!important;box-shadow:none!important;outline:0!important;background:transparent;overflow:visible}
.portrait.framed img{position:absolute;inset:6% 7%;width:86%;height:88%;border-radius:2px}
.portrait.framed::after{inset:6% 7%}
.portrait .pframe{position:absolute;inset:0;background-size:100% 100%;pointer-events:none;z-index:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.portrait.framed .ptag{left:12%;bottom:9%;z-index:2}
.portrait.f-gold{border:3px solid #e6c46a;box-shadow:0 0 20px rgba(230,196,106,.45),inset 0 0 18px rgba(230,196,106,.25)}
.lockhint{display:block;color:var(--muted);font-size:12px;line-height:1.6;margin:-2px 0 8px}
.char h2{font-size:22px;text-align:center}
.char .who{text-align:center;color:var(--muted);font-size:13px;margin-top:-8px}
.stats{display:grid;gap:8px}
.stat{display:grid;grid-template-columns:26px 1fr auto auto;gap:8px;align-items:start}
.stat .r{font-family:var(--f-rune);color:var(--ember);font-size:18px;text-align:center;line-height:1.4}
.stat .v{font-weight:700;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.stat .v.low{color:var(--blood)}
.stat small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.stat .mile{display:block;font-size:11.5px;line-height:1.4;color:#4f626c}
.stat .mile.on{color:var(--gold)}
.plus{width:28px;height:28px;border-radius:4px;border:1px solid var(--ember);background:transparent;color:var(--ember);font-weight:700}
.list{display:grid;gap:6px;font-size:13px}
.list div{display:grid;gap:1px}
.list b{font-weight:700}
.list small{color:var(--muted)}
.sec-h{font-size:12px;letter-spacing:.14em;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.bless-big{display:flex;gap:8px;font-family:var(--f-rune);font-size:24px}
.bless-big i{font-style:normal;color:var(--line)}
.bless-big i.on{color:var(--frost);text-shadow:0 0 10px rgba(143,191,207,.55)}
.bond{display:inline-block;height:5px;background:var(--bg);border-radius:3px;width:60px;vertical-align:middle;overflow:hidden;margin-left:6px}
.bond i{display:block;height:100%;background:var(--ember)}

/* 地圖 */
.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node text{font-family:var(--f-body);font-size:9px;fill:var(--bone);paint-order:stroke;stroke:var(--sea);stroke-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.region{display:grid;gap:8px}
.region h3{font-size:20px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.meta b{color:var(--bone);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid currentColor}

/* 部落 */
.blds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.bld{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.bld.done{border-color:#5a4a2a}
.bld.max{border-color:var(--gold)}
.bld b{font-family:var(--f-display);font-size:17px}
.bld .lv{color:var(--gold);font-size:13px;letter-spacing:.1em}
.bld small{color:var(--muted);font-size:13px}
.bld .now{font-size:13px}
.bld .cost{font-size:13px;font-variant-numeric:tabular-nums}
.bld button{justify-self:start;padding:6px 14px;font-size:14px}
.policy{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.policy button{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:8px;text-align:left;display:grid;gap:1px;font-size:14px}
.policy button small{color:var(--muted);font-size:12px}
.policy button[aria-pressed="true"]{border-color:var(--ember)}
@media (max-width:480px){.policy{grid-template-columns:1fr}}

/* 視窗 */
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,10,.78);display:grid;place-items:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mbody{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
.mbody h2{font-size:24px}
.story{margin:0;white-space:pre-line}
.story em{font-style:normal;color:var(--ember)}
.quote{font-family:var(--f-display);font-size:19px;line-height:1.6;border-left:3px solid var(--frost);padding:4px 0 4px 14px;margin:0}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px 14px;display:grid;gap:2px}
.choice:not(:disabled):hover{border-color:var(--ember)}
.choice small{color:var(--muted);font-size:12.5px}
.choice:disabled{opacity:.45}
.res{background:var(--panel2);border-radius:5px;padding:12px 14px;white-space:pre-line}
.good{color:var(--gold)}.bad{color:var(--blood)}.blessed{color:var(--frost)}

.fighters{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fighter{display:grid;gap:4px;font-size:13px}
.fighter b{font-family:var(--f-display);font-size:15px}
.fighter .track{height:9px;background:var(--bg);border-radius:4px;overflow:hidden}
.fighter .fill{height:100%;background:var(--blood);transition:width .35s}
.fighter.foe .fill{background:var(--ember)}
.fighter .num{color:var(--muted);font-variant-numeric:tabular-nums}
.hint{background:var(--bg);border:1px dashed var(--line);border-radius:5px;padding:10px 12px;margin:0;font-size:14px}
.hint small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.hint .habit{color:var(--frost)}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.move{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px 12px;text-align:left;display:grid;gap:1px}
.move b{font-family:var(--f-display);font-size:17px}
.move small{color:var(--muted);font-size:12px}
.move:not(:disabled):hover{border-color:var(--ember)}

/* ================= 存檔與成就 ================= */
// 成就與存檔：本機一份，Claude 帳號（artifact 資料庫的私人空間）一份，兩邊合併
const remote={db:null,rdb:null,uid:null,owner:false,busy:{},pending:{},save:null,ready:false};
let META_CACHE=null,remoteSaveT=0;
function localMeta(){try{const m=JSON.parse(localStorage.getItem(META));return m&&m.ach?m:null;}catch(e){return null;}}
function mergeMeta(a,b){const m={ach:{...(a&&a.ach)},ends:{...(a&&a.ends)},shapes:{...(a&&a.shapes)},codex:{...(a&&a.codex)}};if(b){for(const k in b.ach||{})m.ach[k]=m.ach[k]||b.ach[k];for(const k in b.ends||{})m.ends[k]=1;for(const k in b.shapes||{})m.shapes[k]=1;for(const k in b.codex||{})m.codex[k]=1;}return m;}
function meta(){if(!META_CACHE)META_CACHE=mergeMeta(localMeta(),null);return META_CACHE;}
function saveMeta(m){META_CACHE=m;try{localStorage.setItem(META,JSON.stringify(m));}catch(e){}rwrite('meta',{ach:m.ach,ends:m.ends||{},shapes:m.shapes||{},codex:m.codex||{}});}
const rpath=k=>`data/users/${remote.uid}/${k}`;
function rwrite(key,data){if(!remote.db)return;remote.pending[key]=data;if(!remote.busy[key])rflush(key);}
async function rflush(key){
  if(!(key in remote.pending))return;
  const data=remote.pending[key];delete remote.pending[key];remote.busy[key]=true;
  try{if(data===null)await remote.db.doc(rpath(key)).delete();else await remote.db.doc(rpath(key)).set(data);}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){remote.db=null;if(!$('#title-screen').hidden)showTitle();}}
  finally{remote.busy[key]=false;if(key in remote.pending)rflush(key);}
}
async function initRemote(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const uid=await user.id();
    if(!uid) return;
    remote.db=db;remote.rdb=db;remote.uid=uid;try{remote.owner=!!(await user.isOwner());}catch(e){remote.owner=false;}hallSync();
    const [m,sv]=await Promise.all([db.doc(rpath('meta')).get(),db.doc(rpath('save')).get()]);
    const merged=mergeMeta(meta(),m.exists?m.data():null);
    META_CACHE=merged;try{localStorage.setItem(META,JSON.stringify(merged));}catch(e){}
    if(!m.exists||JSON.stringify(merged)!==JSON.stringify(mergeMeta(m.data(),null))) rwrite('meta',{ach:merged.ach,ends:merged.ends});
    if(sv.exists){const d=sv.data();if(d&&typeof d.json==='string')remote.save={json:d.json,at:d.at||0};}
    remote.ready=true;
    if(!$('#title-screen').hidden) showTitle();
  }catch(e){remote.db=null;}
}
function backupCode(){return btoa(unescape(encodeURIComponent(JSON.stringify(meta()))));}
function restoreCode(code){try{const m=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));if(!m||!m.ach)return false;saveMeta(mergeMeta(meta(),m));return true;}catch(e){return false;}}
function unlock(id){if(S&&S.sandbox)return;if(S){S.runAch=S.runAch||{};S.runAch[id]=1;}const m=meta();if(m.ach[id])return;m.ach[id]=Date.now();saveMeta(m);toast(`成就解鎖：${ACH[id].name}`);sfx('ok');}
function save(){
  if(!S||S.dead||S.won||S.sandbox) return;
  S.savedAt=Date.now();const json=JSON.stringify(S);
  try{localStorage.setItem(SAVE,json);}catch(e){}
  if(remote.db){clearTimeout(remoteSaveT);remoteSaveT=setTimeout(()=>{remote.save={json,at:S?S.savedAt:Date.now()};rwrite('save',{json,at:remote.save.at});},1500);}
}
function load(){
  let loc=null;try{const t=localStorage.getItem(SAVE);loc=t?JSON.parse(t):null;}catch(e){}
  let rem=null;try{rem=remote.save?JSON.parse(remote.save.json):null;}catch(e){}
  if(rem&&rem.v!==SAVE_V) rem=null;
  if(loc&&loc.v!==SAVE_V) loc=null;
  if(rem&&(!loc||(rem.savedAt||0)>(loc.savedAt||0))) return rem;
  return loc;
}
function clearSave(){try{localStorage.removeItem(SAVE);}catch(e){}clearTimeout(remoteSaveT);remote.save=null;rwrite('save',null);}

    OS.forEach(o=>{const g=S.os[o.id];if(g.st==='yours'){s+=Math.round((o.inc[0]+(law('tax')?2:0))*jm(o.id));f+=o.inc[1];}});
    if(S.os.wessex.st==='tribute') s+=6;

function upkeep(){return Math.round((S.phase===1?1+Math.ceil(S.men/2):Math.max(1,Math.ceil((S.men+S.champions.length)/4)+1-(has('quarter')?1:0)-(ownsR('village')?1:0)))*(wx('harsh')?1.5:1));}

const Q=[];let modalOpen=false;let ins=0;let mgKey=null;

function pushLater(fn){ Q.push(fn); if(!modalOpen) nextModal(); }
function nextModal(){
  ins=0;mgKey=null;
  const fn=Q.shift();
  const m=$('#modal');
  if(!fn){modalOpen=false;m.hidden=true;ambAuto();render();checkPost();return;}
  modalOpen=true;m.hidden=false;m.scrollTop=0;ambAuto();
  fn($('#mbody'));
  render();
}
const closeModal=()=>nextModal();
function resultView(el,title,html,eyebrow,art){
  el.innerHTML=`${art&&art.startsWith('sc_')?sceneImg(art):art&&hasArt(art)?avatar(art,'big'):''}${eyebrow?`<p class="eyebrow">${eyebrow}</p>`:''}<h2>${title}</h2><div class="res">${html}</div><button class="primary" id="m-ok">繼續</button>`;

}

  if(!S||S.dead||S.won) return;

function passTime(quiet){
  if(S.sandbox) return;

  const [si,fi]=income();
  const up0=upkeep();S.silver+=si;S.food+=fi-up0;
  const wg=wages();
  S.sumPend={n:((S.sumPend&&S.sumPend.n)||0)+1,si:((S.sumPend&&S.sumPend.si)||0)+si,fi:((S.sumPend&&S.sumPend.fi)||0)+fi,up:((S.sumPend&&S.sumPend.up)||0)+up0,wg:((S.sumPend&&S.sumPend.wg)||0)+wg};

    if(S.silver<0){S.silver=0;loseLoyalty(10);desert(.1);log('發不出軍餉，有戰士走了。');}

  const calmInf=S.turn-S.lastRaid>=3?-3:-1;
  S.infamy=clamp(S.infamy+calmInf+(hasC('sven')&&!qd('sven')?1:0)+(hasC('knut')&&!S.flags.knutReformed?1:0),0,100);
  if(S.wounded>0){S.wounded--;if(!S.wounded) log('傷勢痊癒，你重新握緊了斧頭。');}
  const reg=(1+Math.floor(S.st.con/3))*(eff('con')>=9?2:1)+(has('regen')?4:0)+(ownsR('marsh')?3:0)+bl('sauna')*2-((S.ageLv||0)>=1?1:0)-(wx('harsh')?2:0);
  S.hp=Math.min(maxHp(),S.hp+Math.max(1,reg));
  REGIONS.forEach(r=>{if(S.reg[r.id].cd>0)S.reg[r.id].cd--;});
  if(S.phase>=2){
    if(S.loyalty>60&&!((has('calm')||hasC('bragi')||law('feud'))&&S.turn%2)) loseLoyalty(S.loyalty>80?2:1);
    if(S.infamy>=40) loseLoyalty(1);
    const over=S.men-command();
    if(over>0){loseLoyalty(Math.ceil(over/2));if(!S.flags.overWarn){S.flags.overWarn=1;log('人太多了，你管不過來，族人開始不滿。');}}
    if(S.turn-S.lastBattle>=10){loseLoyalty(1);if(!S.flags.bored){S.flags.bored=1;log('太久沒打仗，戰士們閒得發慌。');}}
    if(hasC('ragnar')&&S.spouse!=='ragnar'&&!qd('ragnar')&&Math.random()<.25){loseLoyalty(3);log('拉格納又在長屋裡打破了誰的頭。');}
    if(S.loyalty<30&&S.men>2){desert(.08);log('族人對你失去信心，有戰士在夜裡溜走了。');}
    if(S.loyalty<40) bondAll(-2);
  }
  if(S.turn%4===0){const a=age();
    if(AGING[a]&&!S.flags['age'+a]){S.flags['age'+a]=1;pushLater(agingModal(a));}
    if(a>=60&&Math.random()<.1+(a-60)*.05){S.lastCause='在睡夢中老去';pushLater(strawDeathModal);return;}}
  // 斥候網：提前一季警告
  if(has('scoutnet')&&S.phase===3&&S.reg.red.st==='free'&&S.rival.attacks<3&&S.turn+1===S.p3turn+[4,12,20][S.rival.attacks]){log('斥候回報：紅帆船隊下一季會來襲。');toast('斥候回報：紅帆下一季來襲');}
  // 劇情
  if(S.phase===1&&S.turn>=2&&!S.flags.sven_intro){S.flags.sven_intro=1;pushLater(eventModal(EV_SVEN));return;}
  if(S.phase===3&&S.reg.red.st==='free'&&S.rival.attacks<3&&S.turn>=S.p3turn+[4,12,20][S.rival.attacks]){rivalAttack();return;}
  if(S.phase>=2&&S.loyalty<15&&S.turn-(S.flags.coupT??-99)>=8){S.flags.coupT=S.turn;pushLater(eventModal(EV_COUP));return;}
  if(S.phase===3&&S.infamy>=60&&!S.flags.coalition){S.flags.coalition=1;coalition(false);return;}
  if(S.phase>=2&&S.infamy>=80&&!S.flags.crusade){S.flags.crusade=1;coalition(true);return;}
  if(S.phase>=2){
    const tr=S.champions.find(c=>c.id!=='thorfinn'&&!c.oath&&c.bond<25&&S.loyalty<40);
    if(tr&&Math.random()<.3){betray(tr.id);return;}
  }
  if(S.trainLog.filter(t=>t>S.turn-6).length>=3&&S.turn-(S.flags.trainT??-99)>=6){S.flags.trainT=S.turn;pushLater(eventModal(EV_TRAIN));return;}
  if(gt('odin',2)) gainXp(3);
  if(S.infamy>=40) favor('loki',1);
  // 秋收節：族人吃得飽、過得好，弗雷亞會看在眼裡
  if(S.phase>=2&&S.turn%4===2&&S.loyalty>=70&&S.food>=S.men) favor('freyja',2);
  if(gt('freyja',3)&&!S.flags.fq){S.flags.fq=1;pushLater(eventModal(FQ_A));return;}
  if(S.flags.fq===2&&(S.flags.oddClue||0)>=3){pushLater(eventModal(FQ_B));S.flags.fq=2.5;return;}
  if(gt('loki',3)&&Math.random()<.08){pushLater(eventModal(Object.assign({kind:'ᛚ 洛基'},pick(LOKI_PRANKS))));return;}
  if(S.phase===4&&ch4Tick()) return;
  if(questTick()) return;
  if(varangReturn()) return;
  if(quiet) return;
  if(S.phase>=2&&!law('feud')&&cdOk('holm',8)&&Math.random()<.12){S.flags.cd_holm=S.turn;pushLater(holmgangEvent());return;}
  if(Math.random()<.4) randomEvent();
}
function desert(rate){
  if(S.men<=0) return;
  const l=Math.max(1,Math.ceil(S.men*rate));
  takeLosses(l,1);
}
// 傷亡：精兵比較不容易死
function takeLosses(l,eliteW){
  l=Math.min(l,S.men);
  let left=l;
  const pool=()=>({r:recruits(),v:S.vets,e:S.elite});
  while(left>0&&S.men>0){
    const p=pool();const w=p.r+p.v+p.e*eliteW;let x=Math.random()*w;
    if(x<p.r&&p.r>0){}else if((x-=p.r)<p.v&&p.v>0){S.vets--;}else if(p.e>0){S.elite--;}else if(p.v>0){S.vets--;}
    S.men--;left--;
  }
  return l;
}

const MV={H:'重擊',Q:'快攻',B:'格擋',R:'怒吼'};
function habitW(f,d){
  if(f.king&&d.awake) return [.45,.3,.25];
  const w=f.w.slice();
  const set=(m,p)=>{const i='HQB'.indexOf(m);for(let j=0;j<3;j++)w[j]=j===i?p:(1-p)/2;};
  switch(f.hab){
    case 'wolf': if(d.qs>=2)set('H',.8);break;
    case 'alt': if(d.last==='Q')set('H',.7);else if(d.last==='H')set('Q',.7);break;
    case 'bear': if(d.last==='H')set('B',.75);break;
    case 'guard': if(d.lastP==='B')set('H',.75);break;
    case 'counter': if(d.lastP)set({H:'Q',Q:'B',B:'H',R:'H',F:'H',X:'H'}[d.lastP],.65);break;
    case 'rage': if(d.hp<d.max*.5)set('H',.8);break;
    case 'astrid': if(d.last==='B')set('Q',.75);break;
    case 'edric': if(d.hit)set('B',.75);break;
    case 'chain': if(d.last==='Q')set('Q',.65);break;
    case 'cycle': if(d.last)set({B:'H',H:'Q',Q:'B'}[d.last],.75);break;
    case 'king': {const pc=d.pc||{};const tot=(pc.H||0)+(pc.Q||0)+(pc.B||0);if(tot>=2){const m=['H','Q','B'].sort((a,b)=>(pc[b]||0)-(pc[a]||0))[0];set({H:'Q',Q:'B',B:'H'}[m],.6);}break;}
  }
  return w;
}
function foeStats(key,mul){

  return {base,tm,max:Math.round(base.hp*tm*(1+(f-1)*.5)*(base.lord?1.1:1)),atk:base.atk*tm*f*(base.lord?1.2:1.12)};
}

        else if(gt('tyr',3)&&!d.tyrUsed){d.tyrUsed=true;toP=S.hp-1;t+='提爾的手托住了你，你沒有倒下！';}
        else if(hk&&hk.oath&&!d.hakonUsed){d.hakonUsed=true;toP=S.hp-1;t+='哈康撲上來，替你擋下了最後一刀！';}
      }

    // 怪物的絕招：先看規則，再玩加強版小遊戲
    const runSig=()=>{
      const sg=d.p2?FINAL_SIG:o.sig,react=S.mini==='react',game=react?sg.r:sg.p;markGame(game);markGame(game+'_h');
      const hdr=()=>`<p class="eyebrow">生死單挑 · 絕招</p><h2>${d.name}：${sg.name}</h2>`;

      if(g==='perfect'){toF=Math.round(pDmg()*1.5);t='你完全擋下了牠的絕招，還趁機回敬了一記！';}
      else if(g==='good'){toP=Math.max(1,Math.round(big*.4-eff('con')*.6));t='你擋下了大半，還是被餘勁掃到。';}
      else{toP=Math.max(1,Math.round(big-eff('con')*.6));t='絕招結結實實地打在你身上！';}
      if(o.lethal&&S.hp-toP<=0&&d.hp-toF>0){
        if(eff('con')>=12&&(d.stoodN||0)<(eff('con')>=18?2:1)){d.stoodN=(d.stoodN||0)+1;d.stood=true;toP=S.hp-1;t+='你咬著牙，硬是沒有倒下！';}
        else if(S.legacy==='sword'&&!d.swordUsed){d.swordUsed=true;toP=S.hp-1;t+='老王的劍在你手裡嗡嗡作響。你沒有倒下！';}
        else if(gt('tyr',3)&&!d.tyrUsed){d.tyrUsed=true;toP=S.hp-1;t+='提爾的手托住了你，你沒有倒下！';}

      if(o.final&&!d.p2&&d.hp<=0&&S.hp>0){d.hp=1;d.p2due=true;draw();return;}

    const finalAwaken=()=>{

        d.p2=true;d.hp=Math.round(d.max*.6);d.atk*=1.25*(o.kingGuard?.8:1);d.name=F[2];d.sigDone=false;
        d.log.unshift(`<b style="color:var(--ember)">${F[2]}</b>　牠的攻擊變猛了。${o.kingGuard?'哈夫丹站到了你的身邊：「這一下，我陪你。」':''}`);
        choose();draw();},'生死單挑 · 最終覺醒');
    };
    const settle=()=>{
      const fled=o.retreatAt&&d.hp>0&&d.hp<=d.max*o.retreatAt;
      if(d.hp<=0||fled||S.hp<=0){
        d.over=true;
        let win=d.hp<=0||fled;
        if(S.hp<=0&&win){S.hp=1;}
        if(!o.lethal&&S.hp<=0) S.hp=1;
        if(o.lethal&&S.hp<=0){S.hp=0;win=false;}
        if(win){S.stats.duels++;S.known[key]=1;favor('odin',2);gainXp(Math.round((o.xp||10)*fs.tm));if(S.stats.duels>=30)unlock('duelist');}
        const head=win?(fled?`<span class="good">${d.name}撐不住，轉身逃了。</span>`:`<span class="good">${d.name}倒下了。</span>`)
          :(S.hp<=0?'<span class="bad">你眼前一黑，倒在血泊裡……</span>':'<span class="bad">你輸了這場比武。</span>');
        const scar=o.lethal&&S.hp>0?maybeScar():'';
        d.result=head+'\n'+(o.onEnd?o.onEnd(win)||'':'')+scar;
      }else choose();
    };
    draw();
  });
}

// 代理人單挑和諸神黃昏的絕招共用的小遊戲。hard=1 是加強版
function makeMinis(el,header,apply,defend,st,skill,relax,logHtml,fail,hard){

  const dodge=()=>{

    const NS=hard?4:3;const seq=Array.from({length:NS},()=>pick(SW));const W=(hard?1450:1950+skill*150)*relax;let i=0,ok=0,done=false,timer=0;
    const end=()=>{done=true;clearTimeout(timer);mgKey=null;apply(ok===NS?'perfect':ok>=NS-1?'good':'miss');};

      <div class="mg-time"><i id="mg-bar" style="transition:width ${W}ms linear"></i></div>`+logHtml();
      requestAnimationFrame(()=>{const bar=$('#mg-bar');if(bar)bar.style.width='0%';});
      el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>pressD(b.dataset.v));
      timer=setTimeout(()=>next(false),W);
    };
    const next=hit=>{if(done)return;clearTimeout(timer);if(hit)ok++;i++;if(i>=NS)end();else setTimeout(()=>{if(!done)show();},250);};
    const pressD=v=>{if(done)return;next(v===seq[i][1]);};
    mgKey=e=>{const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'}[e.key];if(m){e.preventDefault();pressD(m);}};
    setTimeout(show,300);
  };
  // 反應型：蓄力一擊
  const charge=()=>{
    const T=(hard?1100:1300)/relax,good=hard?[74,94]:[68,97],zone=hard?[83,88]:[81-skill,90+skill];let t0=0,raf=0,done=false,started=false;
    el.innerHTML=header()+`<div class="chargebar"><i class="zone" style="left:${good[0]}%;width:${good[1]-good[0]}%"></i><i class="zone perfect" style="left:${zone[0]}%;width:${zone[1]-zone[0]}%"></i><i class="fillc" id="cg-f"></i></div>
    <p class="story" style="font-size:13px;color:var(--muted);margin:0">停在金色區域：命中；停在中間的橘色：完美的一擊。</p>
    <button class="primary big" id="mg-tap">蓄力</button>`+logHtml();
    const end=g=>{if(done)return;done=true;cancelAnimationFrame(raf);mgKey=null;apply(g);};
    const val=()=>(performance.now()-t0)/T*100;
    const frame=()=>{const v=val();const f=$('#cg-f');if(f)f.style.width=Math.min(100,v)+'%';if(v>106){end({partial:0});return;}raf=requestAnimationFrame(frame);};
    const tap=()=>{if(done)return;if(!started){started=true;t0=performance.now();$('#mg-tap').textContent='出手！';raf=requestAnimationFrame(frame);return;}
      const v=val();end(v>=zone[0]&&v<=zone[1]?'perfect':v>=good[0]&&v<=good[1]?'good':{partial:v<good[0]?v/100*.6:0});};
    $('#mg-tap').onclick=tap;$('#mg-tap').focus();
    mgKey=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tap();}};
  };
  // 解謎型：擺盾牌（擋住每一條攻擊線）
  const shields=()=>{
    const n=hard?5:4;const nr=hard?3:st.round<3?2:3,nc=2;

      cols=[];while(cols.length<nc){const c=ri(0,n-1);if(!cols.includes(c))cols.push(c);}
      rocks=new Set();const cross=[];rows.forEach(r=>cols.forEach(c=>cross.push(r*n+c)));
      const kr=ri(1,Math.min(3,cross.length-1));while(rocks.size<kr)rocks.add(pick(cross));
      while(rocks.size<kr+1){const x=ri(0,n*n-1);rocks.add(x);}

      const comb=(k,start,cur)=>{if(cur.length===k)return covers(cur);for(let j=start;j<free.length;j++){cur.push(free[j]);if(comb(k,j+1,cur))return true;cur.pop();}return false;};

    const drawS=()=>{

  // 解謎型：符文鎖（猜順序）
  const lock=()=>{

    let cur=[],hist=[],done=false;

    const drawL=()=>{
      el.innerHTML=header()+`<div class="lockhist">${hist.map(([g,[b,w]])=>`<div><span>${g.join(' ')}</span><b>${'●'.repeat(b)}${'○'.repeat(w)}${!b&&!w?'—':''}</b></div>`).join('')||'<div><small>還沒有猜過</small></div>'}</div>

      <span><button class="ghost" id="lk-back">退一格</button> <button class="primary" id="lk-go" ${cur.length<4?'disabled':''}>猜</button></span></div>

  // 解謎型：符文配對
  const pairs=()=>{
    const np=hard?8:st.round<2?5:6;const R=['ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ','ᚷ','ᚹ'];const use=R.sort(()=>Math.random()-.5).slice(0,np);
    const cards=[...use,...use].sort(()=>Math.random()-.5);const got=new Set();let open=[],tries=0,done=false,lockUI=false;const limit=np*2+skill,perfect=np+2;
    const drawC=()=>{
      el.innerHTML=header()+`<div class="cards">${cards.map((r,i)=>`<button data-cd="${i}" class="${got.has(i)?'got':open.includes(i)?'open':''}" aria-label="第 ${i+1} 張牌${got.has(i)||open.includes(i)?'：'+r:''}">${got.has(i)||open.includes(i)?r:'ᛜ'}</button>`).join('')}</div>

      const open={hold:'你們在木牆後排成盾牆，一步也不退。',charge:lead?'你第一個衝出去，戰士們吼叫著跟上。':'戰士們吼叫著衝向敵陣。',night:nightOk?'夜色掩護了你們，敵人在睡夢中驚醒。':'一隻狗吠了起來，夜襲被發現，你們一頭撞進了陷阱。',flank:'你把人分成兩路，從側面包了過去。'}[t];
      // 敵軍總共 8 隊，你只有 6 隊預備隊（打頭陣的勇士算 2 隊）
      const foe=pick([[4,2,2],[5,2,1],[3,3,2],[4,3,1],[6,1,1],[4,4,0],[5,3,0]]).slice().sort(()=>Math.random()-.5);
      const pSee=eff('wit')>=15?1:clamp(.25+eff('wit')*.03+(scouted(o.defend)?.2:0),.25,.85);
      const seen=foe.map(()=>Math.random()<pSee);
      const fuzzy=v=>{const g=clamp(v+pick([-1,0,0,1]),0,6);return g<=1?'人不多':g<=3?'人不少':'黑壓壓一片';};
      const hint=foe.map((v,i)=>seen[i]?`敵軍 ${v} 隊`:`${fuzzy(v)}（看不清楚）`);
      const mine=[0,0,0],R=6;let champLane=-1;const hero=van&&hasC(van)?van:null;

      const draw2=()=>{

        el.innerHTML=`<p class="eyebrow">${o.defend?'守衛部落':'部隊戰'}</p><h2>${o.title}</h2>${lineHTML(ratio,1)}
        <p class="story">${open}\n\n戰線拉開了。你手上還有 <b>${R}</b> 隊預備隊，要放到哪裡？每條戰線上，你的隊數不比敵軍少，就守得住。</p>
        <div class="lanes">${LANES.map((n,i)=>`<div class="lane"><b>${n}</b><span class="${seen[i]?'':'dim'}">${hint[i]}</span>
          <div class="lctl"><button data-lm="${i}" ${mine[i]?'':'disabled'}>−</button><i>${mine[i]}${champLane===i?' +2':''}</i><button data-lp="${i}" ${left?'':'disabled'}>＋</button></div></div>`).join('')}</div>
        ${hero?`<div class="bchamp"><span style="font-size:13px;color:var(--muted);align-self:center">${CHAMPS[hero].name}（算 2 隊）守：</span>${LANES.map((n,i)=>`<button data-lc="${i}" aria-pressed="${champLane===i}">${n}</button>`).join('')}</div>`:''}
        <p class="hint" style="margin-top:6px">還沒放的預備隊：${left} 隊<small>看清敵軍每條戰線的機率 ${pct(pSee)}（看智謀和斥候）</small></p>
        <button class="primary" id="r2-go">就這樣打</button>`;
        el.querySelectorAll('[data-lp]').forEach(b=>b.onclick=()=>{mine[+b.dataset.lp]++;draw2();});
        el.querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>{mine[+b.dataset.lm]--;draw2();});
        el.querySelectorAll('[data-lc]').forEach(b=>b.onclick=()=>{champLane=champLane===+b.dataset.lc?-1:+b.dataset.lc;draw2();});
        $('#r2-go').onclick=()=>{
          const held=foe.map((v,i)=>mine[i]+(champLane===i?2:0)>=v),n=held.filter(Boolean).length;
          ratio*=[.85,.93,1.04,1.12][n];
          const txt=LANES.map((nm,i)=>`${nm}：你 ${mine[i]+(champLane===i?2:0)} 隊，敵軍 ${foe[i]} 隊，<span class="${held[i]?'good':'bad'}">${held[i]?'守住了':'被衝開了'}</span>`).join('\n');
          round3(t,nightOk,ratio,txt,n);};
      };
      draw2();
    };
    const round3=(t,nightOk,ratio,txt,n)=>{
      sfx(n>=2?'hit':'bad');
      el.innerHTML=`<p class="eyebrow">${o.defend?'守衛部落':'部隊戰'}</p><h2>${o.title}</h2>${lineHTML(ratio,2)}
      <p class="story">${txt}\n\n${['三條戰線全垮了。','只剩一條戰線還撐著。','三條戰線守住了兩條。','三條戰線全都守住了！'][n]}兩邊都殺紅了眼。現在，該決定怎麼收尾了。</p>
      <div class="choices">
        <button class="choice" data-r3="steady"><b>穩紮穩打</b><small>守住現在的局面：佔上風時更穩，落後時很難翻盤</small></button>
        <button class="choice" data-r3="allin"><b>全軍壓上</b><small>賭一把：落後時還有機會逆轉；贏了敵軍會全線潰散，但傷亡更重</small></button>
        <button class="choice" data-r3="retreat"><b>撤退</b><small>認輸，但傷亡減半，族人也不會太怪你</small></button>
      </div>`;
      el.querySelectorAll('[data-r3]').forEach(b=>b.onclick=()=>resolve(t,0,{nightOk,ratio,end:b.dataset.r3}));
    };
    const resolve=(t,nightP,ext)=>{
      S.flags.rowNight=0;
      let p=armyPower()*(lead?leadMul():1),cas=1,nightOk=null;const lines=[];
      if(o.defend&&has('ironwall')) p*=1.15;
      if(o.defend&&hasC('sigrid')) p*=1.1;
      if(t==='hold'){p*=1.3*[1,1.15,1.3,1.45][bl('tower')];cas=.7;lines.push('你們在木牆後排成盾牆，一步也不退。');}
      if(t==='charge'){p*=1+eff('str')*.03;cas=1.4;lines.push(lead?'你第一個衝出去，戰士們吼叫著跟上。':'戰士們吼叫著衝向敵陣。');}
      if(t==='night'){nightOk=ext?ext.nightOk:Math.random()<nightP;if(nightOk)favor('loki',6);p*=nightOk?1.8:.5;cas=nightOk?.6:1.3;lines.push(nightOk?'夜色掩護了你們，敵人在睡夢中驚醒。':'一隻狗吠了起來，夜襲被發現，你們一頭撞進了陷阱。');}
      if(t==='flank'){p*=1.05+eff('wit')*.02+(has('tactician')?.1:0);cas=.85;lines.push('你把人分成兩路，從側面包了過去。');}
      const ratio=ext?ext.ratio:p/o.def;
      const win=ext?(ext.end==='retreat'?false:Math.random()<clamp(.5+(ratio-1)*(ext.end==='steady'?4:1.5),.03,.97)):Math.random()<clamp(.5+(ratio-1)*2.2,.03,.97);
      if(ext){lines.length=0;if(ext.end==='allin'){cas*=1.3;lines.push(win?'你把所有人都壓了上去。敵軍撐不住，全線潰散了。':'你把所有人都壓了上去，可是沒能衝開敵陣。');}
        else if(ext.end==='steady')lines.push(win?'你們一步一步往前推，把敵人慢慢擠了出去。':'你們守得很穩，可是敵人實在太多，陣線還是被壓垮了。');
        else{cas*=.5;lines.push('你下令撤退。隊伍退得很整齊。');}}
      const m=fieldMix();
      if(m.fm>=15) cas*=.85;
      if(hasC('astrid')) cas*=.7;
      if(lead&&eff('pre')>=15) cas*=.8;
      if(S.spouse==='astrid') cas*=.85;
      if(qd('astrid')&&hasC('astrid')) cas*=.9;
      if(has('shieldlord')&&(t==='hold'||t==='flank')) cas*=mastered('shieldlord')?.6:.75;
      let lost=Math.round(m.fm*(win?clamp(.12-(ratio-1)*.08,.03,.12):clamp(.3-(ratio-1)*.1,.15,.4))*cas);
      if(!win&&has('oldfox')) lost=Math.round(lost/2);
      lost=takeLosses(Math.min(lost,m.fm),has('shieldlord')?.25:.5);
      S.stats.fallen+=lost;
      if(lost) lines.push(`${lost} 名戰士沒能回來。`);
      if(ext&&van&&hasC(van)&&win){bond(van,5);lines.push(`${CHAMPS[van].name}打頭陣立了大功（好感 +5）。`);}
      if(!win&&S.champions.length&&!(ext&&ext.end==='retreat')&&Math.random()<(ext&&van&&hasC(van)?.25:.15)){const pool=ext&&van&&hasC(van)?[champ(van)].filter(c=>!c.oath):S.champions.filter(c=>!c.oath);const c=pool.length?pick(pool):null;if(c){removeChamp(c.id);(S.stats.lostC||(S.stats.lostC=[])).push(CHAMPS[c.id].name);lines.push(`<span class="bad">勇士${CHAMPS[c.id].name}戰死了。</span>`);log(`勇士${CHAMPS[c.id].name}戰死沙場。`);}}
      if(win){
        const mm=fieldMix();
        const dbl=has('elitemaster')?2:1;
        const pr=Math.floor(mm.r*(.15+(hasC('hakon')?.1:0)+bl('barracks')*.05+(has('drill')?.1:0)))*dbl;
        const pe=Math.floor(mm.v*(.05+(bl('barracks')>=2?.05:0)+(ownsR('eagle')?.1:0)))*dbl;
        const prR=Math.min(pr,recruits());if(prR>0){S.vets+=prR;lines.push(`${prR} 名新兵在這一仗後成了老兵。`);}
        const peV=Math.min(pe,S.vets);if(peV>0){S.vets-=peV;S.elite+=peV;lines.push(`${peV} 名老兵立下戰功，晉升為精兵。`);}
        S.stats.battles++;bondAll(3);addLoyalty(2);favor('thor',o.defend?6:2);
        if(ext&&ext.end==='allin'){addFame(3);lines.push('<span class="good">這一仗打得漂亮，名聲 +3</span>');}
      }else if(has('oldfox')){bondAll(-2);S.flags.lastLoss=S.turn;lines.push('你早就安排好退路，撤退得井井有條。族人沒怪你。');}
      else{const ll=Math.round((lead?18:12)*((S.prep||{}).temple||S.flags.noLoyLoss?.5:1)*(ext&&ext.end==='retreat'?.5:1));bondAll(-5);loseLoyalty(ll);S.flags.lastLoss=S.turn;lines.push(`<span class="bad">敗仗讓族人抬不起頭（忠誠 -${ll}）。</span>`);}
      S.lastBattle=S.turn;
      if(lead){
        let dmg=Math.max(1,Math.round(o.def*rnd(.12,.22)*(win?.6:1.1)*(nightOk===false&&!has('oldfox')?1.5:1)-eff('con')*.5));
        S.hp=win?Math.max(1,S.hp-dmg):S.hp-dmg;
        lines.push(`你在亂戰中受了傷（生命 -${dmg}）。`);
        if(S.hp>0) {const sc=maybeScar();if(sc)lines.push(sc.trim());}
      }
      gainXp(win?Math.round(12+o.def/3):6);
      sfx(win?'horn':'bad');
      const after=o.onEnd(win,{nightOk})||'';
      if(win&&t==='flank'&&!o.defend&&Math.random()<.4) pushModal(stragglers());
      el.innerHTML=`<p class="eyebrow">戰報</p><h2>${win?'勝利':'敗退'}</h2>
      <div class="res">${lines.join('\n')}\n${win?'<span class="good">':'<span class="bad">'}${after}</span></div>
      <button class="primary" id="m-ok">繼續</button>`;
      $('#m-ok').onclick=()=>{if(S.hp<=0)triggerFall(o.cause||'倒在亂軍之中');closeModal();};$('#m-ok').focus();
      if(!o.defend) passTime();
      render();
    };
    draw();
  });
}

function addBlessing(){
  const need=(ownsR('abbey')?50:60)-(gt('freyja',2)?15:0);
  if(S.loyalty<need) return `<span style="color:var(--muted)">族人跟著你唸了禱詞，但沒有人走向祭壇刻下符文。</span>`;
  if(charges()>=maxBless()){addLoyalty(5);return `<span class="blessed">祈福已滿（${maxBless()}/${maxBless()}），族人的敬愛化為忠誠 +5。</span>`;}
  S.blessings++;S.stats.blessGained++;
  log(`族人為你刻下祈福符文（${charges()}/${maxBless()}）。`);

  <p class="story">${story}</p><div class="res">${cost.join('\n')}\n<span class="blessed">剩下的祈福：${charges()}/${maxBless()}</span></div>
  <button class="primary" id="m-ok">撐起身子</button>`;

function verdicts(){

    :S.stats.fallen>=30?`「${P}贏了很多仗。」停了一下，「我的兩個兒子都沒回來。」`
    :S.loyalty<35?`「${S.phase>=4?'王':'首領'}？${P}只是比較會搶罷了。」`

  else if(rf.includes('效忠')) V.push(['赫羅爾夫',`「我說${P}一輩子${ORI().q}。」他灌了一口酒，「這句話，我收回了一輩子。」`]);
  else if(S.phase===1) V.push(['赫羅爾夫','「我早就說過了。」赫羅爾夫說完這句話，卻一整晚沒再開口。']);

  else if(won&&S.flags.kingDead) V.push(['農莊的老牧人',`「老王走以前，常常坐在門口，往王廳的方向看。」他說，「他說，${P}比他想的還要好。」`]);

  else if(S.phase>=4&&!won) V.push(['一位雅爾',`「${P}當過王。這一點，誰也拿不走。」`]);
  else if(old) V.push(['一位雅爾',`「${P}終於走了。」他舉起角杯，又放下，「峽灣以後會安靜很多。」`]);
  else V.push(['一位雅爾',`「${P}要是再多活幾年，我們今天就得向${P}下跪了。」`]);

  if(S.flags.abbeyRaid&&!S.stats.atone) V.push(['弗雷神殿的祭司','「北方來的惡魔。神殿裡的金臂環，到現在都沒回來。」']);
  else if(S.stats.atone) V.push(['弗雷神殿的祭司',`「${P}把搶走的東西還回來了。很少有人會這麼做。」`]);

}

function knutReform(){

    ch:[{t:'「那就跟我一起賠。」',fx:()=>{bond('knut',5);addFame(5);return '第二天，克努特扛著一袋銀子，跟你一起去了那個村子。他在瞎眼老人面前跪了很久。\n<span class="good">克努特改過自新：不再增加惡名，之後的贖罪效果更好。好感 +5，名聲 +5</span>';}},
        {t:'「過去的事，就讓它過去。」',fx:()=>{bond('knut',3);return '他看了你很久，點了點頭。從那天起，他再也沒有搶過不該搶的東西。\n<span class="good">克努特改過自新：不再增加惡名，之後的贖罪效果更好。好感 +3</span>';}}]});
}
function knutReact(n){
  const c=champ('knut');
  if(n===1) return eventModal({kind:'勇士',title:'克努特的眼神',text:'克努特在旁邊看完了整件事，瞪大眼睛：「老大……你剛剛是在賠錢給那些人？」',ch:[{t:'「做你的事。」',fx:()=>{bond('knut',-5);return '他聳聳肩，但你看得出他不太高興。\n克努特好感 -5';}}]});
  if(n===2) return eventModal({kind:'勇士',title:'摔碎的酒杯',text:'克努特把酒杯摔在地上：「我跟著你，是因為你比誰都狠。原來你是這種人。」幾個跟他一起來的人也放下了酒杯。',ch:[{t:'沉默以對',fx:()=>{bond('knut',-15);loseLoyalty(3);return '<span class="bad">克努特好感 -15，忠誠 -3</span>';}}]});
  if(c&&c.bond>=30) return eventModal({kind:'背叛',title:'克努特走了',text:'天亮時，克努特的床鋪是空的。他帶走了當初跟他一起來的人，桌上插著一把匕首：「這裡已經不是我待的地方了。」',ch:[{t:'……',fx:()=>{removeChamp('knut');const l=takeLosses(Math.min(3,S.men),1);log(`克努特帶著 ${l} 個人離開了。`);return `<span class="bad">克努特和 ${l} 名戰士離開了。</span>`;}}]});
  return eventModal({kind:'背叛',title:'克努特拔斧',text:'半夜，克努特踢開長屋的門，斧頭已經出鞘：「軟腳蝦帶不了我們。今晚，這部落換人管。」',ch:[{t:'迎戰',note:'生死單挑',fx:()=>{removeChamp('knut');duel('knutD',{lethal:true,xp:20,cause:'死在疤面克努特的斧下',onEnd:w=>{if(!w)return '';addLoyalty(10);addInfamy(-5);log('擊敗了叛變的克努特。');return '克努特倒在血泊裡。族人看你的眼神多了幾分敬畏。\n忠誠 +10';}});return null;}}]});
}

        {t:'賠償他家 25 銀幣',ok:()=>S.silver>=25,fx:()=>{S.silver-=25;atone(15);return '少年接過錢袋，把劍收了回去。\n惡名 -15';}},
        {t:'收他當戰士',fx:()=>{S.men++;atone(8);return '「跟著我，總有一天你會比我強。」少年愣了很久，點了頭。\n戰士 +1，惡名 -8';}},
        {t:'把他趕走',fx:()=>'少年被拖了出去。'}]},
  {id:'astrid',once:1,phase:[2,3],cond:()=>S.fame>=35,title:'盾女',text:'一個背著圓盾的女戰士走進營地，把斧頭插在你面前的桌上：「我叫阿斯特麗德。我只追隨比我強的人。」',
    ch:[{t:'接受比武',note:'點到為止',fx:()=>{duel('astrid',{lethal:false,xp:16,onEnd:w=>{if(w)return '她拔起斧頭，單膝跪下。\n'+addChamp('astrid',60);S.flags.ev_astrid=0;return '她搖搖頭：「等你更強再說。」她也許還會回來。';}});return null;}},
        {t:'用你的計畫說服她',note:()=>rate(.1+eff('pre')*.07),fx:()=>{if(chk(.1+eff('pre')*.07))return '你沒有拔武器，只是把你的計畫說給她聽。她沉默很久，然後點頭。\n'+addChamp('astrid',55);S.flags.ev_astrid=0;return '她聽完只說了一句：「空話。」';}},
        {t:'我不需要你',fx:()=>'她冷哼一聲，轉身走了。'}]},
  {id:'una',once:1,phase:[2,3],title:'霧沼的草藥婆',text:'一個背著藥簍的老婦人來到部落門口。她說她叫烏娜，霧沼的村子容不下她了。「給我一間屋子，我能治好你身上的傷。」',
    ch:[{t:'給她一間屋子（20 銀幣）',ok:()=>S.silver>=20,fx:()=>{S.silver-=20;return '烏娜在長屋後面種起了草藥。\n'+addChamp('una',65);}},{t:'部落不收外人',fx:()=>'烏娜拄著拐杖走回霧裡。'}]},
  {id:'gudrun',once:1,phase:[2,3],cond:()=>bl('smithy')>0,title:'流浪的鐵匠',text:'一個手臂粗得像橡木的女鐵匠看了看你的鐵匠鋪：「爐子砌歪了。付我 25 銀幣，我留下來幫你重打。」',
    ch:[{t:'付錢留下她',ok:()=>S.silver>=25,fx:()=>{S.silver-=25;return '古德倫把爐子拆了重砌，打出來的斧頭亮得能照人。\n'+addChamp('gudrun',60);}},{t:'不用了',fx:()=>'古德倫扛起鐵鎚走了。'}]},
  {id:'ragnar',once:1,phase:[2,3],cond:()=>eff('pre')>=9,title:'狂戰士',text:'一個赤裸上身、渾身刺青的巨漢走進部落：「我叫拉格納。聽說你是挪威最強的人？證明給我看，我就為你殺人。」',
    ch:[{t:'跟他打',note:'生死單挑',fx:()=>{duel('ragnar',{lethal:true,xp:30,cause:'被狂戰士拉格納劈成兩半',onEnd:w=>w?'拉格納大笑著從地上爬起來：「好！好！我跟你走！」\n'+addChamp('ragnar',50):''});return null;}},{t:'我不需要瘋子',fx:()=>'拉格納吐了口口水，走了。'}]},
  {id:'knut',once:1,phase:[2,3],cond:()=>S.infamy>=40,title:'亡命之徒',text:'一個臉上有道長疤的男人帶著三個手下來投靠：「我叫克努特。聽說你這裡不問來歷。」',
    ch:[{t:'收下他們',fx:()=>{S.men+=3;return '戰士 +3\n'+addChamp('knut',45);}},{t:'我這裡不收賊',fx:()=>{addInfamy(-3);return '克努特冷笑著走了。惡名 -3';}}]},
  {id:'children',once:1,phase:[2,3],title:'木劍',text:'部落裡的孩子們拿著木棍，在你的長屋外嚷著要學劍。',
    ch:[{t:'教他們兩招',fx:()=>{gainXp(10);addLoyalty(4);return '你教了他們怎麼握盾。孩子們的爸媽在旁邊看著，笑了。\n忠誠 +4，經驗 +10';}},{t:'沒空',fx:()=>{loseLoyalty(3);return '孩子們失望地散開了。\n<span class="bad">忠誠 -3</span>';}}]},
  {id:'gyr',once:1,phase:[2,3],title:'不服的聲音',text:()=>`營火邊有人說：「${esc(S.name)}不過是運氣好，配不上首領的位子。」\n說話的是壯漢蓋爾，不少人跟著點頭。`,
    ch:[{t:'當眾單挑他',note:'比武，點到為止',fx:()=>{duel('gyr',{lethal:false,xp:15,onEnd:w=>{if(w){addFame(6);addLoyalty(8);return '蓋爾躺在地上喘氣，再也沒人點頭了。\n名聲 +6，忠誠 +8';}loseLoyalty(12);return '<span class="bad">你被蓋爾摔進了泥裡。忠誠 -12</span>';}});return null;}},
        {t:'查出是誰在背後煽動',show:()=>eff('wit')>=6,note:()=>rate(.1+eff('wit')*.07),fx:()=>{if(chk(.1+eff('wit')*.07)){addLoyalty(10);S.st.wit++;return '你順著酒錢一路查下去，發現是有人塞了錢給蓋爾。你當眾揭穿了這件事，蓋爾羞愧地低下頭。\n<span class="good">忠誠 +10，智謀 +1</span>';}loseLoyalty(6);return '你查了半天，抓錯了人。蓋爾笑得更大聲了。\n<span class="bad">忠誠 -6</span>';}},
        {t:'用言語折服眾人',note:()=>rate(.2+eff('pre')*.06+(has('tongue')?.12:0)),fx:()=>{if(chk(.2+eff('pre')*.06+(has('tongue')?.12:0))){addLoyalty(6);return '你一一數出你帶他們打過的仗、分過的銀子。蓋爾低下了頭。\n忠誠 +6';}loseLoyalty(6);return '<span class="bad">你的話沒人聽進去。忠誠 -6</span>';}},
        {t:'不予理會',fx:()=>{loseLoyalty(8);return '<span class="bad">流言在營地裡傳開了。忠誠 -8</span>';}}]},
  {id:'grumble',phase:[2,3],cd:1,cond:()=>S.loyalty<50&&cdOk('grumble',6),title:'戰士們的怨言',text:'「我們好久沒分到像樣的東西了。」幾個戰士在你背後竊竊私語，看到你就閉上了嘴。',
    ch:[{t:'加發賞錢（15 銀幣）',ok:()=>S.silver>=15,fx:()=>{S.silver-=15;addLoyalty(6);return '忠誠 +6';}},
        {t:'揪出帶頭的人',show:()=>eff('wit')>=6,note:()=>rate(.15+eff('wit')*.07),fx:()=>{if(chk(.15+eff('wit')*.07)){addLoyalty(6);addFame(2);return '你私下找帶頭的人談了一次，他從此閉上了嘴。\n忠誠 +6';}loseLoyalty(4);return '你找錯了人，反而讓大家更不滿。\n<span class="bad">忠誠 -4</span>';}},
        {t:'用威望壓下去',note:()=>rate(.15+eff('pre')*.06),fx:()=>{if(chk(.15+eff('pre')*.06)){addLoyalty(4);return '你一瞪眼，沒人再說話。\n忠誠 +4';}loseLoyalty(6);return '<span class="bad">他們表面上安靜了，私下更不滿。忠誠 -6</span>';}},
        {t:'不理會',fx:()=>{loseLoyalty(5);return '<span class="bad">忠誠 -5</span>';}}]},
  {id:'traitor',phase:[2,3],cd:1,cond:()=>S.loyalty<35&&S.silver>20&&cdOk('traitor',8),title:'被撬開的銀箱',text:'清晨，你發現銀箱被撬開了。有人趁夜偷走了不少銀幣。',
    ch:[{t:'追查到底',note:()=>rate(.25+eff('wit')*.07),fx:()=>{const l=Math.floor(S.silver*.3);if(chk(.25+eff('wit')*.07)){S.silver-=Math.floor(l/2);return `你順著腳印找到了小偷，追回一半。\n<span class="bad">銀幣 -${Math.floor(l/2)}</span>`;}S.silver-=l;return `<span class="bad">線索斷了。銀幣 -${l}</span>`;}},
        {t:'算了',fx:()=>{const l=Math.floor(S.silver*.3);S.silver-=l;return `<span class="bad">銀幣 -${l}</span>`;}}]},
  {id:'oracle',once:1,phase:[2,3],cond:()=>bl('altar')>0,title:'祭司的夢',text:'祭司說，奧丁在夢裡給了她一個答案，只要你獻上 10 銀幣。',
    ch:[{t:'獻上 10 銀幣',ok:()=>S.silver>=10,fx:()=>{S.silver-=10;favor('odin',8);const k=pick(['str','con','wit','pre']);S.st[k]++;return `祭司在你額頭上畫下符文。\n<span class="good">${STAT[k]} +1</span>`;}},{t:'不信這個',fx:()=>'祭司默默收起骨頭。'}]},
  {id:'plague',once:1,phase:[3],cond:()=>S.men>=6,title:'熱病',text:'營地爆發了熱病，戰士一個接一個倒下。',
    ch:[{t:'花 30 銀幣請醫者',show:()=>!hasC('una'),ok:()=>S.silver>=30,fx:()=>{S.silver-=30;addLoyalty(4);return '醫者熬了三天草藥，大部分人都撐過來了。\n忠誠 +4';}},
        {t:'交給烏娜',show:()=>hasC('una'),fx:()=>{bond('una',10);addLoyalty(4);return '烏娜三天沒闔眼，沒有一個人死去。\n忠誠 +4';}},
        {t:'讓他們自己撐過去',fx:()=>{const l=takeLosses(Math.ceil(S.men*.25),1);S.stats.fallen+=l;loseLoyalty(8);return `<span class="bad">${l} 名戰士病死，忠誠 -8</span>`;}}]},
  {id:'thorfinn_up',once:1,phase:[3],cond:()=>S.flags.forgave,title:'被饒恕的人',text:'當年燒了糧倉的托爾芬，如今已是部落裡最能打的年輕人。他跪在你面前，把劍橫放在膝上。',
    ch:[{t:'讓他站起來',fx:()=>'「我的命是你給的。」\n'+addChamp('thorfinn',90)}]},
  // 勇士個人事件
  {id:'p_hakon',once:1,phase:[2,3],cond:()=>hasC('hakon'),kind:'勇士',title:'哈康的舊帳',text:'一夥人找上門，說哈康年輕時殺了他們的父親。「交出獨眼的，我們就走。」哈康站在你身後，一句話也沒說。',
    ch:[{t:'站在哈康這邊',note:'生死單挑',fx:()=>{duel('hunter',{lethal:true,xp:16,intro:'對方派出了最能打的人。',cause:'為了哈康死在仇家刀下',onEnd:w=>{if(!w)return '';bond('hakon',25);S.st.str++;return '仇家扛著屍體走了。哈康把他用了三十年的斧頭塞給你：「這把比你的好。」\n<span class="good">力量 +1</span>，哈康好感 +25';}});return null;}},
        {t:'交出哈康，換 20 銀幣',fx:()=>{S.silver+=20;removeChamp('hakon');S.cruel++;loseLoyalty(10);bondAll(-10);return '<span class="bad">哈康被綁走了。族人看你的眼神變了。忠誠 -10，所有勇士好感 -10</span>';}}]},
  {id:'p_astrid',phase:[2,3],cd:1,cond:()=>hasC('astrid')&&cdOk('p_astrid',12),kind:'勇士',title:'阿斯特麗德的挑戰',text:'「一年了，」阿斯特麗德扔給你一面盾，「讓我看看你有沒有變弱。」',
    ch:[{t:'接受',note:'比武，點到為止',fx:()=>{duel('astrid',{lethal:false,xp:14,onEnd:w=>{if(w){bond('astrid',15);if(!S.flags.astridWon){S.flags.astridWon=1;S.st.con++;return '「還行。」她嘴上這樣說，但笑了，然後教了你一套盾術。\n<span class="good">體魄 +1</span>，阿斯特麗德好感 +15';}return '「還行。」她嘴上這樣說，但笑了。\n阿斯特麗德好感 +15';}bond('astrid',-5);return '「你變軟了。」\n阿斯特麗德好感 -5';}});return null;}},
        {t:'今天不行',fx:()=>{bond('astrid',-10);return '她失望地收起盾牌。\n阿斯特麗德好感 -10';}}]},
  {id:'p_una',once:1,phase:[2,3],cond:()=>hasC('una'),kind:'勇士',title:'烏娜的草藥',text:'烏娜說有一種只長在冬天雪地裡的藥草，能治好陳年的舊傷。她需要 10 糧食和幾個人手去採。',
    ch:[{t:'給她（10 糧食）',ok:()=>S.food>=10,fx:()=>{S.food-=10;bond('una',15);const h=S.scars;S.scars=0;return `烏娜熬出一鍋苦得要命的藥。${h?`\n<span class="good">舊傷全部痊癒了</span>`:''}\n烏娜好感 +15`;}},
        {t:'糧食不能浪費在這上面',fx:()=>{bond('una',-10);return '烏娜好感 -10';}}]},
  {id:'p_bragi',once:1,phase:[2,3],cond:()=>hasC('bragi'),kind:'勇士',title:'布拉吉的詩',text:'布拉吉卡在一首詩的最後一句，非要你跟他一起想。',
    ch:[{t:'陪他想',note:()=>rate(.25+eff('wit')*.07),fx:()=>{bond('bragi',10);if(chk(.25+eff('wit')*.07)){addFame(10);return '你們想出的那一句，後來被唱遍了整個挪威。\n<span class="good">名聲 +10</span>，布拉吉好感 +10';}addFame(2);return '想到天亮，還是差一句。但布拉吉很開心。\n名聲 +2，布拉吉好感 +10';}},
        {t:'我沒空寫詩',fx:()=>{bond('bragi',-8);return '布拉吉好感 -8';}}]},
  {id:'p_ragnar',once:1,phase:[2,3],cond:()=>hasC('ragnar'),kind:'勇士',title:'失控',text:'拉格納喝醉後打死了一個農夫。死者的家人跪在長屋外，要你給個交代。',
    ch:[{t:'當眾鞭打拉格納',fx:()=>{bond('ragnar',-25);addLoyalty(6);S.mercy++;return '拉格納一聲不吭地挨完了鞭子。他看你的眼神很冷。\n忠誠 +6，拉格納好感 -25';}},
        {t:'賠錢了事，壓下這件事',fx:()=>{bond('ragnar',10);addInfamy(8);loseLoyalty(6);S.cruel++;favor('loki',6);return '<span class="bad">死者家人拿了錢，但族人都在議論。忠誠 -6，惡名 +8</span>\n拉格納好感 +10';}}]},
  {id:'p_knut',once:1,phase:[2,3],cond:()=>hasC('knut'),kind:'勇士',title:'克努特的主意',text:'克努特想帶他的人去搶一座小教堂。「不用你出兵，搶來的分你一半。」',
    ch:[{t:'去吧',fx:()=>{S.silver+=30;addInfamy(10);bond('knut',10);return '克努特扛回了一箱銀器。\n銀幣 +30，<span class="bad">惡名 +10</span>，克努特好感 +10';}},
        {t:'不准',fx:()=>{bond('knut',-15);return '克努特好感 -15';}}]},
  {id:'p_einar',once:1,phase:[2,3],cond:()=>hasC('einar'),kind:'勇士',title:'白鹿的蹤跡',text:'埃納興奮地跑來：「我在北邊的林子看到了白鹿的蹤跡！但那一帶有熊。」',
    ch:[{t:'一起去',note:'生死單挑',fx:()=>{duel('bear',{lethal:true,xp:16,hunt:true,cause:'被灰熊撕碎在北邊的林子裡',onEnd:w=>{if(!w)return '';S.food+=10;addFame(6);bond('einar',15);return '你們扛著熊皮回來，還看見了白鹿。族人說這是好兆頭。\n糧食 +10，名聲 +6，埃納好感 +15';}});return null;}},
        {t:'太危險了',fx:()=>{bond('einar',-5);return '埃納好感 -5';}}]},
  {id:'p_osric',once:1,phase:[3],cond:()=>hasC('osric'),kind:'勇士',title:'古托姆的家人',text:'古托姆說他的妻兒還在維斯特福爾附近。他想帶 10 銀幣回去接他們。',
    ch:[{t:'給他 10 銀幣',ok:()=>S.silver>=10,fx:()=>{S.silver-=10;bond('osric',20);return '一個月後，古托姆帶著家人回來了。\n古托姆好感 +20';}},{t:'不行',fx:()=>{bond('osric',-15);return '古托姆好感 -15';}}]},
  // 祈福事件
  {id:'forgive',once:1,phase:[2,3],kind:'抉擇',title:'燒了糧倉的年輕人',text:'年輕戰士托爾芬喝醉了，打翻火把，燒了糧倉一角。他被綁著跪在眾人面前，等你發落。',
    ch:[{t:'饒恕他',note:'族人會看在眼裡',fx:()=>{S.flags.forgave=1;S.mercy++;addLoyalty(4);const lf2=Math.min(S.food,8);S.food-=lf2;return `你割斷他的繩子：「把燒掉的補回來。」托爾芬哭著磕頭。\n糧食 -${lf2}，忠誠 +4\n${addBlessing()}`;}},
        {t:'鞭刑示眾',fx:()=>{addFame(3);return '二十鞭。沒人再敢在糧倉附近喝酒。\n名聲 +3';}},
        {t:'處死',fx:()=>{S.cruel++;loseLoyalty(10);addFame(5);addInfamy(5);return '<span class="bad">斧頭落下。族人看你的眼神變了。忠誠 -10</span>，名聲 +5';}}]},
  {id:'yule',once:1,phase:[2,3],kind:'抉擇',cond:()=>bl('altar')>0&&S.turn%4===3,title:'冬至祭典',text:'最長的一夜到了。族人聚在祭壇前，等著首領主持祭典。',
    ch:[{t:'親自主持（12 糧食、15 銀幣）',ok:()=>S.food>=12&&S.silver>=15,fx:()=>{S.food-=12;S.silver-=15;addLoyalty(8);favor('freyja',10);favor('odin',5);return `你把公牛的血灑在祭壇上，向奧丁唸出每一個戰死者的名字。\n忠誠 +8\n${addBlessing()}`;}},
        {t:'交給祭司辦',fx:()=>{addLoyalty(2);return '祭典照常舉行，只是你不在。\n忠誠 +2';}},
        {t:'取消祭典，省點糧食',fx:()=>{loseLoyalty(10);S.food+=3;return '<span class="bad">忠誠 -10</span>';}}]},
  {id:'famine',once:1,phase:[2,3],kind:'抉擇',cond:()=>S.turn%4===3,title:'難熬的冬天',text:'冬天來得太早，族人的存糧撐不到春天。孩子們開始在夜裡哭。',

/* ================= 符文記憶 ================= */
function runeMemory(o){
  codex('h_runes');
  pushModal(el=>{
    const len=o.len||4;const seq=Array.from({length:len},()=>ri(0,3));
    const speed=((gt('odin',2)?850:650)+bl('runehut')*100)*(S.relaxed?1.3:1);
    let pos=0,phase='show',done=false;
    const draw=(hl,msg)=>{
      el.innerHTML=`<p class="eyebrow">符文記憶</p><h2>${o.title}</h2>${o.intro?`<p class="story">${o.intro}</p>`:''}<p class="hint">${msg}</p>
      <div class="seqdots">${seq.map((_,i)=>`<i class="${i<pos?'on':''}"></i>`).join('')}</div>
      <div class="runepad mem">${RUNE_KEYS.map((k,i)=>`<button data-k="${i}" class="${hl===i?'lit':''}" ${phase!=='input'?'disabled':''} aria-label="符文 ${k[0]}（${k[2]}）"><b>${k[0]}</b><small>${k[2]}</small></button>`).join('')}</div>`;
      if(phase==='input') el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(+b.dataset.k));
    };
    const finish=ok=>{
      done=true;mgKey=null;phase='end';
      if(ok&&len>=5) unlock('rune_sage');
      const r=o.onEnd(ok,pos/len)||'';
      el.innerHTML=`<p class="eyebrow">符文記憶</p><h2>${o.title}</h2><div class="res">${ok?'<span class="good">你一字不差地複述了符文。</span>':`<span class="bad">記錯了（記對 ${pos}/${len}）。</span>`}${r?'\n'+r:''}</div><button class="primary" id="m-ok">繼續</button>`;
      $('#m-ok').onclick=closeModal;$('#m-ok').focus();render();
    };
    const press=k=>{if(done||phase!=='input')return;if(k===seq[pos]){pos++;if(pos>=len){finish(true);return;}draw(k,'對，繼續。');setTimeout(()=>{if(!done&&phase==='input')draw(-1,'對，繼續。');},180);}else finish(false);};
    draw(-1,'記住符文亮起的順序……');
    let i=0;
    const step=()=>{if(done)return;if(i>=len){phase='input';draw(-1,'換你了：照剛才的順序點符文（也可以用方向鍵）。');mgKey=e=>{const j=RUNE_KEYS.findIndex(k=>k[1]===e.key);if(j>=0){e.preventDefault();press(j);}};return;}
      draw(seq[i],'記住符文亮起的順序……');setTimeout(()=>{draw(-1,'記住符文亮起的順序……');i++;setTimeout(step,speed*.35);},speed*.65);};
    setTimeout(step,500);
  });
}

/* ================= 國王棋（7×7 布蘭杜布） ================= */
function tafl(o){
  markGame('tafl');
  codex('h_tafl');
  pushModal(el=>{
    const N=7,TH=24,CORNERS=[0,6,42,48];
    const B=Array(49).fill(0);
    B[TH]='k';[17,31,23,25].forEach(i=>B[i]='d');[3,10,38,45,21,22,26,27].forEach(i=>B[i]='a');
    const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
    const nb=(i,[dx,dy])=>{const x=i%N+dx,y=Math.floor(i/N)+dy;return x<0||y<0||x>=N||y>=N?null:y*N+x;};
    const side=p=>p==='a'?'a':p?'d':null;
    const movesOf=(b,i)=>{const p=b[i],out=[];for(const d of DIRS){let j=i;for(;;){j=nb(j,d);if(j===null||b[j])break;if(CORNERS.includes(j)||j===TH){if(p==='k')out.push(j);if(j===TH&&p!=='k')continue;break;}out.push(j);}}return out;};
    const capture=(b,j)=>{const s=side(b[j]);let n=0;for(const d of DIRS){const a=nb(j,d);if(a===null||!b[a]||b[a]==='k'||side(b[a])===s)continue;const f=nb(a,d);if(f===null)continue;
      if(side(b[f])===s||(b[f]===0&&(CORNERS.includes(f)||f===TH))){b[a]=0;n++;}}return n;};
    const kingCaught=b=>{const k=b.indexOf('k');if(k<0)return true;const adj=DIRS.map(d=>nb(k,d));
      if(k===TH||adj.includes(TH))return adj.every(n=>n!==null&&(b[n]==='a'||n===TH));
      const h=n=>n!==null&&(b[n]==='a'||CORNERS.includes(n));return (h(adj[0])&&h(adj[1]))||(h(adj[2])&&h(adj[3]));};
    const escapes=b=>{const k=b.indexOf('k');return k<0?0:movesOf(b,k).filter(j=>CORNERS.includes(j)).length;};
    let sel=-1,turns=0,over=null,msg='你執白：把國王（ᛟ）送到任何一個角落就贏。被黑棋前後或左右夾住的棋子會被吃掉。';
    const maxT=30;
    const aiMove=()=>{
      let best=null;
      for(let i=0;i<49;i++){if(B[i]!=='a')continue;for(const j of movesOf(B,i)){const b=B.slice();b[j]='a';b[i]=0;const c=capture(b,j);
        let s=c*30+(kingCaught(b)?1000:0)-escapes(b)*200+Math.random()*4;const k=b.indexOf('k');if(k>=0&&DIRS.some(d=>nb(k,d)===j))s+=5;
        if(!best||s>best.s)best={s,i,j};}}
      if(!best){over='win';return;}
      B[best.j]='a';B[best.i]=0;const c=capture(B,best.j);
      msg=c?`黑棋吃掉了你 ${c} 顆棋子。`:'黑棋移動了。';
      if(kingCaught(B)){over='lose';msg='國王被包圍了。';}
    };
    const draw=()=>{
      const mv=sel>=0?movesOf(B,sel):[];
      el.innerHTML=`<p class="eyebrow">國王棋</p><h2>${o.title}</h2>${o.intro&&!turns?`<p class="story">${o.intro}</p>`:''}
      <p class="hint">${msg}<small>第 ${turns}/${maxT} 手${o.wager?` · 賭注 ${o.wager} 銀幣`:''}</small></p>
      <div class="tafl" role="grid" aria-label="國王棋棋盤">${B.map((p,i)=>`<button class="tc ${CORNERS.includes(i)||i===TH?'spec':''} ${mv.includes(i)?'can':''} ${sel===i?'sel':''}" data-i="${i}" aria-label="${p==='k'?'國王':p==='d'?'白棋':p==='a'?'黑棋':'空格'}">${p==='k'?'<span class="pk">ᛟ</span>':p==='d'?'<span class="pd"></span>':p==='a'?'<span class="pa"></span>':''}</button>`).join('')}</div>
      ${over?'':'<button class="ghost" id="tf-x">認輸</button>'}`;
      if(over){end();return;}
      $('#tf-x').onclick=()=>{over='lose';msg='你推倒了國王。';draw();};
      el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
        if(mv.includes(i)){B[i]=B[sel];B[sel]=0;const c=capture(B,i);turns++;msg=c?`你吃掉了 ${c} 顆黑棋。`:'';sel=-1;
          if(CORNERS.includes(i)&&B[i]==='k'){over='win';msg='國王逃到了角落！';draw();return;}
          aiMove();if(!over&&turns>=maxT){over='draw';msg='棋局拖得太久，雙方握手言和。';}draw();return;}
        if(B[i]==='d'||B[i]==='k'){sel=sel===i?-1:i;draw();}});
    };
    const end=()=>{
      if(over==='win'){favor('odin',8);unlock('tafl_win');}
      const r=o.onEnd(over)||'';
      el.insertAdjacentHTML('beforeend',`<div class="res">${over==='win'?'<span class="good">你贏了這盤棋。</span>':over==='draw'?'和局。':'<span class="bad">你輸了這盤棋。</span>'}${r?'\n'+r:''}</div><button class="primary" id="m-ok">繼續</button>`);
      $('#m-ok').onclick=closeModal;render();
    };
    draw();
  });
}

function trainModal(){

      <button class="ghost" id="tr-x">算了</button>
    </div>`;
    $('#tr-x').onclick=closeModal;
    el.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{

    });
  });
}

function declare(){

  log('向挪威各地宣告了自己的名字。');
  note('群雄並起',`派出使者的前一晚，你站在木牆上往下看。${esc(S.tribe)}的炊煙一縷一縷升起來，你的戰士和他們的家人都睡在你的屋簷下。\n\n十九歲那年說的那句狠話，當時只是為了爭一口氣。現在，它背著這些人的命。${S.flags.mate?'\n\n托爾斯坦走上來，站在你旁邊：「一旦說出口，就不能回頭了。」\n\n「我知道。」':''}\n\n第二天，你派出使者，帶著${esc(S.tribe)}的旗幟走遍挪威的峽灣。\n\n拉德的雅爾西格德把使者趕了出去。鷹巢峰的布倫希爾德笑了，說想看看你有多能打。維斯特福爾的老王哈夫丹什麼也沒說。\n\n還有一個人聽見你的名字就砸了酒杯：<em>赫羅爾夫</em>。他在海岸建了紅帆營，發誓要燒掉你的部落。\n\n<span class="good">目標：征服或結盟四大勢力，成為挪威之王。</span>\n佔領的土地每塊要留人駐守，出戰的人會變少。\n好感 60 以上的勇士，可以在領主要求單挑時替你上場。`,'第三章','sc_ch3');
  passTime();
}
function recruitModal(){
  pushModal(el=>{
    const cost=recruitCost(),max=Math.max(0,Math.min(2+eff('pre'),housing()-S.men,Math.floor(S.silver/cost)));
    let n=Math.max(1,max);
    const draw=()=>{
      const over=S.men+n-command();
      el.innerHTML=`<p class="eyebrow">招募</p><h2>招募戰士</h2><p class="story">消息傳到附近的村子，有些年輕人帶著斧頭來了。</p>
      <div class="meta"><span>住房 <b>${S.men}/${housing()}</b></span><span>統御 <b>${command()}</b></span><span>每季軍餉 <b>${wages()}</b> 銀幣</span></div>
      <div class="row"><button class="ghost" id="r-m" aria-label="減少">−</button><b style="font-size:28px;min-width:2ch;text-align:center">${n}</b><button class="ghost" id="r-p" aria-label="增加">+</button>
      <span style="color:var(--muted)">共 ${n*cost} 銀幣（這次最多 ${max} 人）</span></div>
      ${over>0?`<p class="story bad" style="font-size:14px">超過你的統御上限 ${over} 人。人太多管不動，每季忠誠會下降。</p>`:''}
      <div class="row"><button class="primary" id="m-ok" ${max<1?'disabled':''}>招募 ${n} 人</button><button class="ghost" id="m-x">取消</button></div>`;
      $('#r-m').onclick=()=>{n=Math.max(1,n-1);draw();};$('#r-p').onclick=()=>{n=Math.min(max,n+1);draw();};
      $('#m-x').onclick=closeModal;
      if(max>=1) $('#m-ok').onclick=()=>{S.silver-=n*cost;S.men+=n;log(`招募了 ${n} 名戰士。`);toast(`戰士 +${n}`);closeModal();passTime();};
    };
    draw();
  });
}
const bldMax=()=>S.tlv>=4?3:S.tlv>=3?2:1;
const bldCost=(b,l)=>[Math.round(b.cost[0]*[1,2,3.5][l]*costMul()),Math.round(b.cost[1]*[1,2,3.5][l])];
const tribeUp=()=>{const u=TRIBE_UP[S.tlv-1];if(!u||(u.golden&&!has('golden')))return null;return {cost:[Math.round(u.cost[0]*costMul()),u.cost[1]],need:u.need};};
function build(id){
  const b=B(id),l=bl(id),[s,f]=bldCost(b,l);
  S.silver-=s;S.food-=f;S.bld[id]=l+1;
  if(id==='longhouse') addLoyalty(5);
  const STB={yard:[2,'str'],sauna:[2,'con'],runehut:[2,'wit'],ancestor:[3,'pre']}[id];
  if(STB&&l+1===STB[0]){S.st[STB[1]]++;if(STB[1]==='con')S.hp+=6;toast(`${STAT[STB[1]]} +1`);}
  log(`${l?`把${b.name}升到 ${l+1} 級`:`蓋好了${b.name}`}。`);toast(`${b.name}${l?`升到 ${l+1} 級`:'完工'}`);
  if(!has('builder')) passTime();
  render();
}
function upgradeTribe(){
  const u=tribeUp();
  S.silver-=u.cost[0];S.food-=u.cost[1];S.tlv++;addLoyalty(5);addFame(5);
  if(has('golden')) S.pts++;
  log(`${S.tribe}擴建成了${TRIBE_LV[S.tlv-1]}。`);
  if(S.tlv>=6) unlock('legend_city');
  if(S.tlv===5||S.tlv===6){for(const k in S.st)S.st[k]++;S.hp+=6;pushLater(eventModal(S.tlv===5?EV_CAPITAL:EV_LEGEND));}
  note(`${TRIBE_LV[S.tlv-1]}`,`${esc(S.tribe)}擴建成了<span class="good">${TRIBE_LV[S.tlv-1]}</span>。\n\n住房上限提高了，${S.tlv===2?'能蓋議事廳和瞭望塔了。':S.tlv===3?'能蓋市集，建築能升到 2 級了。':S.tlv===4?'建築能升到 3 級了。':S.tlv===5?'這裡已經是配得上一位國王的都城。':'吟遊詩人說，這座城會比你活得更久。'}\n忠誠 +5，名聲 +5${has('golden')?'\n<span class="good">黃金時代：能力點 +1</span>':''}`,'部落');
  if(!has('builder')) passTime();
}

/* ================= 地區行動 ================= */
function rdef(r){const g=S.reg[r.id];const t=infTier();return Math.round(g.def*(r.kind==='seat'?lf():wf())*D().foe*(t>=3?1.25:t>=2?1.15:1));}
const lootMul=()=>(S&&S.phase>=2?seasonLootMul():1)*(frameIs('paint')?1.1:1)*(gt('loki',2)?1.1:1)*(qd('sven')&&hasC('sven')?1.15:1)*(qd('knut')&&hasC('knut')?1.1:1)*[1,1.25,1.4,1.6][bl('dock')]*(has('seawolf')?1.4:1)*(has('breaker')?1.1:1)*(hasC('knut')?1.2:1)*(ownsR('red')?1.2:1);
const allyChance=()=>clamp((hasC('sigrid')?.05:0)+(qd('sigrid')?.1:0)+[0,0,0,.08,.12][fameTier()]+(S.flags.allyBonus?.15:0)+(qd('osric')?.15:0)+.08+eff('pre')*.035+eff('wit')*.02+[0,.1,.15,.2][bl('hall')]+(has('tongue')?.12:0)+(hasC('osric')?.1:0)+(eff('pre')>=12?.1:0)-(S.infamy>=40?.15:0),.05,.85);
const abdicateChance=()=>Math.min(.6,(fameTier()>=3?.05:0)+(qd('osric')?.1:0)+.05+eff('pre')*.025+allies()*.08+(S.loyalty>=70?.1:0)+(has('tongue')?.1:0));
const scareChance=()=>clamp(.25+eff('pre')*.02+(S.infamy>=80?.15:0)+(gt('loki',2)?.1:0),.05,.8);
const estOf=v=>scouted()?`${Math.round(v)}`:`${Math.round(v*.85)}–${Math.round(v*1.15)}`;
const estTxt=r=>estOf(rdef(r));
function rDesc(r){
  const st=S.reg[r.id].st,f=S.flags,rf=S.rival.fate||'';
  if(st==='rebel') return r.desc;
  if(st==='ally') return {grey:'雅爾西格德是你的盟友。他還是那麼驕傲，但每次見面都會先舉杯。',eagle:'布倫希爾德是你的盟友。山頂的人提到你，會說「那個讓她心服的人」。'}[r.id]||r.desc;
  if(st!=='yours') return r.desc;
  switch(r.id){
    case 'village': return f.vSaved&&!f.vBetray?'村口還掛著你殺的那頭狼的皮。漁民照樣出海，只是現在會把一部分漁獲送到你的長屋。'
      :f.vRaid&&!f.vAmend?'漁民、鹹魚，和一面你的旗幟。村民看見你的人，還是會把孩子拉回屋裡。':'漁民、鹹魚，和一面你的旗幟。';
    case 'abbey': return '神殿還在，祭司們照樣唱歌。只是祭品裡，現在有一份要送到你的手上。';
    case 'forest': return '強盜的老巢被清空了。現在走這條林道的，是商人。';
    case 'market': return '集市照樣熱鬧，只是每一筆買賣，都要繳你一份稅。';
    case 'marsh': return '霧還是終年不散。村民現在把草藥送到你的長屋。';
    case 'grey': return '西格德的橡木長廳，現在掛著你的旗幟。';
    case 'eagle': return '鷹巢峰插上了你的旗。山頂的風還是那麼大。';
    case 'red': return rf.includes('效忠')?'紅帆船隊改掛了你的旗。赫羅爾夫跪下效忠以後，還是不太愛跟你說話。'
      :rf.includes('斧下')?'赫羅爾夫死在你的斧下。紅帆船隊現在聽你的號令。'
      :rf.includes('亂軍')?'赫羅爾夫死在亂軍之中。紅帆船隊改掛了你的旗。':'紅帆船隊現在聽你的號令。';
    case 'winter': return f.kingFate==='dead'?'王廳是你的了。老王的劍，靠在王座旁邊。'
      :f.kingFate==='spared'?'王廳是你的了。老王哈夫丹回到了他的農莊。'
      :f.abdicated?'王廳是你的了。王冠是老王親手交給你的。':'王廳是你的了。';
  }
  return r.desc;
}
function regionActs(r){

  if(r.needs&&!bl(r.needs)) return {info:'要先在部落蓋好碼頭，船才到得了這裡。',A};
  if(g.st==='rebel') return {info:`${r.name}叛變了，不再產出任何東西。`,A:[
    {t:'鎮壓',note:`叛軍 ${estTxt(r)}`,run:()=>crush(r)},
    {t:'談判（30 銀幣）',note:rate(.3+eff('pre')*.04+(has('tongue')?.15:0)),dis:S.silver<30?'需要 30 銀幣':null,run:()=>negotiate(r)}]};
  if(g.st==='yours') return {info:`這裡已經是你的土地${S.jarls&&S.jarls[r.id]?`，由${CHAMPS[S.jarls[r.id]].name}鎮守`:''}。每季產出銀幣 ${r.inc[0]+(has('trade')?4:0)}、糧食 ${r.inc[1]}，駐守 ${(r.kind==='seat'?3:2)-(has('trade')?1:0)} 人。${r.perk?`\n特產：${r.perk}`:''}`,A};
  if(g.st==='ally') return {info:`${r.lord}是你的盟友。每季送來 ${has('tongue')?16:8} 銀幣，出兵時提供戰力 +8。`,A};
  if(r.kind==='minor'){
    A.push({t:'突襲',note:`敵方 ${estOf(rdef(r)*.8)}。搶了就走，戰利品約 ${Math.round(r.loot[0]*lootMul())} 銀幣${r.inf?`，惡名 +${r.inf}`:''}`,dis:g.cd?`他們還在戒備（${g.cd} 季）`:null,run:()=>raid(r)});
    if(S.infamy>=60) A.push({t:'威嚇',note:`不打仗，靠你的惡名逼他們${S.phase===3?'投降':'交出財物'}。${rate(scareChance())}`,dis:g.cd?`他們還在戒備（${g.cd} 季）`:null,run:()=>scare(r)});
    if(S.phase>=3&&r.id==='village'&&S.flags.vSaved&&!S.flags.vBetray) A.push({t:'請村長歸附',note:'不用打仗。他們記得你替他們殺過狼',run:()=>{g.st='yours';addFame(4);log('鹽灘漁村不戰而附。');note('不戰而附',`村長帶著幾個老人走進你的長屋，把一串鑰匙放在桌上。\n\n「如果一定要有人管我們，」他說，「那就讓殺狼的那個人來管。」\n\n<span class="good">${r.name}歸你了</span>，名聲 +4`,'漁村');passTime();}});
    if(S.phase>=3) A.push({t:'征服',note:`敵方 ${estTxt(r)}。攻下時搶走金庫，之後每季產出 ${r.inc[0]} 銀幣、${r.inc[1]} 糧食，要留 2 人駐守`,run:()=>conquer(r)});
    else A.push({t:'征服',dis:'宣告名字（第三章）後才能佔領土地'});

  }
  if(S.phase===2) return {info:`${r.lord}還不把你放在眼裡。先壯大部落，再向挪威宣告你的名字。`,A};
  if(r.id==='winter'){
    const others=SEATS.filter(id=>id!=='winter'&&['yours','ally'].includes(S.reg[id].st)).length;
    if(others<2) return {info:`先拿下另外兩方勢力（${others}/2），老王才會正眼看你。`,A};
    A.push({t:'攻打王廳',note:`敵方 ${estTxt(r)}，之後要連戰御衛長與老王`,run:()=>conquer(r)});
    A.push({t:'逼老王讓位',note:others>=3?rate(abdicateChance()):'需要先拿下其他三方',dis:others>=3?(g.cd?`他還在氣頭上（${g.cd} 季）`:null):'需要先拿下其他三方',run:abdicate});

  if(r.id==='grey') A.push({t:'送禮結盟（30 銀幣）',note:rate(allyChance()),dis:S.infamy>=80?'沒有人願意跟你結盟':S.silver<30?'需要 30 銀幣':g.cd?`他還在氣頭上（${g.cd} 季）`:null,run:allyGrey});
  if(r.id==='eagle') A.push({t:'比武求盟',note:'跟布倫希爾德比武，點到為止',dis:S.infamy>=80?'她不跟惡魔結盟':g.cd?`她要你過陣子再來（${g.cd} 季）`:null,run:allyEagle});
  if(r.id==='red') A.push({t:'赫羅爾夫不接受結盟',dis:'只能用斧頭解決'});
  return {info:r.perk?`拿下後的特產：${r.perk}`:'',A};
}
function raid(r){
  const g=S.reg[r.id];
  battle({title:`突襲${r.name}`,def:rdef(r)*.8,cancel:true,raid:true,intro:r.desc,cause:`死在突襲${r.name}的亂戰中`,onEnd:(w,x)=>{
    g.cd=Math.max(1,4-(bl('dock')>=3?1:0));
    if(!w){log(`突襲${r.name}失敗。`);return '你們空手而回。';}
    const pol=POLICY[S.policy];
    const gross=Math.round(r.loot[0]*rnd(.85,1.15)*lootMul()*(x.nightOk?1.5:1)),f=Math.round(r.loot[1]*rnd(.85,1.15)*(x.nightOk?1.5:1));
    const s=Math.round(gross*pol.take);
    S.silver+=s;S.food+=f;g.def+=2;S.stats.raids++;S.lastRaid=S.turn;if(wx('storm'))g.cd=(g.cd||0)+1;
    const fm=(r.id==='forest'?5:2)+(has('raider')?4:0);addFame(fm);const i0=S.infamy;addInfamy(r.inf);
    addLoyalty(pol.loy);bondAll(pol.bond);
    if(r.id==='abbey'){favor('freyja',-15);S.flags.abbeyRaid=(S.flags.abbeyRaid||0)+1;}
    favor('tyr',S.policy==='fair'?3:S.policy==='all'?-4:0);if(S.policy==='all')favor('loki',2);
    if(S.policy==='fair'){S.stats.fair++;if(S.stats.fair>=5&&!S.flags.ev_fair){S.flags.ev_fair=1;pushModal(eventModal(EV_FAIR));}}
    if(S.policy==='all'){S.stats.greedy++;if(S.stats.greedy%3===0)S.cruel++;}
    log(`突襲${r.name}，搶到 ${gross} 銀幣。`);const vm=r.id==='village'?villageMemo():'';
    return `搶到銀幣 ${gross}（照「${pol.name}」你拿 ${s}）、糧食 ${f}。\n名聲 +${fm}${S.infamy>i0?`，惡名 +${S.infamy-i0}`:''}，忠誠 ${pol.loy>=0?'+':''}${pol.loy}\n${r.name}加強了防備。${vm}`;
  }});
}
function scare(r){

    if(S.phase===3){g.st='yours';addInfamy(3);log(`${r.name}被你的惡名嚇得投降了。`);note('不戰而降',`你只派了一個人去傳話。隔天，${r.name}的長老就帶著鑰匙來了。\n<span class="good">${r.name}歸你了</span>，惡名 +3`,'威嚇');}

  }else{g.def+=3;g.cd=2;note('沒被嚇到',`${r.name}的人把你的使者轟了出去，還連夜加高了圍牆。\n<span class="bad">${r.name}的守備增強了</span>`,'威嚇');}

}
function conquer(r){
  const g=S.reg[r.id];

function takeSeat(r,how){

function rowing(el,header,done){
  const N=4,W=S.relaxed?30:22;let k=0,hit=0,pos=0,dir=1,raf=0,over=false,last=performance.now();
  const speed=(S.relaxed?.09:.12);const newZone=()=>{const l=pick([8,39,70])+ri(-4,4);return [l,l+W];};let zone=newZone();
  el.innerHTML=header+`<p class="hint">跟著鼓聲划槳：指針進到金色區域時按「划！」（或空白鍵）。每划一槳，金色區域的位置都會換。</p>
    <div class="rowbar"><i class="zone" id="rw-z" style="left:${zone[0]}%;width:${W}%"></i><i class="needle" id="rw-n"></i></div>
    <p class="story" id="rw-s" style="font-size:13px;color:var(--muted)">划槳 0/${N}　四槳全中，船隊會像一個人在划</p><button class="primary" id="rw-b">划！</button>`;
  const tick=t=>{if(over)return;pos+=dir*speed*(t-last);last=t;if(pos>100){pos=100;dir=-1;}if(pos<0){pos=0;dir=1;}const n=$('#rw-n');if(n)n.style.left=pos+'%';raf=requestAnimationFrame(tick);};
  const tap=()=>{if(over)return;k++;const ok=pos>=zone[0]&&pos<=zone[1];if(ok)hit++;sfx('drum');
    $('#rw-s').innerHTML=`划槳 ${k}/${N}　${ok?'<span class="good">整齊！</span>':'<span class="bad">亂了</span>'}　（整齊 ${hit}）`;
    if(k>=N){over=true;cancelAnimationFrame(raf);mgKey=null;if(hit===N)S.flags.rowAll=1;done(hit===N?.88:hit===3?.95:hit===2?1:1.05);return;}
    zone=newZone();const z=$('#rw-z');if(z)z.style.left=zone[0]+'%';};
  $('#rw-b').onclick=tap;mgKey=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tap();}};
  raf=requestAnimationFrame(t=>{last=t;tick(t);});
}
// 導航：解謎型（洋流：船一動就漂到撞上礁石或海岸為止）
function seaPuzzle(el,header,done){
  const W=6,H=6;const DIRS={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
  const slide=(p,d,rk)=>{let [x,y]=p;const [dx,dy]=DIRS[d];while(true){const nx=x+dx,ny=y+dy;if(nx<0||nx>=W||ny<0||ny>=H||rk.has(nx+','+ny))break;x=nx;y=ny;}return [x,y];};
  const solve=(rk,goal)=>{const q=[[[0,5],0]];const seen=new Set(['0,5']);while(q.length){const [p,n]=q.shift();if(p[0]===goal[0]&&p[1]===goal[1])return n;for(const d in DIRS){const np=slide(p,d,rk);const k=np.join(',');if(!seen.has(k)){seen.add(k);q.push([np,n+1]);}}}return 0;};
  let rocks,goal,par=0;
  for(let tries=0;tries<400&&!(par>=4&&par<=7);tries++){
    rocks=new Set();while(rocks.size<7){const x=ri(0,5),y=ri(0,5);if(x===0&&y===5)continue;rocks.add(x+','+y);}
    do{goal=[ri(1,5),ri(0,4)];}while(rocks.has(goal.join(',')));
    par=solve(rocks,goal);
  }
  if(!par){rocks=new Set(['3,0']);goal=[2,0];par=solve(rocks,goal);}
  let p=[0,5],moves=0;const limit=par+4;
  const draw=()=>{
    el.innerHTML=header+`<p class="hint">洋流很強：船一動，就會一直漂到撞上礁石 ▲ 或海岸才停下來。讓船剛好停在港口 ⚑ 上。最少 ${par} 步就到得了。</p>
    <div class="seagrid" style="grid-template-columns:repeat(${W},1fr)">${Array.from({length:W*H},(_,i)=>{const x=i%W,y=Math.floor(i/W);const rk=rocks.has(x+','+y);return `<i class="${rk?'rock':''}">${p[0]===x&&p[1]===y?'⛵':x===goal[0]&&y===goal[1]?'⚑':rk?'▲':''}</i>`;}).join('')}</div>
    <div class="seapad"><button data-d="U" aria-label="往上">↑</button><button data-d="L" aria-label="往左">←</button><button data-d="R" aria-label="往右">→</button><button data-d="D" aria-label="往下">↓</button></div>
    <p class="story" style="font-size:13px;color:var(--muted)">已經走了 ${moves}/${limit} 步</p>`;
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>go(b.dataset.d));
  };
  const go=d=>{p=slide(p,d,rocks);moves++;if(p[0]===goal[0]&&p[1]===goal[1]){mgKey=null;done(moves<=par?.9:moves<=par+2?1:1.05);return;}if(moves>=limit){mgKey=null;done(1.08);return;}draw();};
  mgKey=e=>{const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'}[e.key];if(m){e.preventDefault();go(m);}};
  draw();
}

function campaign(o,m){

    el.innerHTML=`<p class="eyebrow">${C.title}</p><h2>你打算怎麼做？</h2>

function osConquer(o,m,intro){
  const g=S.os[o.id];

  battle({title:`${o.kind==='siege'?'圍攻':'攻打'}${o.name}`,def:osDef(o)*m,intro:intro||o.desc,cause:`死在${o.name}的城牆下`,onEnd:w=>{
    if(!w){g.cd=3;g.def+=6;return `${o.name}守住了。你們退回了船上。`;}

    addAlert(5);
    if(o.kind==='siege'){g.st='sacked';const s=Math.round(300*osLootMul()*(has('executioner')?1.5:1));S.silver+=s;addFame(40);addInfamy(15);unlock('paris');log('洗劫了巴黎。');
      return `你們從塞納河上衝進了巴黎。教堂的銀屋頂、國王的金庫，搬了整整三天。\n銀幣 +${s}，名聲 +40，惡名 +15${CAMP.paris.won()}`;}

    if(o.area&&areaOwned(o.area)){const A2=OS_AREAS[o.area];unlock('area_'+o.area);pushLater(el=>resultView(el,A2.name,`${o.land}的最後一塊土地也插上了你的旗。人們開始叫你「${A2.name}」。\n<span class="good">${A2.fx}</span>`,'海外'));}
    const C=CAMP[o.id],extra=C&&C.won?C.won(sp):'';const ep=C&&C.end&&C.end();if(ep)pushLater(el=>cineView(el,[ep],closeModal,C.title));
    return `${o.name}插上了你的旗。\n搶走金庫：銀幣 +${sp}，名聲 +${o.kind==='kingdom'?30:12}${extra}\n之後每季銀幣 ${o.inc[0]}、糧食 ${o.inc[1]}，要留 4 人駐守`;}});

      el.innerHTML=`<p class="eyebrow">冊封雅爾</p><h2>${pc?`讓${CHAMPS[pc].name}鎮守哪裡？`:'把一塊地交給誰？'}</h2>

function marry(k){

}

function rebel(force){
  const pool=REGIONS.filter(r=>S.reg[r.id].st==='yours'&&!S.jarls[r.id]&&!(r.id==='eagle'&&S.spouse==='brynhild'));
  if(!pool.length) return false;
  const r=pick(pool);const g=S.reg[r.id];g.st='rebel';g.def=Math.round(r.def*1.3);g.rebelT=S.turn;
  log(`${r.name}叛變了。`);
  if(!force) pushLater(el=>resultView(el,`${r.name}叛變`,`${r.name}的人趕走了你的駐兵，關上了大門。${S.loyalty<40?'族人對你的不滿，終於爆發了。':S.infamy>=40?'你的惡名讓他們害怕，害怕讓他們拿起了武器。':'總有人覺得，自己比王更適合統治這裡。'}\n<span class="bad">${r.name}不再產出，打開挪威地圖去鎮壓或談判</span>`,'叛亂'));
  return true;
}
function crush(r){
  const g=S.reg[r.id];
  battle({title:`鎮壓${r.name}`,def:rdef(r),cancel:true,intro:'叛軍在柵欄後面等著你。',cause:`死在${r.name}的叛軍手裡`,onEnd:w=>{
    if(!w)return '叛軍守住了。';
    g.st='yours';g.def=r.def;
    pushModal(eventModal({kind:'叛亂',title:'怎麼處置叛軍首領？',text:`${r.name}的叛軍首領被綁到你面前。`,ch:[
      {t:'饒他一命',fx:()=>{addLoyalty(5);S.mercy++;return '你割斷了他的繩子：「回去種你的田。」\n忠誠 +5';}},
      {t:'吊死在城門口',fx:()=>{S.cruel++;addInfamy(5);S.flags.noRebelT=S.turn+12;return '之後很長一段時間，沒有人再敢說一句話。\n惡名 +5（三年內不會再有叛亂）';}}]}));
    return `${r.name}重新回到你手裡。`;}});
}
function negotiate(r){
  const g=S.reg[r.id];
  if(chk(.3+eff('pre')*.04+(has('tongue')?.15:0))){S.silver-=30;g.st='yours';g.def=r.def;addLoyalty(3);note('談和',`你一個人走進了${r.name}，和叛軍首領喝了一整夜的酒。天亮時，大門開了。\n<span class="good">${r.name}回來了。銀幣 -30，忠誠 +3</span>`,'叛亂');}
  else{S.silver-=30;note('談判破裂','他們收下了你的禮物，然後把你的使者趕了出來。\n<span class="bad">銀幣 -30</span>','叛亂');}
  passTime();
}

function prepModal(){
  pushModal(el=>{
    S.prep=S.prep||{};
    el.innerHTML=`<p class="eyebrow">丹麥</p><h2>備戰</h2><p class="story">藍牙遲早會來。趁現在，把錢花在刀口上。每一項只能做一次。</p>
    <div class="choices">${Object.entries(PREP).map(([k,p])=>{const done=S.prep[k],poor=S.silver<p.cost[0]||S.food<p.cost[1];
      return `<button class="choice" data-pp="${k}" ${done||poor?'disabled':''}><b>${p.name}（${p.cost[0]?`${p.cost[0]} 銀幣`:''}${p.cost[1]?`${p.cost[1]} 糧食`:''}）</b><small>${done?'已經完成':`${p.desc}　<span class="rider">${p.fx}</span>`}</small></button>`;}).join('')}
    <button class="ghost" id="pp-x">算了</button></div>`;
    $('#pp-x').onclick=closeModal;
    el.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{const k=b.dataset.pp,p=PREP[k];S.silver-=p.cost[0];S.food-=p.cost[1];S.prep[k]=1;if(k==='temple')addLoyalty(20);log(`備戰：${p.name}。`);
      resultView(el,p.name,`${p.desc}\n<span class="good">${p.fx}</span>`,'備戰');render();});
  });
}
